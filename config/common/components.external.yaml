substitutions:
  ext_comp_repo_url: https://github.com/FutureProofHomes/Satellite1-ESPHome
  ext_comp_repo_ref: staging

external_components:
  - source:
      type: git
      url: ${ext_comp_repo_url}
      ref: ${ext_comp_repo_ref}
    refresh: 1s
    components:
      - crash_report
      - ethernet
      - extram_bss
      - fusb302b
      - i2s_audio
      - memory_flasher
      # Vendored (see esphome/components/micro_wake_word/FPH_VENDOR.md).
      - micro_wake_word
      - mww_runtime_loader
      - satellite1
      - satellite1_radar
      - satellite1_web_ui
      - tas2780
