globals:
  # Global index for our LEDs. So that switching between different animation does not lead to unwanted effects.
  - id: global_led_animation_index
    type: int
    restore_value: no
    initial_value: '0'

# The ring styles: which animation each moment plays (wake word heard, listening, thinking,
# replying, timer running, timer done, volume, muted, error), stored in flash, chosen with the
# "LED Ring Style" select and edited from the web UI's LED Ring page. Every customizable
# control_leds script below calls set_moment() and starts the Styled effect, which asks the
# component for each frame; esphome/components/satellite1_ring/ring_fx_core.h draws it. Classic
# is the look these scripts had before, frame for frame.
satellite1_ring:
  id: ring_fx
  light_id: led_ring
  timer_ratio: !lambda |-
    return float(id(first_active_timer).seconds_left) / max(id(first_active_timer).total_seconds, static_cast<uint32_t>(1));
  volume: !lambda return id(external_media_player).volume;
  mic_muted: !lambda return id(master_mute_switch).state;
  speaker_silent: !lambda return id(external_media_player).volume == 0.0f || id(external_media_player).is_muted();
  style_select:
    id: ring_style_select
    name: LED Ring Style
  moment_sensor:
    id: ring_moment_text
    name: LED Ring Moment
    disabled_by_default: true
  # A web preview started or ended: let the chain below decide what the ring shows now.
  on_preview:
    - script.execute: control_leds

light:
  # Hardware LED ring. Not used because remapping needed
  - platform: esp32_rmt_led_strip
    id: hw_led_ring
    pin: GPIO21
    num_leds: 24
    channel_colors: GRB
    chipset: WS2812

  # User facing LED ring. Remapping of the hardware LEDs.
  # Exposed to be used by the user.
  - platform: partition
    id: led_ring
    name: LED Ring
    entity_category: config
    icon: "mdi:dots-circle"
    default_transition_length: 0ms
    restore_mode: RESTORE_DEFAULT_OFF
    initial_state:
      color_mode: rgb
      brightness: 66%
      red: 9.4%
      green: 73.3%
      blue: 94.9%
    segments:
      - id: hw_led_ring
        from: 0
        to: 23

  # Voice Assistant LED ring. Remapping of the hardware LED.
  # This light is not exposed. The device controls it
  - platform: partition
    id: voice_assistant_leds
    internal: true
    default_transition_length: 0ms
    segments:
      - id: hw_led_ring
        from: 0
        to: 23
    effects:
      # Every customizable moment (see satellite1_ring above): the component knows which moment is
      # active and draws its style. 10ms so Classic's 10ms pulse steps land on time.
      - addressable_lambda:
          name: "Styled"
          update_interval: 10ms
          lambda: id(ring_fx).draw(it, initial_run);
      - addressable_lambda:
          name: "Action Button Touched"
          update_interval: 16ms
          lambda: |-
            if (initial_run) {
              // set voice_assistant_leds light to colors based on led_ring
              auto led_ring_cv = id(led_ring).current_values;
              auto va_leds_call = id(voice_assistant_leds).make_call();
              va_leds_call.from_light_color_values(led_ring_cv);
              va_leds_call.set_brightness( min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f ) );
              va_leds_call.set_state(true);
              va_leds_call.perform();
            }
            auto light_color = id(voice_assistant_leds).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (int i = 0; i < 24; i++) {
              it[i] = color;
            }
      - addressable_twinkle:
          name: "Twinkle"
          twinkle_probability: 50%
      - addressable_lambda:
          name: "Error"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            Color error_color(255, 0, 0);
            for (int i = 0; i < 24; i++) {
              it[i] = error_color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      - addressable_lambda:
          name: "Success"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            static uint8_t counter = 0;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
              counter = 0;
            }
            Color error_color(0, 255, 0);
            for (int i = 0; i < 24; i++) {
              it[i] = error_color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }

      - addressable_lambda:
          name: "Warning"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            static uint8_t blink_count = 0;  // New counter for blink cycles
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
              blink_count = 0;
            }
            Color error_color(255, 0, 0);
            if (blink_count < 5) {  // Only blink 5 times
              for (int i = 0; i < 24; i++) {
                it[i] = error_color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
              }
              if (brightness_decreasing) {
                brightness_step++;
              } else {
                brightness_step--;
              }
              if (brightness_step == 0 || brightness_step == brightness_step_number) {
                brightness_decreasing = !brightness_decreasing;
                if (brightness_step == 0) {  // Completed one blink cycle
                  blink_count++;
                }
              }
            } else {
              // Turn off LEDs after 5 blinks
              for (int i = 0; i < 24; i++) {
                it[i] = Color(0, 0, 0);
              }
            }

      # The web sign-in pairing window: a slow, soft breathe, unhurried on purpose - it has to read
      # as "waiting for you" from across a room for up to a minute without becoming an alarm.
      - pulse:
          name: "Breathe"
          transition_length: 1400ms
          update_interval: 1500ms
          min_brightness: 12%
          max_brightness: 80%

      - addressable_lambda:
          name: "Flashing XMOS"
          update_interval: 333ms
          lambda: |-
            static uint8_t index = 0;
            Color color(0, 0, 255);
            if (initial_run) {
              index = 0;
            }
            for (int i = 0; i < 24; i++) {
              if (i <= index ) {
                it[i] = Color::BLACK;
              } else {
                it[i] = color;
              }
            }
            index = id(global_led_animation_index) % 24;
      - addressable_lambda:
          name: "Factory Reset Coming Up"
          update_interval: 500ms
          lambda: |-
            static uint8_t index = 0;
            Color color(255, 0, 0);
            if (initial_run) {
              index = 0;
            }
            for (int i = 0; i < 24; i++) {
              if (i <= index ) {
                it[i] = color;
              } else {
                it[i] = Color::BLACK;
              }
            }
            index = (index + 1) % 24;
      - addressable_lambda:
          name: "Jack Plugged"
          update_interval: 40ms
          lambda: |-
            static uint8_t index = 0;
            if (initial_run) {
              index = 0;
            }
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            if (index <= 12) {
              for (int i = 0; i < 24; i++) {
                if (i == index) {
                  it[i] = color;
                } else if (i == (24 - index) % 24) {
                  it[i] = color;
                } else {
                  it[i] = Color::BLACK;
                }
              }
            }
            index = (index + 1);
      - addressable_lambda:
          name: "Jack Unplugged"
          update_interval: 40ms
          lambda: |-
            static uint8_t index = 0;
            if (initial_run) {
              index = 0;
            }
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            if (index <= 12) {
              for (int i = 0; i < 24; i++) {
                if (i == 12 - index) {
                  it[i] = color;
                } else if (i == (12 + index) % 24) {
                  it[i] = color;
                } else {
                  it[i] = Color::BLACK;
                }
              }
            }
            index = (index + 1);

script:
  # Master script controlling the LEDs, based on different conditions : initialization in progress, wifi and api connected and voice assistant phase.
  # For the sake of simplicity and re-usability, the script calls child scripts defined below.
  # This script will be called every time one of these conditions is changing.
  - id: control_leds
    then:
      - lambda: |
          id(check_if_timers_active).execute();
          if (id(is_timer_active)){
            id(fetch_first_active_timer).execute();
          }
          if (id(xmos_flashing_state) > 0) {
            id(control_leds_xmos_flasher_state_update).execute();
          } else if (id(improv_ble_in_progress)) {
            id(control_leds_improv_ble_state).execute();
          } else if (id(init_in_progress)) {
            id(control_leds_init_state).execute();
          } else if (!id(api_id).is_connected()) {
            id(control_leds_no_ha_connection_state).execute();
          } else if (id(volume_buttons_touched)) {
            id(control_leds_volume_buttons_touched).execute();
          } else if (id(btn_action).state) {
            id(control_leds_action_button_touched).execute();
          } else if (id(jack_plugged_recently)) {
            id(control_leds_jack_plugged_recently).execute();
          } else if (id(jack_unplugged_recently)) {
            id(control_leds_jack_unplugged_recently).execute();
          } else if (id(warning)) {
            id(control_leds_warning).execute();
          } else if (id(timer_ringing).state) {
            id(control_leds_timer_ringing).execute();
          } else if (id(login_success_flash)) {
            // The just-approved sign-in's green sweep, pinned by a global rather than issued as a
            // bare turn_on from the close handler: the voice pipeline that carried the spoken code
            // is tearing down in these same milliseconds, and its phase changes re-run this script
            // - an unpinned flash gets repainted mid-celebration. The handler in common/web_ui.yaml
            // raises the flag for 1.5s and clears it.
            id(control_leds_login_success).execute();
          } else if (id(login_window_active) &&
                     id(voice_assistant_phase) != ${voice_assist_waiting_for_command_phase_id} &&
                     id(voice_assistant_phase) != ${voice_assist_listening_for_command_phase_id} &&
                     id(voice_assistant_phase) != ${voice_assist_thinking_phase_id}) {
            // A web sign-in is waiting for its button press or voice answer. Below mute, timers
            // and the warning states, which all say something more urgent than "someone is
            // logging in". The breathe yields to the mic-open and processing phases on purpose
            // (owner request, September 23 2026): when the spoken-code turn opens the mic, the
            // ring runs its usual listening spin - the cue to say the code now - and the thinking
            // pattern covers the transcription wait. Everything else in the window keeps the
            // breathe, the prompt itself included (its phase is "replying").
            id(control_leds_login_window).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_waiting_for_command_phase_id}) {
            id(control_leds_voice_assistant_waiting_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_listening_for_command_phase_id}) {
            id(control_leds_voice_assistant_listening_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_thinking_phase_id}) {
            id(control_leds_voice_assistant_thinking_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_replying_phase_id}) {
            id(control_leds_voice_assistant_replying_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_error_phase_id}) {
            id(control_leds_voice_assistant_error_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_not_ready_phase_id}) {
            id(control_leds_voice_assistant_not_ready_phase).execute();
          } else if (id(ring_fx).is_previewing()) {
            // The LED Ring page playing a moment on the device: below every voice phase and alert,
            // so a real wake word always wins, and above timers, mute and idle.
            id(control_leds_ring_preview).execute();
          } else if (id(is_timer_active)) {
            id(control_leds_timer_ticking).execute();
          } else if (id(master_mute_switch).state) {
            id(control_leds_muted_or_silent).execute();
          } else if (id(external_media_player).volume == 0.0f || id(external_media_player).is_muted()) {
            id(control_leds_muted_or_silent).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_idle_phase_id}) {
            id(control_leds_voice_assistant_idle_phase).execute();
          }

  # Each script below names its moment to ring_fx first: the customizable ones because the Styled
  # effect draws whatever moment is active, the fixed ones so the LED Ring page's live ring and the
  # LED Ring Moment sensor say what the ring is showing. Brightness floors stay here: max(ring, 20%)
  # for the conversation, 10% more for alerts.

  # Script executed during Improv BLE
  # Warm White Twinkle
  - id: control_leds_improv_ble_state
    then:
      - lambda: id(ring_fx).set_moment("improv");
      - light.turn_on:
          brightness: 66%
          red: 100%
          green: 89%
          blue: 71%
          id: voice_assistant_leds
          effect: "Twinkle"

  # Script executed during initialization
  # Blue Twinkle if network is connected, Else solid warm white
  - id: control_leds_init_state
    then:
      - lambda: id(ring_fx).set_moment("init");
      - if:
          condition:
            - lambda: 'return id(network_setup_completed);'
          then:
            - light.turn_on:
                brightness: 66%
                red: 9.4%
                green: 73.3%
                blue: 94.9%
                id: voice_assistant_leds
                effect: "Twinkle"
          else:
            - light.turn_on:
                brightness: 33%
                red: 100%
                green: 89%
                blue: 71%
                id: voice_assistant_leds
                effect: "none"

  # Script executed when the device has no connection to Home Assistant
  # Red Twinkle (This will be visible during HA updates for example)
  - id: control_leds_no_ha_connection_state
    then:
      - lambda: id(ring_fx).set_moment("no_ha");
      - light.turn_on:
          brightness: 66%
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Twinkle"

  # Script executed when the voice assistant is idle (waiting for a wake word)
  # Nothing, or the LED Ring light's plain color when the user has turned it on.
  - id: control_leds_voice_assistant_idle_phase
    then:
      - lambda: id(ring_fx).set_moment("idle");
      - light.turn_off: voice_assistant_leds
      - if:
          condition:
            light.is_on: led_ring
          then:
            light.turn_on: led_ring

  # Script executed when the voice assistant is waiting for a command (After the wake word)
  # Classic: slow clockwise spin of the LED ring.
  - id: control_leds_voice_assistant_waiting_for_command_phase
    then:
      - lambda: id(ring_fx).set_moment("wake");
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Styled"

  # Script executed when the voice assistant is listening to a command
  # Classic: fast clockwise spin of the LED ring.
  - id: control_leds_voice_assistant_listening_for_command_phase
    then:
      - lambda: id(ring_fx).set_moment("listen");
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Styled"

  # Script executed when the voice assistant is thinking to a command
  # Classic: the spin stops and LEDs 2 and 14 blink while the command is processed.
  - id: control_leds_voice_assistant_thinking_phase
    then:
      - lambda: id(ring_fx).set_moment("think");
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Styled"

  # Script executed when the voice assistant is replying
  # Classic: fast anticlockwise spin of the LED ring.
  - id: control_leds_voice_assistant_replying_phase
    then:
      - lambda: id(ring_fx).set_moment("reply");
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Styled"

  # Script executed when the voice assistant is in error
  # Classic: fast red pulse. Red in every style.
  - id: control_leds_voice_assistant_error_phase
    then:
      - lambda: id(ring_fx).set_moment("err");
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: "Styled"
      - delay: 2s
      - lambda: id(volume_buttons_touched) = false;
      - script.execute: control_leds

  # Script executed when the voice assistant requires user action
  # 5 Fast Red Pulses
  - id: control_leds_warning
    then:
      - lambda: id(ring_fx).set_moment("warning");
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Warning"
      - delay: 2s
      - lambda: id(warning) = false;
      - script.execute: control_leds

  # Script executed when the voice assistant is muted or silent
  # Red marks by the 2 microphones / by the speaker grill, over the style's base (Classic: the
  # LED Ring light if it is on).
  - id: control_leds_muted_or_silent
    then:
      - lambda: id(ring_fx).set_moment("mute");
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: "Styled"

  # Script executed when the voice assistant is not ready
  - id: control_leds_voice_assistant_not_ready_phase
    then:
      - lambda: id(ring_fx).set_moment("not_ready");
      - light.turn_on:
          brightness: 66%
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Twinkle"

  # Script executed when the volume button is touched
  # Classic: a number of LEDs turn on indicating the volume of the media player entity.
  - id: control_leds_volume_buttons_touched
    then:
      - lambda: id(ring_fx).set_moment("vol");
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: "Styled"

  # Script executed when the jack has just been unplugged
  # A ripple effect
  - id: control_leds_jack_unplugged_recently
    then:
      - lambda: id(ring_fx).set_moment("jack_out");
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: "Jack Unplugged"

  # Script executed when the jack has just been plugged
  # A ripple effect
  - id: control_leds_jack_plugged_recently
    then:
      - lambda: id(ring_fx).set_moment("jack_in");
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Jack Plugged"

  # Script executed while a web sign-in pairing window is open
  # A slow breathe in the app's accent blue, whatever color the ring is otherwise set to - the
  # login page tells the user to look for it, so it has to look the same on every device.
  - id: control_leds_login_window
    then:
      - lambda: id(ring_fx).set_moment("login");
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.25f );
          red: 1.2%
          green: 66%
          blue: 96%
          id: voice_assistant_leds
          effect: "Breathe"

  # The approved sign-in's green sweep, held for as long as login_success_flash is up (1.5s, raised
  # and cleared by the close handler in common/web_ui.yaml). A script of its own so the chain above
  # can re-assert it against the pipeline-teardown repaints.
  - id: control_leds_login_success
    then:
      - lambda: id(ring_fx).set_moment("login_ok");
      - light.turn_on:
          id: voice_assistant_leds
          brightness: 66%
          effect: "Success"

  # Script executed when the center button is touched
  # The complete LED ring turns on
  - id: control_leds_action_button_touched
    then:
      - lambda: id(ring_fx).set_moment("action");
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: "Action Button Touched"

  # Script executed when the timer is ringing, to control the LEDs
  # Classic: the LED ring blinks.
  - id: control_leds_timer_ringing
    then:
      - lambda: id(ring_fx).set_moment("ring");
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: "Styled"

  # Script executed when the timer is ticking, to control the LEDs
  # The lit arc is the remaining time as a fraction of the full ring.
  - id: control_leds_timer_ticking
    then:
      - lambda: id(ring_fx).set_moment("timer");
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: "Styled"

  # A moment or support signal the LED Ring page asked to see on the device. ring_fx fills in the
  # call: the moment, its brightness floor, and the effect (Styled, or the fixed signal's own).
  - id: control_leds_ring_preview
    then:
      - lambda: |-
          auto call = id(voice_assistant_leds).make_call();
          id(ring_fx).apply_preview(call);
          call.perform();

  # Script executed while the XMOS firmware is being flashed, and when it finishes.
  - id: control_leds_xmos_flasher_state_update
    then:
      - if:
          condition:
            lambda: 'return id(xmos_flashing_state) == 1;'
          then:
            - lambda: id(ring_fx).set_moment("xmos");
            - light.turn_on:
                brightness: !lambda return .6f ;
                id: voice_assistant_leds
                effect: "Flashing XMOS"
          else:
            - lambda: 'id(ring_fx).set_moment(id(xmos_flashing_state) == 3 ? "xmos_fail" : "xmos_done");'
            - light.turn_on:
                brightness: !lambda return .6f ;
                id: voice_assistant_leds
                effect: !lambda 'return id(xmos_flashing_state) == 3 ? "Error" : "Success" ;'
            - delay: 1s
            - light.turn_off:
                id: voice_assistant_leds
