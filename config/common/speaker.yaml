globals:
  # Global variable tracking if the jack has been plugged touched.
  - id: jack_plugged_recently
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking if the jack has been unplugged touched.
  - id: jack_unplugged_recently
    type: bool
    restore_value: no
    initial_value: 'false'
  # Tracks whether TAS2780 is currently active
  - id: tas2780_active
    type: bool
    restore_value: no
    initial_value: 'false'

audio_dac:
  - platform: pcm5122
    id: line_out_dac
    address: 0x4D
  - platform: tas2780
    id: speaker_dac
    address: 0x3F
  - platform: satellite1
    id: dac_proxy
    speaker_dac: speaker_dac
    line_out_dac: line_out_dac

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_dout_pin: GPIO9
    bits_per_sample: 32bit
    i2s_audio_id: i2s_shared
    dac_type: external
    channel: stereo
    timeout: never
    audio_dac: dac_proxy
    # buffer_duration: 100ms

  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never
        buffer_duration: 100ms

  # Vritual speakers to resample each pipelines' audio, if necessary, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

number:
  # The TAS2780's analog output level (AMP_LEVEL): index 0-20 maps to 11-21 dBV in 0.5 dBV steps,
  # and the app's Speaker amplifier card renders it in dBV. The chip's own default - index 8,
  # 15 dBV - is the value every device has always shipped with, so it is the initial value here and
  # the level the app marks "(default)". The full range is offered deliberately: the TAS2780's
  # limiter and brown-out prevention own supply safety, so the top of the range distorts or ducks
  # under a 5 V supply rather than harming anything.
  #
  # `internal: true`, a web-UI-only control like the display-unit switches: an amplifier gain knob
  # in every Home Assistant dashboard is an invitation to automation nobody asked for. The web
  # server's include_internal is what still carries it to the app.
  #
  # set_action stores the level on the component and writes the register; every amp activation
  # re-runs init(), which ends in update_register() and re-applies the stored member - so the
  # restored value survives reboots, power-mode changes and XMOS flashes with no extra wiring.
  # At boot the restore fires before the amp is set up, which is fine for the same reason: the
  # early register write lands on a chip about to be reset, and the member re-applies at
  # activation.
  - platform: template
    id: amp_gain_level
    name: "Speaker Amp Analog Gain"
    icon: "mdi:amplifier"
    entity_category: config
    internal: true
    min_value: 0
    max_value: 20
    step: 1
    mode: slider
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 8
    set_action:
      - tas2780.update_config:
          id: speaker_dac
          amp_level_idx: !lambda "return (uint8_t) x;"

select:
  - platform: template
    name: Speaker channel output
    id: tas_mode_select
    icon: "mdi:speaker-multiple"
    options:
      - "Mono (Left + Right)"
      - "Left Channel Only"
      - "Right Channel Only"
    initial_option: "Mono (Left + Right)"
    entity_category: config
    optimistic: true
    restore_value: true
    on_value:
      - tas2780.update_config:
          channel: !lambda |-
            auto index = id(tas_mode_select).active_index();
            if (index.has_value()){
              return index.value();
            }
            ESP_LOGI("main", "No channel selected");
            return 0;

script:
  # TAS activation remeasures the supplies and selects the applicable power mode.
  - id: tas2780_ensure_active
    mode: single
    then:
      - tas2780.activate:
      - lambda: id(tas2780_active) = id(speaker_dac).is_active();

  # Both DACs require the XMOS-provided I2S clocks before their outputs are selected.
  - id: activate_audio_output
    mode: restart
    then:
      # Flashing holds the XMOS in reset for as long as it runs, so the outputs have to stay put
      # until it is done, however long that takes.
      - while:
          condition:
            memory_flasher.in_progress:
          then:
            - delay: 1s
      # Wait for the XMOS, but not forever. It gives up after three attempts about four seconds in,
      # and a device whose XMOS never answers is better off driving its outputs deaf than staying
      # silent until the next reboot.
      - wait_until:
          condition:
            lambda: return id(xmos_audio_ready);
          timeout: 20s
      - if:
          condition:
            lambda: return !id(xmos_audio_ready);
          then:
            - logger.log:
                level: WARN
                format: "XMOS never reported ready; activating audio output without it"
      # A restored line-out selection is invalid when no jack is connected.
      - if:
          condition:
            lambda: |-
              return !id(audio_output_speaker_requested) && !id(line_out_sensor).state &&
                     id(dac_proxy).active_dac == 1;
          then:
            - lambda: id(audio_output_speaker_requested) = true;
      - if:
          condition:
            lambda: return id(audio_output_speaker_requested);
          then:
            - script.execute: tas2780_ensure_active
            - script.wait: tas2780_ensure_active
            - if:
                condition:
                  lambda: return id(tas2780_active);
                then:
                  - dac_proxy.activate_speaker:
          else:
            - dac_proxy.activate_line_out:
      # Switching outputs swaps which DAC is live, and the two have very different volume
      # curves (31.5 dB vs 47.25 dB across the usable range), so the ducking that goes with a
      # given level is not the same on both and the gain state has to be re-derived on every
      # switch. DACProxy re-applies the volume itself as part of activating a DAC, which is what
      # keeps the level right in the gap before this script's reconcile lands.
      - script.execute: audio_gain_reconcile

  - id: refresh_audio_output
    mode: restart
    then:
      - script.execute: activate_audio_output

  - id: activate_internal_speaker
    mode: single
    then:
      - logger.log: "Activating internal speaker"
      - lambda: id(audio_output_speaker_requested) = true;
      - script.execute: activate_audio_output

  - id: activate_line_out
    mode: single
    then:
      - logger.log: "Activating line-out audio"
      - lambda: id(audio_output_speaker_requested) = false;
      - script.execute: activate_audio_output

api:
  actions:
    - action: activate_speaker_dac
      then:
        - script.execute: activate_internal_speaker

    - action: activate_lineout_dac
      then:
        - script.execute: activate_line_out

binary_sensor:
  - platform: gpio
    id: line_out_sensor
    pin:
      pcm5122:
      number: 3
      inverted: false
    name: "Line-Out Connected"
    icon: "mdi:audio-input-stereo-minijack"
    filters:
      - delayed_on: 200ms
      - delayed_off: 200ms

    on_press:
      - script.execute: activate_line_out
      - lambda: id(jack_plugged_recently) = true;
      - script.execute: control_leds
      - delay: 200ms
      - script.execute:
          id: play_sound
          priority: false
          sound_file: "jack_connected_sound"
      - delay: 800ms
      - lambda: id(jack_plugged_recently) = false;
      - script.execute: control_leds

    on_release:
      - script.execute: activate_internal_speaker
      - lambda: id(jack_unplugged_recently) = true;
      - script.execute: control_leds
      - delay: 200ms
      - script.execute:
          id: play_sound
          priority: false
          sound_file: "jack_disconnected_sound"
      - delay: 800ms
      - lambda: id(jack_unplugged_recently) = false;
      - script.execute: control_leds
