globals:
  # Global variable tracking if the jack has been plugged touched.
  - id: jack_plugged_recently
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking if the jack has been unplugged touched.
  - id: jack_unplugged_recently
    type: bool
    restore_value: no
    initial_value: 'false'

audio_dac:
  - platform: pcm5122
    id: line_out_dac
    address: 0x4D
  - platform: tas2780
    id: speaker_dac
    address: 0x3F
    activation_guard: !lambda return id(satellite1_id).audio_available();
  - platform: satellite1
    id: dac_proxy
    speaker_dac: speaker_dac
    line_out_dac: line_out_dac
    volume_state:
      id: audio_volume_state

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_dout_pin: GPIO9
    bits_per_sample: 32bit
    i2s_audio_id: i2s_shared
    dac_type: external
    channel: stereo
    timeout: never
    audio_dac: dac_proxy
    # buffer_duration: 100ms

  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never
        buffer_duration: 100ms

  # Vritual speakers to resample each pipelines' audio, if necessary, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

select:
  - platform: template
    name: Speaker channel output
    id: tas_mode_select
    icon: "mdi:speaker-multiple"
    options:
      - "Mono (Left + Right)"
      - "Left Channel Only"
      - "Right Channel Only"
    initial_option: "Mono (Left + Right)"
    entity_category: config
    optimistic: true
    restore_value: true
    on_value:
      - tas2780.update_config:
          channel: !lambda |-
            auto index = id(tas_mode_select).active_index();
            if (index.has_value()){
              return index.value();
            }
            ESP_LOGI("main", "No channel selected");
            return 0;

script:
  # Wrappers choose intent only. The proxy owns all preparation and readiness.
  - id: refresh_audio_output
    mode: restart
    then:
      - lambda: |-
          if (id(line_out_sensor).has_state())
            id(dac_proxy).observe_jack_state(id(line_out_sensor).state);
          id(dac_proxy).refresh_output();

  - id: activate_internal_speaker
    mode: single
    then:
      - logger.log: "Activating internal speaker"
      - dac_proxy.activate_speaker:

  - id: activate_line_out
    mode: single
    then:
      - logger.log: "Activating line-out audio"
      - dac_proxy.activate_line_out:

api:
  actions:
    - action: set_dac_outputs_enabled
      variables:
        speaker_enabled: bool
        line_out_enabled: bool
      then:
        - lambda: |-
            const auto revision = id(dac_proxy).output_settings_revision();
            if (!id(dac_proxy).set_outputs_enabled(speaker_enabled, line_out_enabled)) {
              ESP_LOGW("dac_proxy", "Output settings rejected or preference save failed");
              return;
            }
            // Refresh automatic intent only. Enablement must not discard a manual
            // single/dual activation request; no-op requests leave preparation alone.
            if (id(dac_proxy).output_settings_revision() != revision && id(line_out_sensor).has_state())
              id(dac_proxy).refresh_automatic_routing(id(line_out_sensor).state);
    - action: set_active_dac_outputs
      variables:
        speaker_active: bool
        line_out_active: bool
      then:
        - lambda: |-
            if (!id(dac_proxy).set_active_outputs(speaker_active, line_out_active))
              ESP_LOGW("dac_proxy", "Activation settings rejected or preference save failed");
    - action: set_automatic_routing
      then:
        - lambda: |-
            if (!id(line_out_sensor).has_state() ||
                !id(dac_proxy).set_automatic_routing(id(line_out_sensor).state))
              ESP_LOGW("dac_proxy", "Automatic routing unavailable or preference save failed");
    - action: set_speaker_volume
      variables:
        volume: float
      then:
        - lambda: |-
            if (!id(audio_volume_state).set_output_volume(satellite1::SPEAKER, volume))
              ESP_LOGW("dac_proxy", "Speaker volume rejected or preference save failed");
    - action: set_lineout_volume
      variables:
        volume: float
      then:
        - lambda: |-
            if (!id(audio_volume_state).set_output_volume(satellite1::LINE_OUT, volume))
              ESP_LOGW("dac_proxy", "Line-out volume rejected or preference save failed");
    - action: activate_speaker_dac
      then:
        - script.execute: activate_internal_speaker

    - action: activate_lineout_dac
      then:
        - script.execute: activate_line_out

    - action: set_speaker_volume_limits
      variables:
        min_db: float
        max_db: float
      then:
        - dac_proxy.set_volume_limits:
            id: dac_proxy
            output: speaker
            min_db: !lambda return min_db;
            max_db: !lambda return max_db;

    - action: set_lineout_volume_limits
      variables:
        min_db: float
        max_db: float
      then:
        - dac_proxy.set_volume_limits:
            id: dac_proxy
            output: line_out
            min_db: !lambda return min_db;
            max_db: !lambda return max_db;

binary_sensor:
  - platform: gpio
    id: line_out_sensor
    use_interrupt: false
    pin:
      pcm5122:
      number: 3
      inverted: false
    name: "Line-Out Connected"
    icon: "mdi:audio-input-stereo-minijack"
    filters:
      - delayed_on: 200ms
      - delayed_off: 200ms

    on_press:
      - lambda: |-
          if (!id(dac_proxy).observe_jack_state(true))
            ESP_LOGW("dac_proxy", "Jack routing preference save failed");
      - lambda: id(jack_plugged_recently) = true;
      - script.execute: control_leds
      - delay: 200ms
      - script.execute:
          id: play_sound
          priority: false
          sound_file: "jack_connected_sound"
      - delay: 800ms
      - lambda: id(jack_plugged_recently) = false;
      - script.execute: control_leds

    on_release:
      - lambda: |-
          if (!id(dac_proxy).observe_jack_state(false))
            ESP_LOGW("dac_proxy", "Jack routing preference save failed");
      - lambda: id(jack_unplugged_recently) = true;
      - script.execute: control_leds
      - delay: 200ms
      - script.execute:
          id: play_sound
          priority: false
          sound_file: "jack_disconnected_sound"
      - delay: 800ms
      - lambda: id(jack_unplugged_recently) = false;
      - script.execute: control_leds
