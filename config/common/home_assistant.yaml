api:
  id: api_id
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: control_leds
  on_client_disconnected:
    - script.execute: control_leds
  encryption:   # Uses key set by Home Assistant

button:
  # Restarts Sat1 Device
  - platform: restart
    name: "Restart Sat1"
    entity_category: diagnostic

  # Restores the Sat1 ESP back to factory settings
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset ESP32 FW"
    entity_category: diagnostic
    internal: true

switch:
  # Wake Word Sound Switch.
  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Effective inhibition is separate from the persisted software preference.
  - platform: satellite1
    id: master_mute_switch
    satellite1_id: satellite1_id
    icon: "mdi:microphone-off"
    name: Mute Microphones
    entity_category: config
    hardware_mute:
      id: btn_left
      name: "Button Left (HW Mute)"
      icon: "mdi:microphone-off"
    on_unmute_rejected:
      - lambda: id(warning) = true;
      - script.execute: control_leds
    on_hardware_mute_change:
      - if:
          condition:
            lambda: return id(satellite1_id).audio_available();
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: !lambda 'return muted ? "mute_switch_on_sound" : "mute_switch_off_sound";'
    on_turn_on:
      # Stop capture without cancelling a response that no longer uses the mic.
      - if:
          condition:
            lambda: return id(va_microphone_source).is_running();
          then:
            - voice_assistant.stop:
      - script.execute: control_leds
    on_turn_off:
      - script.execute: control_leds

text_sensor:
  - platform: template
    id: pd_state_text
    name: "USB-C Power Supply"
    icon: "mdi:usb-c-port"
    entity_category: "diagnostic"
    update_interval: never
    lambda: |-
      if( id(pd_fusb302b).state == power_delivery::PD_STATE_DISCONNECTED){
        return std::string("Detached");
      } else {
        return id(pd_fusb302b).contract;
      }

  - platform: template
    id: xmos_firmware_version_text
    name: "XMOS Firmware"
    icon: "mdi:memory"
    entity_category: "diagnostic"
    update_interval: never
    lambda: return id(satellite1_id).status_string();
