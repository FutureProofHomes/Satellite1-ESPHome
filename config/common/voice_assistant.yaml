substitutions:
  # Phases of the Voice Assistant
  # The voice assistant is ready to be triggered by a wake word
  voice_assist_idle_phase_id: '1'
  # The voice assistant is waiting for a voice command (after being triggered by the wake word)
  voice_assist_waiting_for_command_phase_id: '2'
  # The voice assistant is listening for a voice command
  voice_assist_listening_for_command_phase_id: '3'
  # The voice assistant is currently processing the command
  voice_assist_thinking_phase_id: '4'
  # The voice assistant is replying to the command
  voice_assist_replying_phase_id: '5'
  # The voice assistant is not ready
  voice_assist_not_ready_phase_id: '10'
  # The voice assistant encountered an error
  voice_assist_error_phase_id: '11'

globals:
  # Global variable tracking the phase of the voice assistant (defined above). Initialized to not_ready
  - id: voice_assistant_phase
    type: int
    restore_value: no
    # initial_value: ${voice_assist_not_ready_phase_id}
  # True from the moment a TTS response starts streaming until the announcement pipeline drains.
  # Set before any audio exists, which is what lets audio_gain_reconcile reach the voice level ahead
  # of a response this device produced; one arriving from elsewhere is recognized by the pipeline's
  # HTTP source instead. Either way, wake/timer/button chimes stay at the media level.
  - id: tts_playing
    type: bool
    restore_value: no
    initial_value: 'false'
  # Gain state computed by audio_gain_reconcile. Written only by that script, so the
  # apply_ducking templates and audio_gain_raise all see one consistent set of values.
  - id: media_duck_db
    type: int
    restore_value: no
    initial_value: '0'
  - id: announcement_duck_db
    type: int
    restore_value: no
    initial_value: '0'
  - id: dac_target_volume
    type: float
    restore_value: no
    initial_value: '0.55f'

microphone:
  - platform: satellite1
    id: sat1_mics
    sample_rate: 48000
    i2s_din_pin: GPIO15
    bits_per_sample: 32bit
    channel: stereo
    pdm: false
    adc_type: external
    i2s_audio_id: i2s_shared

micro_wake_word:
  id: mww
  models:
    - model: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/wake-word/hey_jarvis.json
      id: hey_jarvis
    - model: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/wake-word/okay_nabu.json
      id: okay_nabu
    - model: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/wake-word/stop.json
      id: stop
      internal: true
  vad:
  microphone:
    microphone: sat1_mics
    channels: 1
    gain_factor: 6
  stop_after_detection: false
  on_wake_word_detected:
    # Ahead of every gate on purpose: whatever this firing becomes - a conversation, a consumed
    # sign-in symbol, a silenced alarm - the model just scored its own wake word, and those scores
    # must not read as "room pressure" in the loader's high-water telemetry. This only opens a 2s
    # exclusion window and parks the score; it records nothing a gate below would want hidden.
    # The recording happens at the drain: push_wake_detection (inside the sign-in gate, below)
    # collects the parked score via take_detection_score, and THAT is what commits the firing to
    # the persisted Living Graph ring - so a firing consumed as a sign-in symbol never becomes a
    # dot any signed-in browser could read the challenge off of.
    - lambda: id(mww_loader)->notify_detection(wake_word);
    # An open offline-mode sign-in window claims every firing: the wake words are the challenge's
    # alphabet, and consume_login_wake records this one as a symbol instead of letting it start
    # the assistant. One thing outranks it - a ringing timer. "Stop" must silence the alarm even
    # mid-challenge (an alarm that cannot be stopped by voice because someone is signing in would
    # be the worse bug), so the firing is only offered to the gate when nothing is ringing; the
    # short-circuit means the symbol is simply not recorded and the challenge can be re-answered.
    # False the rest of the time, at the cost of one string compare - see common/web_ui_login.yaml
    # for the whole flow.
    - if:
        condition:
          lambda: return id(timer_ringing).state || !id(web_ui_app)->consume_login_wake(wake_word);
        else:
          # A consumed challenge symbol. When the gate says it kept the answer on track, blip the
          # ring green (common/web_ui_login.yaml) - the in-room twin of the login page's
          # un-bolding chips. A wrong symbol blips nothing; the single quiet-period verdict still
          # owns saying so.
          - if:
              condition:
                lambda: return id(web_ui_app)->take_login_symbol_ok();
              then:
                - script.execute: login_symbol_flash
        then:
          # The detection ring behind the app's "say it now" test moment and the Diagnostics
          # history. Inside the gate on purpose: a firing the sign-in challenge consumed is an
          # answer to a secret, and must not land in a history any signed-in browser can read.
          - lambda: id(web_ui_app)->push_wake_detection(wake_word);
          # An open test window claims the firing next (owner request, September 2026): the person
          # is checking whether a freshly downloaded word fires at all, and the ring push above is
          # the whole answer - starting a conversation on every attempt made testing miserable. A
          # ringing timer outranks the window for the same reason it outranks the sign-in gate:
          # an alarm that voice cannot stop because a browser somewhere is testing would be the
          # worse bug.
          - if:
              condition:
                lambda: return id(timer_ringing).state || !id(web_ui_app)->wake_test_active();
              then:
                # If the wake word is detected when the device is muted (Possible with the software mute
                # switch): Do nothing
                - if:
                    condition:
                      switch.is_off: master_mute_switch
                    then:
                      # If a timer is ringing: Stop it, do not start the voice assistant (We can stop timer from voice!)
                      - if:
                          condition:
                            switch.is_on: timer_ringing
                          then:
                            - switch.turn_off: timer_ringing
                          # Stop voice assistant if running
                          else:
                            - if:
                                condition:
                                  voice_assistant.is_running:
                                then:
                                  # A response this device routed elsewhere is playing there too, so the local
                                  # stop fans out. The script's own guard makes it free when nothing was routed.
                                  - voice_assistant.stop:
                                  - script.execute: tts_remote_stop
                                # Stop any other media player announcement
                                else:
                                  - if:
                                      condition:
                                        media_player.is_announcing:
                                          id: external_media_player

                                      then:
                                        # Ahead of the local stop on purpose: the broadcast's guard reads the
                                        # announcement source's state, and stopping the pipeline is what makes
                                        # that unreadable. Order is enough - the stop below is a command the
                                        # media player processes on its own loop, after this guard has run.
                                        - script.execute: tts_stop_broadcast
                                        - media_player.stop:
                                            announcement: true
                                            id: external_media_player
                                        # The usual path for "stop" mid-response: the pipeline has ended by the
                                        # time the audio is still playing, so is_running above is already false.
                                        - script.execute: tts_remote_stop
                                      # Start the voice assistant and play the wake sound, if enabled
                                      else:
                                        # Ahead of the local chime so the call is out before the 300ms below,
                                        # and outside the switch beneath it because that one governs this
                                        # device's speaker alone - each target's own Wake sound decides for
                                        # itself. Everything that suppresses the local chime still suppresses
                                        # this: muted microphones, a ringing timer, a running assistant and an
                                        # announcement already playing are all branches that never reach here.
                                        - script.execute: remote_wake_chime_send
                                        - if:
                                            condition:
                                              switch.is_on: wake_sound
                                            then:
                                              - script.execute:
                                                  id: play_sound
                                                  priority: true
                                                  sound_file: "wake_word_triggered_sound"
                                              - delay: 300ms
                                        - voice_assistant.start:
                                            wake_word: !lambda return wake_word;

# Runtime wake word loading: the device's two wake word slots, which the web app's Primary/Secondary
# pickers write. A slot holds a built-in model id or a microWakeWord manifest URL; URLs are
# downloaded into PSRAM over the existing http_request client, validated, and handed to
# micro_wake_word's runtime model API. The model itself is never stored in flash - the slot
# remembers the URL and fetches it again on boot (owner decision, September 2026). The component
# also owns the invariant that a model is enabled exactly when a slot names it, and adopts wake
# word changes Home Assistant makes through its own select, so the two faces cannot fight.
mww_runtime_loader:
  id: mww_loader
  micro_wake_word_id: mww
  # The advertised wake word set changed - a downloaded word arrived or left. Home Assistant only
  # reads a device's wake word list when it connects, and this protocol generation has no
  # configuration-changed push, so it is asked to reload this device's config entry: it
  # disconnects, reconnects, re-fetches the voice assistant configuration, and rebuilds the wake
  # word selects with the new word in their options. Deterministic where the loader's old
  # connection drop was a hope (the stale "No Wake Word" select was a reconnect whose re-read never
  # came), and it works with the browser closed - the app's pairing loop is a second layer, not the
  # only writer. Same mechanism and same jinja as the radar's entity-layout reload in mmwave.yaml;
  # tts_self_entry_jinja is defined in tts_routing.yaml and both packages are always included by
  # satellite1.base.yaml. The brief entity flicker a reload causes in HA dashboards is accepted
  # (same trade the radar package made). If Home Assistant is not connected there is nothing to do:
  # its next connection starts with a fresh fetch anyway.
  on_wake_word_set_changed:
    - if:
        condition: api.connected
        then:
          - logger.log: "Wake word set changed; asking Home Assistant to reload this device"
          - homeassistant.service:
              service: homeassistant.reload_config_entry
              data_template:
                entry_id: >-
                  ${tts_self_entry_jinja}
                  {{ ns.entry }}
              variables:
                mac: !lambda 'return esphome::get_mac_address_pretty();'

voice_assistant:
  id: va
  microphone:
    microphone: sat1_mics
    channels: 0

  media_player: external_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  volume_multiplier: 1
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - micro_wake_word.start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_client_disconnected:
    - voice_assistant.stop:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: control_leds
  on_error:
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds
    - script.execute: release_tts_playback_level

  # When the voice assistant starts: Play a wake up sound, duck audio.
  on_start:
    - script.execute: audio_gain_reconcile
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: control_leds
  # What the device heard, for the Voice card in the web UI. Held in a ring of eight on the device
  # and never written to flash, so this is a "what did it mishear" readout rather than a history.
  #
  # The pairing window gets first refusal: while an online-mode sign-in is waiting for its spoken
  # code, the transcript is the answer to a challenge, not a query. Consumed means the pipeline is
  # stopped before the intent stage can ship the code to the conversation agent, the utterance
  # stays off the Voice card, and the mic reopens for another attempt if the gate left any - the
  # gate itself counts the misses and closes the window on the third.
  on_stt_end:
    - if:
        condition:
          lambda: return id(web_ui_app)->consume_login_transcript(x);
        then:
          - voice_assistant.stop:
          # If the window is still pending after the gate saw the transcript, the attempt was
          # wrong - flag it so the next prompt says so instead of replaying the welcome. A match
          # closes the window, login_voice_pending() reads false, and the flag stays untouched.
          - lambda: |-
              if (id(web_ui_app)->login_voice_pending())
                id(login_code_retry) = true;
          - script.execute: login_code_relisten
        else:
          - lambda: id(web_ui_app)->push_utterance(x, true);
  on_intent_progress:
    - if:
        condition:
          # A nonempty x variable means a streaming TTS url was sent to the media player
          lambda: 'return !x.empty();'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
          # The response is now audio, not a chime, so let it play at the Voice Override level.
          - lambda: id(tts_playing) = true;
          - script.execute: audio_gain_reconcile
  on_tts_start:
    - if:
        condition:
          # The intent_progress trigger didn't start the TTS Reponse
          lambda: 'return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
    - lambda: id(tts_playing) = true;
    # The reply, paired with the on_stt_end line above so the card can show both halves. Not during
    # a spoken-code sign-in window: the announce path fires this trigger with the prompt text, and
    # the prompt CONTAINS the code - on_stt_end already keeps the spoken answer off the card, and
    # printing the question would hand the secret to whoever is already signed in while someone
    # else is proving presence.
    - if:
        condition:
          lambda: 'return !id(web_ui_app)->login_voice_pending();'
        then:
          - lambda: id(web_ui_app)->push_utterance(x, false);
    - script.execute: audio_gain_reconcile
  # When the voice assistant ends ...
  on_end:
    # While a spoken-code sign-in window is open, the conversation has to keep reopening. A turn
    # started by login_code_converse (assist_satellite.start_conversation) ends on VAD silence if the
    # person has not answered yet - the common case, since the prompt takes a moment to process - and
    # without re-arming here their reply lands when nothing is listening and the window idles to its
    # 60s timeout (the reported bug). The re-arm is guarded and delayed inside login_code_relisten,
    # and it stops on its own the moment the window approves or closes, since login_voice_pending()
    # then reads false. Only fires during a pending spoken-code window; a normal wake-word
    # conversation reads false here and skips it.
    - if:
        condition:
          lambda: 'return id(web_ui_app)->login_voice_pending();'
        then:
          - script.execute: login_code_relisten
    - wait_until:
        not:
          voice_assistant.is_running:
    # Runs in its own script so the phase/LED reset below is not held up by the tail of the
    # response, which can still have seconds of audio left in the announcement pipeline.
    - script.execute: release_tts_playback_level
    # Stop the script that would potentially enable the stop word if the response is longer than a second
    - script.stop: activate_stop_word_if_tts_step_is_long
    # Disable the stop word (If the tiemr is not ringing)
    - if:
        condition:
          switch.is_off: timer_ringing
        then:
    # - lambda: id(stop).disable();
    # If the end happened because of an error, let the error phase on for a second
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    # Reset the voice assistant phase id and reset the LED animations.
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds

  on_timer_finished:
    - switch.turn_on: timer_ringing
  on_timer_started:
    - script.execute: control_leds
  on_timer_cancelled:
    - script.execute: control_leds
  on_timer_updated:
    - script.execute: control_leds
  on_timer_tick:
    - script.execute: control_leds

script:
  # Script used activate the stop word if the TTS step is long.
  # Why is this wrapped on a script?
  #   Becasue we want to stop the sequence if the TTS step is faster than that.
  #   This allows us to prevent having the deactivation of the stop word before its own activation.
  - id: activate_stop_word_if_tts_step_is_long
    then:
      - delay: 1s
      # Enable stop wake word
      # - lambda: id(stop).enable();

  # Arms the stop word for an announcement this device did not produce - a response another
  # Satellite1 routed here, or a tts.speak - so the person standing next to whichever speaker is
  # talking can say "stop" and be heard by it. Own responses are activate_stop_word_once's job
  # below, told apart by tts_playing, which only this device's own pipeline sets.
  #
  # Fired from external_media_player's on_announcement, which is a state edge - it does not fire
  # again when a chime hands over to the response with the state never leaving ANNOUNCING. Hence
  # the wait: the script outlives the chime and arms when the HTTP source starts, rather than
  # sampling once at an instant when the chime is what is playing. The timeout covers the case
  # where no speech follows - a bare chime, a timer - and mode: restart makes a burst of
  # announcements collapse into the newest.
  - id: announce_stop_word_arm
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: |-
              return id(http_announcement_source).get_state() ==
                     media_source::MediaSourceState::PLAYING;
          timeout: 5s
      - if:
          condition:
            and:
              - switch.is_on: stop_word_interrupt
              - switch.is_off: timer_ringing
              - lambda: 'return !id(tts_playing);'
              - lambda: |-
                  return id(http_announcement_source).get_state() ==
                         media_source::MediaSourceState::PLAYING;
              - media_player.is_announcing:
                  id: external_media_player
          then:
            - micro_wake_word.enable_model: stop
            - wait_until:
                not:
                  media_player.is_announcing:
                    id: external_media_player
            - if:
                condition:
                  and:
                    - switch.is_off: timer_ringing
                    - lambda: 'return !id(tts_playing);'
                then:
                  - micro_wake_word.disable_model: stop

  - id: activate_stop_word_once
    then:
      - delay: 1s
      # Enable stop wake word. The toggle gates only this response-interrupt arming; a ringing
      # timer arms the model from timer.yaml regardless, because silencing a timer by voice is
      # behaviour people already have and should not lose to a switch about answers.
      - if:
          condition:
            and:
              - switch.is_off: timer_ringing
              - switch.is_on: stop_word_interrupt
          then:
            - micro_wake_word.enable_model: stop
            - wait_until:
                not:
                  media_player.is_announcing:
                    id: external_media_player
            - if:
                condition:
                  switch.is_off: timer_ringing
                then:
                  - micro_wake_word.disable_model: stop

  # Single owner of the shared output gain. The mixer has no per-pipeline gain of its own (a
  # source speaker's set_volume forwards straight to the shared output speaker), so the only way
  # to make voice louder than music is to raise the DAC and duck each channel back down to the
  # level it should have had. Everything below is a pure function of the current state, so
  # running it from any trigger at any time converges on the same answer; nothing latches.
  #
  # See docs/TTS-Routing.md for the gain model and what holding the DAC high costs.
  - id: audio_gain_reconcile
    mode: restart
    then:
      - lambda: |-
          // dB per unit of media player volume. The span comes from DACProxy; 0.9 is the media
          // player's own volume remap (volume_min: 0.1, volume_max: 1.0 in media_player.yaml),
          // and it and dac_target_volume below have to move together.
          const float db_per_unit = id(dac_proxy).volume_span_db() * 0.9f;

          // Deepest duck the mixer can apply: DECIBEL_REDUCTION_TABLE has 51 entries and
          // apply_ducking() clamps to size() - 1, so asking for more is silently the same thing.
          const int max_duck = 50;

          const float media_vol = id(external_media_player).volume;
          // 0 on the slider means "no override": voice follows the media volume. Resolved here
          // so the sentinel stays out of the gain math, where 0.0 would duck the response by the
          // full media level.
          //
          // has_state() is not padding: Number::state is uninitialized until its first
          // publish_state(), and the media player publishes its own volume from setup(), which
          // fires on_volume and lands here - so this can run before the slider has restored.
          const float voice_setting =
              id(tts_volume).has_state() ? id(tts_volume).state / 100.0f : 0.0f;
          const float voice_vol = (voice_setting > 0.0f) ? voice_setting : media_vol;
          // The level the DAC is driven to, so whichever channel needs to be loudest can reach
          // its own level without a boost. Deliberately not conditional on anything speaking:
          // holding it here is what lets an announcement this device did not initiate - and so
          // had no warning of - start at the right level on its first sample.
          const float ref = (voice_vol > media_vol) ? voice_vol : media_vol;

          const bool voice_active =
              id(va).is_running() ||
              id(external_media_player).state == media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ||
              id(timer_ringing).state;

          int media_duck = (int) (db_per_unit * (ref - media_vol) + 0.5f);
          if (voice_active) {
            media_duck += 20;
          }

          int ann_duck;
          if (id(tts_routing_to_remote) && id(tts_playing) && !id(web_ui_app)->selection().local_speaker()) {
            // Silence the local response; it has been asked to play only on the remote targets. With
            // the app's "Local Speaker" row ticked - which is how it ships - the response is routed
            // and played here as well, falling through below like any other speech.
            ann_duck = max_duck;
          } else {
            // Announcements arriving over HTTP are speech, whoever sent them: this device's own
            // response, a tts.speak, or one another Satellite1 routed here. All play at the voice
            // level, because no announce_volume ever reaches the firmware; docs/TTS-Routing.md
            // explains why. Chimes come from the audio-file source instead and still track the
            // media volume, so raising Voice Override cannot make the wake sound scary.
            //
            // tts_playing stays in the test even though it implies an HTTP announcement: it is
            // set at on_intent_progress, before any audio exists, which is what gives
            // audio_gain_raise time to finish before a local response starts.
            const bool http_announcement =
                id(http_announcement_source).get_state() == media_source::MediaSourceState::PLAYING;
            const float ann_ref = (id(tts_playing) || http_announcement) ? voice_vol : media_vol;
            ann_duck = (int) (db_per_unit * (ref - ann_ref) + 0.5f);
          }

          id(media_duck_db) = clamp(media_duck, 0, max_duck);
          id(announcement_duck_db) = clamp(ann_duck, 0, max_duck);
          // The same remap the media player applies to its own volume, against ref instead of
          // media_vol. That is what makes DACProxy's floor exact rather than approximate: the two
          // writers differ only in their input.
          id(dac_target_volume) = 0.1f + ref * 0.9f;

          // Compared against the floor, not the level the DAC is at: the media player writes its
          // own volume from I2SAudioSpeaker::loop(), which lands after this script has run, so the
          // hardware says nothing about what this script last asked for.
          //
          // Lowering is safe at any moment - buffered audio just plays a little quieter than
          // intended. Raising has to wait for the ducking below to reach the samples already in
          // flight, so that is left to audio_gain_raise.
          if (id(dac_target_volume) <= id(dac_proxy).volume_floor() + 0.005f) {
            id(dac_proxy).set_volume_floor(id(dac_target_volume));
          }

          ESP_LOGD("audio_gain",
                   "media %.2f, voice %.2f, ref %.2f -> media duck %d dB, announcement duck %d dB, "
                   "DAC %.2f (now %.2f)",
                   media_vol, voice_vol, ref, id(media_duck_db), id(announcement_duck_db),
                   id(dac_target_volume), id(dac_proxy).volume());
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: !lambda return (uint8_t) id(media_duck_db);
          duration: 0.0s
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: !lambda return (uint8_t) id(announcement_duck_db);
          duration: 0.0s
      - if:
          condition:
            lambda: 'return id(dac_target_volume) > id(dac_proxy).volume_floor() + 0.005f;'
          then:
            # The wait only protects music already mixed and queued, so skip it when the media
            # channel is stopped with an empty buffer - an announcement this device did not start
            # is already streaming by the time the reconciler runs, and the delay would play its
            # first 800ms at the old level and then jump. Worst case for skipping is the tail of
            # already-finished media playing a moment louder than it would have.
            - if:
                condition:
                  lambda: |-
                    return id(media_mixing_input).is_stopped() &&
                           !id(media_mixing_input).has_buffered_data();
                then:
                  - script.stop: audio_gain_raise
                  - lambda: id(dac_proxy).set_volume_floor(id(dac_target_volume));
                else:
                  - script.execute: audio_gain_raise

  # Deferred half of the reconciler: raise the DAC only once the ducking above has reached the audio
  # already queued downstream, or music blasts for a moment. i2s_audio_speaker defaults to
  # buffer_duration: 500ms on top of the mixer's 100ms, so ~600ms is genuinely in flight. Its own
  # script so a burst of volume events re-arms the delay rather than discarding a committed raise.
  - id: audio_gain_raise
    mode: restart
    then:
      - delay: 800ms
      - lambda: id(dac_proxy).set_volume_floor(id(dac_target_volume));

  # The voice assistant pipeline ends before its audio does, so hold the announcement channel
  # at the Voice Override level until the response has actually drained. Dropping to the chime
  # level any earlier makes the tail of the response jump.
  - id: release_tts_playback_level
    mode: restart
    then:
      - wait_until:
          condition:
            not:
              media_player.is_announcing: external_media_player
          timeout: 30s
      - lambda: id(tts_playing) = false;
      - script.execute: audio_gain_reconcile

switch:
  # Whether a spoken "stop" can cut off the assistant mid-answer. Gates the arming in
  # activate_stop_word_once above, not the model itself: the stop model stays internal and
  # disabled at boot, and a ringing timer still arms it from timer.yaml with this off.
  #
  # internal: true - this is a web-app control (the Voice Input card), reached over the web
  # server's REST under include_internal. Home Assistant's wake word slots know nothing about
  # the stop model, so nothing there can fight this switch.
  - platform: template
    id: stop_word_interrupt
    name: "Say Stop To Interrupt"
    icon: "mdi:stop-circle-outline"
    entity_category: config
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# The "Wake word sensitivity" selects are gone (owner decision, September 20 2026). Sensitivity is
# the Wake Word Tuner's job now - the web app measures the room and the customer's voice and applies
# a threshold - and a five-option select cannot express a measured value; a control that can only
# misrepresent the real one is worse than none. The tuner writes through mww_runtime_loader, which
# persists per slot and re-applies at boot.
