substitutions:
  jack_connected_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/jack_connected.flac
  jack_disconnected_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/jack_disconnected.flac
  mute_switch_on_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/mute_switch_on.flac
  mute_switch_off_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/mute_switch_off.flac
  # MP3 rather than FLAC, and local rather than the S3 bucket, for the sounds that travel: the
  # timer ring, the wake chime and the stop clip are served to non-Satellite1 routing targets
  # straight off this device's flash (GET /api/sat1/sounds/<name>.mp3 in satellite1_web_ui), and a
  # Sonos AudioClip accepts MP3 and WAV only - hand it FLAC and it reports success and plays
  # nothing, the same silent failure the TTS codec swap in tts_routing.yaml exists to prevent. One
  # embedded copy serves both local playback (the decoder handles MP3 fine) and remote fetches, so
  # the format has to be the travelling one. Local files rather than S3 so the bytes a release
  # plays are the bytes its repository reviewed - the same provenance reasoning as the login clips.
  #
  # All three are STEREO (September 2026): a mono clip lands on a Sonos soundbar's center channel
  # only and sounds thin; stereo renders across the bar. Joint stereo of a duplicated channel
  # costs ~2% extra flash. The local mono announcement pipeline plays them unchanged - the decode
  # chain carries the file's own channel count and the mixer maps it onto its 2-channel output.
  timer_finished_sound_file: sounds/timer_finished.mp3
  wake_word_triggered_sound_file: sounds/wake_word_triggered.mp3
  # ~0.4s faint fading 550 Hz tone. The Sonos stop preempt in tts_routing.yaml: a playing
  # AudioClip cannot be cancelled through Home Assistant, but a new LOW-priority clip interrupts
  # a playing LOW clip at any time, so announcing this IS the stop. Deliberately not digital
  # silence - a field-tested pure-silence MP3 failed to register as a clip - and quiet enough to
  # read as an acknowledgment, not an announcement. Nothing plays it locally.
  stop_clip_sound_file: sounds/stop_clip.mp3
  factory_reset_initiated_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/factory_reset_initiated.mp3
  factory_reset_cancelled_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/factory_reset_cancelled.mp3
  factory_reset_confirmed_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/factory_reset_confirmed.mp3
  center_button_press_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/center_button_press.flac
  center_button_double_press_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/center_button_double_press.flac
  center_button_triple_press_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/center_button_triple_press.flac
  center_button_long_press_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/center_button_long_press.flac

audio_file:
  - id: factory_reset_initiated_sound
    file: ${factory_reset_initiated_sound_file}
  - id: factory_reset_cancelled_sound
    file: ${factory_reset_cancelled_sound_file}
  - id: factory_reset_confirmed_sound
    file: ${factory_reset_confirmed_sound_file}
  - id: jack_connected_sound
    file: ${jack_connected_sound_file}
  - id: jack_disconnected_sound
    file: ${jack_disconnected_sound_file}
  - id: mute_switch_on_sound
    file: ${mute_switch_on_sound_file}
  - id: mute_switch_off_sound
    file: ${mute_switch_off_sound_file}
  - id: timer_finished_sound
    file: ${timer_finished_sound_file}
  - id: wake_word_triggered_sound
    file: ${wake_word_triggered_sound_file}
  - id: stop_clip_sound
    file: ${stop_clip_sound_file}
  - id: center_button_press_sound
    file: ${center_button_press_sound_file}
  - id: center_button_double_press_sound
    file: ${center_button_double_press_sound_file}
  - id: center_button_triple_press_sound
    file: ${center_button_triple_press_sound_file}
  - id: center_button_long_press_sound
    file: ${center_button_long_press_sound_file}
  # Half a second of true silence, 8kHz mono, ~8KB of flash. The remote sync guard in
  # tts_routing.yaml enqueues it 1-4 times behind a routed response so the announcement pipeline
  # stays in ANNOUNCING past the remote targets' playback skew - which is the one lever YAML has
  # over when the assistant reopens the microphone. See tts_routing.yaml for why a clip and not a
  # delay.
  - id: routing_guard_silence_sound
    file: sounds/routing_guard_silence.wav

media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
  - platform: audio_http
    id: http_media_source
    buffer_size: 500000

media_player:
  - platform: speaker_source
    id: external_media_player
    name: Media Player
    volume_increment: 0.05
    volume_min: 0.1
    volume_max: 1.0
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 1  # Stereo audio is unnecessary for announcements
      sample_rate: 48000
      sources:
        - audio_file_announcement_source
        - http_announcement_source
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 2
      sample_rate: 48000
      sources:
        - http_media_source

    on_mute:
      - script.execute: control_leds
    on_unmute:
      - script.execute: control_leds
    on_volume:
      - script.execute: control_leds
      # The media player writes the new volume straight to the DAC on its way down the
      # speaker chain, so re-derive the whole gain state against it.
      - script.execute: audio_gain_reconcile
    # Duck the media channel while an announcement plays
    on_announcement:
      - script.execute: audio_gain_reconcile
      # Arm the stop word if this announcement turns out to be speech - a response another
      # Satellite1 routed here, or a tts.speak. The script waits out any chime in front and
      # sorts speech from chimes itself; see voice_assistant.yaml, which owns it.
      - script.execute: announce_stop_word_arm

    # Restore audio ducking when not actively playing announcements or running voice assistant
    on_state:
      - script.execute: audio_gain_reconcile

script:
  # Script executed when we want to play sounds on the device.
  - id: play_sound
    parameters:
      priority: bool
      sound_file: string
    then:
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true
      - lambda: |-
          if ( (id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }

  # Script to increased/decreased volume
  - id: control_volume
    mode: restart
    parameters:
      increase_volume: bool  # True: Increase volume / False: Decrease volume.
    then:
      - delay: 16ms
      - if:
          condition:
            lambda: return increase_volume;
          then:
            - media_player.volume_up:
                id: external_media_player
          else:
            - media_player.volume_down:
                id: external_media_player
      - script.execute: control_leds
      - delay: 2s
      - lambda: id(volume_buttons_touched) = false;
      - script.execute: control_leds
