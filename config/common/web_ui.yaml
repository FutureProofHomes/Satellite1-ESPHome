####################################################################################################
# The device's own web server.
#
# Until now nothing in config/ declared web_server:. The radar tuner ran its own esp_http_server on
# port 80 behind the "Radar Tuner WebUI" switch, and satellite1_radar faked USE_WEBSERVER so Home
# Assistant would offer a "Visit device" link to it. This file replaces all of that with the real
# component, which the tuner is now a handler on and which the on-device web app builds on.
#
# A note on the port and iOS, because it was chased in the wrong direction once and the record should
# save the next person the trip. The server is on 80.
#
# iOS Safari, with iCloud Private Relay on, shows a full-page "This Connection Is Not Private"
# interstitial before it will connect to some cleartext-HTTP destinations. It looks like an HTTP or a
# port problem and is neither: the trigger is that the destination is on a *different subnet from the
# iPhone*. Private Relay leaves the phone's own local subnet alone and engages for everything else,
# and for off-subnet cleartext HTTP to a private IP it cannot protect, it warns. Pinned down on
# hardware: with the device and Home Assistant on the same port and scheme, HA (same subnet as the
# phone) loaded clean while the device (on an IoT VLAN) warned - IP or .local made no difference, and
# neither did moving the port from 80 to 8080 to 8123. Nothing the server does can change it, because
# the interstitial is shown before any byte is exchanged. So the port earns nothing by being unusual,
# and 80 is the friendlier choice - http://<device>/ with no port to type. The real fixes for a
# segmented network are documented in docs/web-ui.md: turn off "Limit IP Address Tracking" for that
# Wi-Fi, put the phone on the device's subnet, or front the device with an HTTPS reverse proxy.
#
# No auth: block. Authentication moved into satellite1_web_ui's session gate: browsers sign in once
# - password, or a press of the action button, or a spoken challenge - and hold a 90-day cookie, so
# iOS stops demanding credentials on every visit (it never saves HTTP-auth logins). The same
# username and password still work as HTTP digest for curl and scripts; the gate checks them
# itself. Do not re-add an auth: block: web_server_base would wrap every handler in a digest
# middleware *behind* the cookie check and lock every signed-in browser out. The component's config
# validation refuses it with this explanation.
#
# Turning the server on hands the network every entity this device has, so read the notes below
# before changing anything here.
####################################################################################################

substitutions:
  web_ui_username: satellite1

  # Leave empty and the device invents a password on first boot and remembers it - see the on_boot
  # block below. Set it to share one password across a fleet, which is the only reason to: ten
  # Satellite1s otherwise mean ten different passwords to look up.
  #
  # The value is pasted into a C++ string literal, so a quote or a backslash in it breaks the build.
  web_ui_password: ""

globals:
  # Owns the password's storage for the life of the process. The session gate copies what it is
  # handed, but this global is also what the Web UI Password sensor publishes from, and keeping one
  # authoritative copy beats reasoning about two. Never assigned after the on_boot block.
  - id: web_ui_password_value
    type: std::string
    restore_value: true
    max_restore_data_length: 32

  # Gates the Web UI switch's actions until the on_boot block at 200 below has applied the
  # restored state. The switch restores long before WebServer::setup() takes its init()
  # reference, and a deinit() fired that early would underflow web_server_base's refcount.
  - id: web_ui_listener_ready
    type: bool
    restore_value: no
    initial_value: 'false'

  # Whether the listener is running, so the switch's actions are idempotent. HA re-sends turn_on
  # for a switch that is already on; without this guard that would take a second init() reference
  # the next turn_off could never release.
  - id: web_ui_listener_on
    type: bool
    restore_value: no
    initial_value: 'true'

esphome:
  on_boot:
    # 600 is after globals restore (DATA, 800) and before WebServer::setup() starts listening
    # (WIFI - 1.0f, 249), so no request can ever be served against the placeholder password.
    - priority: 600.0
      then:
        - lambda: |-
            // A per-device password that is not a secret is worse than none, because it looks like
            // security. The MAC is the obvious source and is exactly that: anyone who can reach the
            // device can already read its MAC off the network. So this is random on first boot and
            // persisted, which costs the customer one lookup in Home Assistant and is genuinely
            // unguessable.
            //
            // Alphabet drops l, 1, 0 and o. This is a value people read off a screen and type into
            // a browser prompt.
            //
            // Both names are prefixed because this lambda is pasted into main.cpp after the whole
            // ESP-IDF define soup: an earlier draft called the first one CONFIGURED and hit a
            // predefined macro of that name.
            static const std::string WEB_UI_YAML_PASSWORD{"${web_ui_password}"};
            if (!WEB_UI_YAML_PASSWORD.empty()) {
              id(web_ui_password_value) = WEB_UI_YAML_PASSWORD;
            } else if (id(web_ui_password_value).empty()) {
              static const char WEB_UI_PASSWORD_ALPHABET[] = "abcdefghijkmnpqrstuvwxyz23456789";
              std::string generated;
              generated.reserve(12);
              for (int i = 0; i < 12; i++) {
                generated.push_back(
                    WEB_UI_PASSWORD_ALPHABET[esphome::random_uint32() % (sizeof(WEB_UI_PASSWORD_ALPHABET) - 1)]);
              }
              id(web_ui_password_value) = generated;
            }

            // To the session gate, not to web_server_base: the gate owns authentication now -
            // cookie sessions for browsers, the same digest check for curl and scripts - and
            // web_server_base must never see a username, because Credentials::is_set() is what
            // decides whether later handlers get wrapped in the digest middleware the gate
            // replaces. Priority 600 puts this after the restore above and before the gate
            // computes its session token at setup priority 250.
            id(web_ui_app)->set_credentials("${web_ui_username}", id(web_ui_password_value));
            id(web_ui_password_text).publish_state(id(web_ui_password_value));

    # The on-demand listener. 200 runs after WebServer::setup() has taken web_server_base's one
    # permanent init() reference - the reference that kept the server always-on. This applies the
    # restored switch state once: deinit() at refcount zero stops httpd and frees its task stack,
    # socket table and listener mailbox (~8KB); init() re-adds every registered handler, so the
    # app and the radar tuner come back whole.
    - priority: 200.0
      then:
        - lambda: |-
            id(web_ui_listener_ready) = true;
            if (!id(web_ui_enabled).state) {
              id(web_ui_listener_on) = false;
              web_server_base::global_web_server_base->deinit();
              ESP_LOGI("web_ui", "Web UI switch is off; HTTP listener stopped");
            }

web_server:
  id: web_ui_server
  # 80, the default HTTP port, so the app is reached at a bare http://<device>/ with no port to type.
  # The port does not affect the iOS Private Relay interstitial (see the header); there is no reason
  # to serve anywhere else.
  port: 80

  # Version 2 rather than 3 (900KB of embedded frontend) or 1 (deprecated, removed in 2027.1.0).
  #
  # local: true is not a preference. Every version defaults css_url and js_url to oi.esphome.io, and
  # a device that has to reach the internet to render its own settings page is not a device people
  # can trust in a closet. Everything ships in the firmware.
  version: 2
  local: true

  # The web app is meant to show controls the Home Assistant UI deliberately does not, so entities
  # marked internal: true still have to reach it. Nothing depends on this yet; it is set here
  # because it belongs with the rest of the server's shape.
  include_internal: true

  log: true

  # The device already has ESPHome OTA and safe_mode. A second, browser-facing firmware upload form
  # is attack surface with nothing behind it.
  ota: false

  # No auth: block, deliberately - see the header. The session gate in satellite1_web_ui fronts
  # every handler on this server, including the entity REST API and /events, and speaks both cookie
  # sessions and the old digest credentials.

  # web_server (2025.11+) refuses cross-origin browser requests to the entity REST API unless the
  # origin is allowed here - a CSRF guard for devices whose POSTs are unauthenticated. Ours are
  # not: the session gate above denies every entity request that lacks a session cookie, a ?key=
  # bearer or digest credentials, so origin enforcement adds nothing here - and it would break the
  # single-origin device switcher, where a peer Satellite1's page (an origin that cannot be listed,
  # because every home's device names and DHCP leases differ) drives this device's entities with a
  # key. The wildcard therefore delegates the whole question to the gate, which is where the actual
  # security lives. A forged cross-site POST from some malicious page gets no key (it lives in the
  # peer page's memory) and no cookie (SameSite=Lax withholds it from cross-site POSTs), so the
  # gate answers 401 exactly as it would for curl without credentials.
  allowed_origins: ["*"]

# The on-device web app. Registers at setup_priority::WIFI (250) so it lands ahead of web_server
# (WIFI - 1.0f = 249) in web_server_base's handler vector and answers "/" instead of ESPHome's own
# dashboard. It is also served at /ui/, which is the canary if that ordering ever regresses.
satellite1_web_ui:
  id: web_ui_app

  # Timers and the assistant's phase, for GET /api/sat1/voice. Neither is an entity: get_timers() is
  # a plain vector on the voice_assistant component, and the phase is the `voice_assistant_phase`
  # global that voice_assistant.yaml already maintains from its own triggers - read here rather than
  # mirrored into a text_sensor, so there is only ever one copy to go stale.
  voice_assistant_id: va
  voice_phase: !lambda "return id(voice_assistant_phase);"

  # Which wake words are armed, for GET/POST /api/sat1/wakewords. Also not an entity: micro_wake_word
  # creates no switch and no select for its models, so before this the only place to turn "Hey Jarvis"
  # off was Home Assistant's own wake word picker. The models' enabled flags are persisted by ESPHome
  # itself, and voice_assistant is the only other thing that writes them, so both ends move one stored
  # flag rather than keeping rival copies of it.
  #
  # That last point is true and not the whole story, which is worth knowing before changing anything here.
  # Home Assistant does not think in flags: it keeps two slots, each pairing a wake word with a pipeline,
  # and VoiceAssistant::on_set_configuration answers a slot write by disabling every model and re-enabling
  # only the ones the slots name. So a wake word this endpoint turned on, but that no slot names, is one
  # Home Assistant will turn off again the next time anybody touches a slot. The app closes that by keeping
  # the slots equal to the armed set - see useAssist in frontend/src/lib/device.js and the `asst` notes in
  # web_ui_ha.yaml - which is why the two endpoints are not as independent as their URLs suggest.
  #
  # The `stop` model is not offered here. It is declared internal in voice_assistant.yaml and timer.yaml
  # arms it only while a timer is ringing, so a switch over it would be rewritten from under the reader.
  micro_wake_word_id: mww

  # The local speaker player, for GET/POST /api/sat1/media - web_server has no media_player handler,
  # so the endpoints are the only way the app sees or moves it. Its Sendspin counterpart is named in
  # common/sendspin.yaml beside the player it points at; the endpoints prefer that one while it is
  # playing.
  media_player_id: external_media_player

  # The two sounds the routing feature mirrors to third-party speakers, served at
  # GET /api/sat1/sounds/<name> straight from the audio_file bytes in flash (session-gate exempt;
  # the fetcher is a Sonos or Cast with no session). The keys are the URL tails the calls in
  # tts_routing.yaml render - change one and the other must move with it. Both files are MP3 in
  # media_player.yaml because a Sonos AudioClip accepts MP3 and WAV only.
  sounds:
    timer_finished.mp3: timer_finished_sound
    wake_word_triggered.mp3: wake_word_triggered_sound

  # Whether a voice approval could be heard right now, read when a pairing window opens. Only the
  # hardware mute slider counts: it is the one mute software cannot clear, so it alone forces a
  # button-only window (and the login page says so, from the poll's hw flag). A software mute is no
  # obstacle - the window-open handler below lifts it before announcing, on the reasoning that a
  # person asking for voice sign-in has answered the question of whether the device may speak.
  login_mic_available: !lambda "return !id(btn_left).state;"

  # The pairing window opening: LED on, then the mode's announcement. The scripts live in
  # common/web_ui_login.yaml. `mode` is button/code/seq; `secret` is the spoken code's digits, or
  # the challenge sequence as symbol indices ("012" = Hey Jarvis, Okay Nabu, Stop). The secret
  # exists only here and as audio in the room - the browser that asked never sees it, which is what
  # makes saying it back proof of presence.
  on_login_window:
    - lambda: id(login_window_active) = true;
    - script.execute: control_leds
    # A software mute would swallow the announcement and the reply alike. Lift it for voice
    # windows - and remember that we did, because the close handler below puts it back. The mute
    # was somebody's deliberate choice, and the request that opens a window is unauthenticated by
    # design, so the lift must never outlive the window it served. The guard inside turn_on/
    # turn_off means this cannot fight the hardware slider (and a hardware-muted device never
    # reaches here with a voice mode anyway).
    - if:
        condition:
          and:
            - lambda: return mode != "button";
            - switch.is_on: master_mute_switch
        then:
          - lambda: 'id(login_lifted_mute) = true;'
          - switch.turn_off: master_mute_switch
    - if:
        condition:
          lambda: return mode == "code";
        then:
          # Stash the code for every re-prompt, then speak-and-listen in one action.
          - lambda: 'id(login_code_value) = secret;'
          - script.execute: login_code_converse
    - if:
        condition:
          lambda: return mode == "seq";
        then:
          - script.execute:
              id: login_announce_seq
              seq: !lambda return secret;

  # The window closing, whatever closed it. Stop whatever stage the announcement machinery was in,
  # hand the wake models back (see login_models_restore for the ringing-timer edge), and say how it
  # went: green sweep and the press chime for an approval, the warning pulses for a denial, and a
  # quiet return to normal for a window that simply ran out.
  on_login_window_end:
    - lambda: id(login_window_active) = false;
    - script.stop: login_code_converse
    - script.stop: login_announce_seq
    - script.stop: login_code_relisten
    - script.execute: login_models_restore
    # The software mute goes back exactly as the open handler found it. Whatever ended the window
    # - approval included - the mute predates the sign-in and outlives it; the signed-in user can
    # unmute from the app, with a session to their name.
    - if:
        condition:
          lambda: 'return id(login_lifted_mute);'
        then:
          - lambda: 'id(login_lifted_mute) = false;'
          - switch.turn_on: master_mute_switch
    - if:
        condition:
          lambda: return result == "approved";
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: "center_button_press_sound"
          - light.turn_on:
              id: voice_assistant_leds
              brightness: 66%
              effect: "Success"
          - delay: 1500ms
          - script.execute: control_leds
        else:
          - if:
              condition:
                lambda: return result == "denied";
              then:
                # The warning global drives five red pulses through control_leds and clears itself
                # there, exactly as tts_call_flash uses it.
                - lambda: id(warning) = true;
          - script.execute: control_leds

  # Which entity backs which control in the app.
  #
  # web_server identifies entities by their display name in both directions - /events publishes
  # "<domain>/<name>" and the REST path is /<domain>/<name>/<action> - so without this table the
  # frontend would have to contain about twenty-five display names, and renaming any entity in YAML
  # would break a control with nothing to catch it. The device resolves each key from get_name() at
  # runtime instead, and a deleted entity becomes a compile error here rather than a dead button on
  # a customer's phone.
  #
  # One of these cannot be hardcoded at all: the update entity is declared `name: None`, which
  # ESPHome renders as the device name, so its path carries the MAC suffix and differs on every
  # device ever built.
  #
  # Keys are the app's vocabulary and are safe to rename alongside the frontend. The ids on the
  # right are the contract with the rest of config/.
  entities:
    sensors:
      temp: temperature_sensor
      humidity: humidity_sensor
      lux: ambient_light_sensor
      # The one Diagnostics reading that is an entity rather than a field of GET /api/sat1/state.
      # Heap, PSRAM, loop time, uptime and reset reason are all read straight from the IDF in the
      # handler, which is cheaper and needs no entity - but the chip temperature means owning an
      # esp_driver_tsens handle, and debug.yaml declares an internal_temperature platform of its own.
      # Two owners of that driver is a conflict, so it is declared once below and promoted there.
      esp_temp: esp_temperature_sensor

    numbers:
      temp_offset: temp_offset_ui
      humidity_offset: humidity_offset_ui
      lux_offset: lux_offset_ui
      voice_override: tts_volume
      remote_tts_volume: remote_tts_volume
      duck_volume: duck_area_volume

    # No `texts:` block. The routing target list used to be here, as a text entity the tree wrote a
    # comma-separated list into on every change - and that entity caps at 255 characters, which is
    # roughly half of what one area's worth of players needs. The selection moved into this component
    # and the app reads and writes it at /api/sat1/sel instead.

    lights:
      ring: led_ring

    # Note what is *not* here: `firmware` and `beta_firmware`. The OTA update entity and its beta
    # channel switch are declared in config/satellite1.yaml, which the ESPHome Device Builder path
    # never includes - dashboard.yaml pulls satellite1.base.yaml and dashboard_build.yaml only. This
    # file is a package two levels inside base.yaml, so referencing them here would resolve locally
    # and fail every dashboard build on an unknown id. They are added from satellite1.yaml instead,
    # where they exist, and the app treats them as optional.
    switches:
      mute_mics: master_mute_switch
      wake_sound: wake_sound
      # Whether "stop" can interrupt a spoken answer, on the Voice Input card next to the wake
      # words it behaves like. The stop *model* stays off this map on purpose - see the
      # micro_wake_word_id note above - this switch gates its arming instead.
      stop_word: stop_word_interrupt
      # The Remote routing and Area ducking cards on the Config route.
      #
      # Only the two derived switches and the wake chime are left. The app does not drive the derived
      # pair through these paths - it writes the selection and they follow - but they stay in the map so
      # the app can *show* the whole-area state, and so the Home Assistant face and the app face are
      # visibly the same control rather than two that happen to agree.
      #
      # tts_mute_local and duck_tts_targets were here. Both entities are deleted; the first is now the
      # app's "Local Speaker" row and the second is unconditional.
      tts_routing: tts_routing_enabled
      remote_wake_chime: remote_wake_chime
      remote_timer_ring: remote_timer_ring
      duck_area: duck_area_players

    selects:
      speaker_channel: tas_mode_select
      wake_sensitivity: mww_sensitivity_select
      # The mic-guard length, on the Audio routing card under the toggles it belongs with.
      remote_sync_guard: remote_sync_guard

    buttons:
      restart: restart_button
      # internal: true already, and reachable over REST regardless - internal only gates /events,
      # never the entity handlers. Auth is what protects it, which is why web_server has auth on.
      factory_reset: factory_reset_button
      safe_mode: safe_mode_button
      xmos_reset: xmos_hardware_reset
      xmos_flash: flash_satellite
      # erase_xmos_flash is deliberately not mapped. Erasing leaves the audio chip blank - no microphones,
      # no speaker, no wake word - and the only way back is flash_satellite above, which needs the chip it
      # just erased to be responding. Reflash overwrites without erasing first, so nothing in the app
      # needed it. Unmapped means the app cannot reach it at all rather than merely not showing it; the
      # ESPHome button still exists for a bench recovery over the native API.

    binary_sensors:
      btn_up: btn_up
      btn_down: btn_down
      btn_mute: btn_left
      btn_action: btn_action
      line_out: line_out_sensor

    text_sensors:
      network: network_status_sensor
      usb_power: pd_state_text
      xmos_firmware: xmos_firmware_version_text
      # Despite the name, this holds the detected module - "LD2450" or "LD2410" - not a presence
      # state. Presence itself comes from "Radar Target", which satellite1_radar registers at runtime
      # from a C++ literal shared by both handlers, so it has no id to map and does not need one.
      radar_module: radar_detected_text
      remote_tts_status: tts_routing_status

    events:
      action_button: action_button_press_event

# Whether the device's HTTP server runs at all. On is today's behaviour, ~8KB of internal RAM
# paid around the clock; off recovers it, and reaching the web UI then means flipping this switch
# in Home Assistant first - as the old "Radar Tuner WebUI" switch worked. Restored ON by default
# so nobody loses the web UI by taking a firmware update.
switch:
  - platform: template
    id: web_ui_enabled
    name: "Web UI"
    icon: "mdi:web"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          if (id(web_ui_listener_ready) && !id(web_ui_listener_on)) {
            id(web_ui_listener_on) = true;
            web_server_base::global_web_server_base->init();
            ESP_LOGI("web_ui", "HTTP listener started");
          }
    turn_off_action:
      - lambda: |-
          if (id(web_ui_listener_ready) && id(web_ui_listener_on)) {
            id(web_ui_listener_on) = false;
            web_server_base::global_web_server_base->deinit();
            ESP_LOGI("web_ui", "HTTP listener stopped");
          }

# The maintenance buttons the Diagnostics page is built around.
#
# These used to live in common/debug.yaml, which is commented out in both satellite1.base.yaml and
# satellite1.dashboard.yaml - so on a stock device they did not exist, and the web UI's Audio chip
# and Safe mode controls would have had nothing behind them. They cannot be declared in both files:
# ids are global after package merging, so a customer who uncommented debug.yaml would get a
# duplicate-id error, and giving them different ids there would produce two entities with the same
# display name, which web_server resolves by name and could not tell apart.
#
# So they are declared once, here, always present and internal: true - the web UI reaches them over
# REST, which internal does not gate. debug.yaml now promotes them into Home Assistant with
# `!extend internal: false`, which is what that file is for and preserves exactly what a customer
# who enables it sees today.
button:
  - platform: safe_mode
    id: safe_mode_button
    name: "Restart Sat1 (Safe Mode)"
    entity_category: diagnostic
    internal: true

  - platform: template
    id: xmos_hardware_reset
    name: "XMOS Hardware Reset"
    entity_category: diagnostic
    internal: true
    on_press:
      then:
        - satellite1.xmos_hardware_reset

  - platform: template
    id: flash_satellite
    name: "XMOS Flash ${xmos_fw_version}"
    entity_category: diagnostic
    internal: true
    on_press:
      then:
        - memory_flasher.write_image:
            image_version: ${xmos_fw_version}
            image_file: https://raw.githubusercontent.com/FutureProofHomes/Documentation/refs/heads/main/assets/firmware/xmos/${xmos_fw_version}/satellite1_firmware_fixed_delay.factory.bin
            md5_url: https://raw.githubusercontent.com/FutureProofHomes/Documentation/refs/heads/main/assets/firmware/xmos/${xmos_fw_version}/satellite1_firmware_fixed_delay.factory.md5

  - platform: template
    id: erase_xmos_flash
    name: "XMOS Erase Chip"
    entity_category: diagnostic
    internal: true
    on_press:
      then:
        - memory_flasher.erase:

sensor:
  # Declared here rather than in debug.yaml for the same reason as the buttons above: that file is
  # commented out on a stock device, so the Diagnostics page's temperature row had nothing behind it.
  # 60s to match what debug.yaml used - it is a case temperature, not a control input, and polling it
  # faster would only add loop work for a number that moves over minutes.
  - platform: internal_temperature
    id: esp_temperature_sensor
    name: "Internal ESP Temperature"
    entity_category: diagnostic
    update_interval: 60s
    internal: true

text_sensor:
  # Deliberately visible in Home Assistant rather than internal: it is the only way a customer
  # finds the generated password. Anyone who can read it can already control this device through
  # Home Assistant, so it gives away nothing they did not have.
  - platform: template
    id: web_ui_password_text
    name: "Web UI Password"
    icon: "mdi:key-variant"
    entity_category: diagnostic
    update_interval: never
