esphome:
  platformio_options:
    board_build.flash_mode: dio
    board_upload.maximum_size: 16777216

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 16MB

  # Where a crash writes its evidence: ESP-IDF's panic handler stores registers, the faulting PC
  # and every task's stack into this partition, and crash_report (below) reads it back after the
  # reboot. 64KB holds this firmware's task set comfortably; a dump that would not fit is truncated
  # by IDF, not refused.
  #
  # Read this before chasing two things nobody should chase again:
  #
  # 1) The partition table lives at flash offset 0x8000 and OTA never rewrites it, so a fielded
  #    device gains this partition only from a USB/serial flash. Until then the panic handler logs
  #    a harmless "No core dump partition found" at crash time and everything else keeps working -
  #    the crash_report component's RTC flight recorder and NVS crash ring do not need it.
  #
  # 2) That one USB flash also RESETS EVERY STORED SETTING (Wi-Fi provisioning, the generated web
  #    UI password, routing/ducking selections, wake word slots). Not an esptool quirk: the 16MB
  #    table was exactly full, so ESPHome pays for this partition by shrinking app0/app1 by 32KB
  #    each, which moves nvs to a different offset - and NVS data at the old offset is
  #    unreachable at the new one. A one-time cost per device, paid at the same flash that
  #    delivers the partition.
  partitions:
    - name: coredump
      type: data
      subtype: coredump
      size: 0x10000

  framework:
    type: esp-idf

    sdkconfig_options:
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      # Heap policy: malloc/new above 4KB tries PSRAM first and falls back to internal
      # (USE_MALLOC replaces ESPHome's default USE_CAPS_ALLOC, under which malloc never
      # touches PSRAM at all). Decided from a live coredump (September 24 2026): the web
      # UI's Home Assistant sync sends an ~8.2KB action call - the ~7.7KB response_template
      # rides on every page request - and encoding it grows the API's shared write buffer
      # through plain operator new[]. On a WiFi build the largest free internal block sits
      # near 7KB under load, the 8,183-byte allocation failed, and with exceptions compiled
      # out a failed new is not an error path but an abort(): the device rebooted mid
      # page-load. common/web_ui_ha.yaml fixed and documents the receive half of exactly
      # this; the send half needs the allocator itself to stop insisting on internal DRAM,
      # and so does whatever component grows past a fragmented heap's largest block next.
      #
      # 4096 keeps small, hot allocations internal (WiFi's ~1.6KB RX buffers included);
      # 49152 is fenced off for callers that require internal memory (DMA, task internals).
      # CAPS_ALLOC is negated because the psram component hard-sets it to "y" after our
      # options land: both writes survive into the generated defaults, the two symbols are
      # members of one Kconfig choice, and the last "=y" line wins - which is why
      # USE_MALLOC is deliberately ordered after USE_CAPS_ALLOC here. Trust neither
      # explanation over evidence: confirm CONFIG_SPIRAM_USE_MALLOC=y in the generated
      # sdkconfig.satellite1 whenever ESPHome is upgraded.
      CONFIG_SPIRAM_USE_CAPS_ALLOC: "n"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "49152"

      # Core dump to the partition above, in ELF with a CRC32 - ELF because
      # esp_core_dump_get_summary() (the on-device "what crashed" readout) only exists for ELF
      # dumps, CRC32 rather than SHA because the integrity check runs at every crashed boot.
      # The dedicated 1792-byte dump stack is not optional comfort: the crashing task's stack may
      # itself be the corruption, and a dump written from it would destroy the evidence it is
      # collecting. That stack is a static buffer - it is most of what this feature costs in
      # internal RAM.
      CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH: "y"
      CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF: "y"
      CONFIG_ESP_COREDUMP_CHECKSUM_CRC32: "y"
      CONFIG_ESP_COREDUMP_STACK_SIZE: "1792"

      # A hardware watchpoint on each task's stack canary: a stack overflow faults at the
      # overflowing store instead of corrupting the neighbouring TCB and failing somewhere
      # unrelated later. Zero RAM - the S3 has two watchpoints and FreeRTOS gets this one.
      CONFIG_FREERTOS_WATCHPOINT_END_OF_STACK: "y"

      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # BT
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

# Moves every ESPHome component object (~45KB of main.cpp .bss) from internal DRAM into PSRAM,
# minus the objects embedding FreeRTOS TCBs. See esphome/components/extram_bss for the audit.
extram_bss:

# Wall-clock time, which nothing in this config carried before the crash reports needed one. The
# homeassistant platform rather than sntp, by owner decision (September 21 2026): it rides the
# native API connection the device already holds, where sntp would spend a UDP socket from the
# budgeted socket table - and a crash timestamp that is only as good as the last Home Assistant
# sync is exactly good enough, because crash_report marks time into RTC memory every few seconds
# and computes the stamp from uptime deltas when the sync is stale.
time:
  - platform: homeassistant
    id: ha_time

# The crash flight recorder: a log tail and a time mark in RTC slow memory (zero internal DRAM,
# survives every warm reset including panics), harvested at the boot after a crash together with
# the core dump summary into an NVS ring of the last 8 crashes. The web app's Diagnostics route
# serves all of it - see satellite1_web_ui's crash endpoints. INFO is the capture floor because
# DEBUG floods the 4KB ring in seconds on a chatty voice pipeline; raise it to DEBUG on a single
# unit during an active hunt, not on a fleet.
crash_report:
  id: crash_rpt
  time_id: ha_time
  capture_level: INFO

i2c:
  - id: i2c_0
    sda: GPIO5
    scl: GPIO6
    frequency: 400kHz
    scan: true

spi:
  - id: spi_0
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13
    interface: SPI2

uart:
  - id: uart_mmwave
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

i2s_audio:
  - id: i2s_shared
    i2s_lrclk_pin: GPIO07
    i2s_bclk_pin: GPIO08
    i2s_mclk_pin: GPIO16
    access_mode: duplex
    i2s_mode: secondary
