# Developer-only audio race harness, included by config/satellite1.dev.yaml.
# Reproduces the announcement-pipeline races on demand. Every entity is internal; web_server's
# include_internal still serves them, so the tests run over REST with the web UI password:
#
#   curl --digest -u satellite1:<password> -X POST http://<ip>/button/Audio%20Race%20Test/press
#
# Results are "audio_race" lines in the log (GET /api/sat1/log).
#
# - Audio Race Test: a chime standing in for a peer's remote wake chime, then
#   play_sound(priority: true) after a swept offset - what a wake word does when it lands on top of
#   one.
# - Audio Stop Race Test: a chime, then a plain media_player.stop after a swept offset - what the
#   Stop button, the stop word and a wake during an announcement do - then a follow-up chime.
# - Audio Stall Test: plays the "Audio Race Test URL" text as an announcement, through the same
#   HTTP source a streamed reply uses. Point it at a server that pauses mid-stream.
#
# Each sweep runs offsets 0-60 ms in "Audio Race Test Step" increments, "Audio Race Test Rounds"
# times. "Audio Race Test Fast Loop" (on by default) keeps the main loop running flat out during a
# sweep. An idle device sleeps up to 16 ms between passes, which lines every stop up a whole pass
# behind the chime's first write and hides the deadlock; in the field, a wake word firing and the
# network traffic around it keep waking the loop early.
# The fast loop costs PSRAM: in ESPHome 2026.9 every run under it leaks about 20 KB that never
# comes back, so a sweep aborts below 512 KB free rather than run the decoders and the mixer out of
# memory (which leaves the speaker dead, then WiFi). Restart between long fast sweeps.
# A run is PASS, or any of: SILENT (the second chime never played), RECOVERED (the
# announcement speaker was left running and stopped itself), HANG (still running long after; it is
# force-stopped so the sweep can go on - without that, every later announcement would wait forever),
# STUCK (still announcing seconds after a sub-second chime, or the mixer has failed; the sweep ends
# there, since nothing after it would mean anything).

globals:
  - id: art_offset_ms
    type: int
    restore_value: no
    initial_value: '0'
  - id: art_round
    type: int
    restore_value: no
    initial_value: '0'
  - id: art_runs
    type: int
    restore_value: no
    initial_value: '0'
  - id: art_pass
    type: int
    restore_value: no
    initial_value: '0'
  - id: art_silent
    type: int
    restore_value: no
    initial_value: '0'
  - id: art_recovered
    type: int
    restore_value: no
    initial_value: '0'
  - id: art_hang
    type: int
    restore_value: no
    initial_value: '0'
  - id: art_stuck
    type: int
    restore_value: no
    initial_value: '0'
  - id: art_abort
    type: bool
    restore_value: no
    initial_value: 'false'
  # Per-run outcome: whether the second chime was heard, whether the player got stuck, and how the
  # speaker drained (0 stopped on its own, 2 left running but stopped itself, 3 still running).
  - id: art_silent_run
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: art_stuck_run
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: art_drain
    type: int
    restore_value: no
    initial_value: '0'
  - id: art_t0
    type: uint32_t
    restore_value: no
    initial_value: '0'

number:
  - platform: template
    id: art_step
    name: "Audio Race Test Step"
    internal: true
    optimistic: true
    min_value: 1
    max_value: 10
    step: 1
    initial_value: 2
    unit_of_measurement: ms
  - platform: template
    id: art_rounds
    name: "Audio Race Test Rounds"
    internal: true
    optimistic: true
    min_value: 1
    max_value: 10
    step: 1
    initial_value: 2

switch:
  - platform: template
    id: art_fast_loop_switch
    name: "Audio Race Test Fast Loop"
    internal: true
    optimistic: true
    restore_mode: ALWAYS_ON

text:
  - platform: template
    id: art_url
    name: "Audio Race Test URL"
    internal: true
    optimistic: true
    mode: text
    max_length: 255

button:
  - platform: template
    name: "Audio Race Test"
    internal: true
    on_press:
      - script.execute: art_wake_sweep
  - platform: template
    name: "Audio Stop Race Test"
    internal: true
    on_press:
      - script.execute: art_stop_sweep
  - platform: template
    name: "Audio Stall Test"
    internal: true
    on_press:
      - script.execute: art_stall_test

script:
  - id: art_wait_quiet
    then:
      - wait_until:
          condition:
            lambda: |-
              return id(external_media_player)->state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING &&
                     id(announcement_resampling_speaker)->is_stopped() && id(announcement_mixing_input)->is_stopped();
          timeout: 8s

  - id: art_chime
    then:
      - lambda: |-
          id(external_media_player)
            ->make_call()
            .set_media_url("audio-file://wake_word_triggered_sound")
            .set_announcement(true)
            .perform();

  # Sets art_drain. The 300ms settle matters: an orphaned start runs a loop pass after the
  # resampler last read as stopped, so checking straight away can miss it.
  - id: art_check_drain
    then:
      - wait_until:
          condition:
            lambda: return id(external_media_player)->state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING;
          timeout: 3s
      - lambda: |-
          id(art_stuck_run) =
              id(external_media_player)->state == media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ||
              id(mixing_speaker)->status_has_error();
      - delay: 300ms
      - wait_until:
          condition:
            lambda: return id(announcement_resampling_speaker)->is_stopped() && id(announcement_mixing_input)->is_stopped();
          timeout: 2s
      - if:
          condition:
            lambda: return id(announcement_resampling_speaker)->is_stopped() && id(announcement_mixing_input)->is_stopped();
          then:
            - lambda: id(art_drain) = 0;
          else:
            - wait_until:
                condition:
                  lambda: return id(announcement_resampling_speaker)->is_stopped() && id(announcement_mixing_input)->is_stopped();
                timeout: 6s
            - if:
                condition:
                  lambda: return id(announcement_resampling_speaker)->is_stopped() && id(announcement_mixing_input)->is_stopped();
                then:
                  - lambda: id(art_drain) = 2;
                else:
                  - lambda: id(art_drain) = 3;
                  - speaker.stop: announcement_resampling_speaker
                  - speaker.stop: announcement_mixing_input
                  - wait_until:
                      condition:
                        lambda: return id(announcement_resampling_speaker)->is_stopped() && id(announcement_mixing_input)->is_stopped();
                      timeout: 8s

  - id: art_tally
    parameters:
      kind: string
    then:
      - lambda: |-
          id(art_runs) += 1;
          const bool pass = !id(art_silent_run) && !id(art_stuck_run) && id(art_drain) == 0;
          if (id(art_silent_run)) id(art_silent) += 1;
          if (id(art_stuck_run)) id(art_stuck) += 1;
          if (id(art_drain) == 2) id(art_recovered) += 1;
          if (id(art_drain) == 3) id(art_hang) += 1;
          if (pass) id(art_pass) += 1;
          const char *drain = id(art_drain) == 3 ? " HANG" : (id(art_drain) == 2 ? " RECOVERED" : "");
          const char *silent = id(art_silent_run) ? " SILENT" : "";
          const char *stuck = id(art_stuck_run) ? " STUCK" : "";
          ESP_LOGI("audio_race", "%s run %d offset=%dms:%s%s%s%s", kind.c_str(), id(art_runs), id(art_offset_ms),
                   pass ? " PASS" : "", silent, stuck, drain);
          if (id(art_stuck_run)) {
            ESP_LOGW("audio_race", "%s aborted: the media player is stuck or the mixer has failed", kind.c_str());
            id(art_abort) = true;
          }

  # Ends the sweep before the fast loop's PSRAM leak starves the decoders.
  - id: art_guard
    then:
      - lambda: |-
          const size_t psram = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
          if (psram < 512 * 1024) {
            ESP_LOGW("audio_race", "aborted: %u KB PSRAM free - restart before the next sweep",
                     (unsigned) (psram / 1024));
            id(art_abort) = true;
          }

  # One lambda, so start and stop act on the same requester.
  - id: art_fast_loop
    parameters:
      enable: bool
    then:
      - lambda: |-
          static HighFrequencyLoopRequester requester;
          if (enable)
            requester.start();
          else
            requester.stop();

  - id: art_reset
    parameters:
      kind: string
    then:
      - lambda: |-
          id(art_runs) = 0; id(art_pass) = 0; id(art_silent) = 0; id(art_recovered) = 0; id(art_hang) = 0;
          id(art_stuck) = 0; id(art_abort) = false;
          id(art_round) = 0;
          ESP_LOGI("audio_race", "%s sweep start: 0-60ms, step %d ms, %d rounds, fast loop %s, %u KB PSRAM free",
                   kind.c_str(), (int) id(art_step).state, (int) id(art_rounds).state,
                   YESNO(id(art_fast_loop_switch).state), (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024));
      - script.execute:
          id: art_fast_loop
          enable: !lambda return id(art_fast_loop_switch).state;

  - id: art_totals
    parameters:
      kind: string
    then:
      - script.execute:
          id: art_fast_loop
          enable: false
      - lambda: |-
          ESP_LOGI("audio_race", "%s sweep done%s: %d runs, %d PASS, %d SILENT, %d RECOVERED, %d HANG, %d STUCK, "
                   "%u KB PSRAM free", kind.c_str(), id(art_abort) ? " (aborted)" : "", id(art_runs), id(art_pass),
                   id(art_silent), id(art_recovered), id(art_hang), id(art_stuck),
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024));

  - id: art_wake_run
    then:
      - script.execute: art_wait_quiet
      - script.wait: art_wait_quiet
      - script.execute: art_chime
      - delay: !lambda return id(art_offset_ms);
      - script.execute:
          id: play_sound
          priority: true
          sound_file: "wake_word_triggered_sound"
      - delay: 150ms
      - lambda: |-
          id(art_silent_run) =
              id(external_media_player)->state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING;
      - script.execute: art_check_drain
      - script.wait: art_check_drain
      - script.execute:
          id: art_tally
          kind: "wake-race"

  - id: art_stop_run
    then:
      - script.execute: art_wait_quiet
      - script.wait: art_wait_quiet
      - script.execute: art_chime
      - delay: !lambda return id(art_offset_ms);
      - media_player.stop:
          id: external_media_player
          announcement: true
      - script.execute: art_check_drain
      - script.wait: art_check_drain
      # The follow-up chime is what a user would notice: does the next announcement play?
      - script.execute: art_chime
      - wait_until:
          condition:
            lambda: return id(external_media_player)->state == media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING;
          timeout: 1s
      - lambda: |-
          id(art_silent_run) =
              id(external_media_player)->state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING;
      - script.execute: art_wait_quiet
      - script.wait: art_wait_quiet
      - script.execute:
          id: art_tally
          kind: "stop-race"

  - id: art_wake_sweep
    mode: single
    then:
      - script.execute:
          id: art_reset
          kind: "wake-race"
      - while:
          condition:
            lambda: return id(art_round) < (int) id(art_rounds).state && !id(art_abort);
          then:
            - lambda: id(art_offset_ms) = 0;
            - while:
                condition:
                  lambda: return id(art_offset_ms) <= 60 && !id(art_abort);
                then:
                  - script.execute: art_guard
                  - if:
                      condition:
                        lambda: return !id(art_abort);
                      then:
                        - script.execute: art_wake_run
                        - script.wait: art_wake_run
                  - lambda: id(art_offset_ms) += (int) id(art_step).state;
            - lambda: id(art_round) += 1;
      - script.execute:
          id: art_totals
          kind: "wake-race"

  - id: art_stop_sweep
    mode: single
    then:
      - script.execute:
          id: art_reset
          kind: "stop-race"
      - while:
          condition:
            lambda: return id(art_round) < (int) id(art_rounds).state && !id(art_abort);
          then:
            - lambda: id(art_offset_ms) = 0;
            - while:
                condition:
                  lambda: return id(art_offset_ms) <= 60 && !id(art_abort);
                then:
                  - script.execute: art_guard
                  - if:
                      condition:
                        lambda: return !id(art_abort);
                      then:
                        - script.execute: art_stop_run
                        - script.wait: art_stop_run
                  - lambda: id(art_offset_ms) += (int) id(art_step).state;
            - lambda: id(art_round) += 1;
      - script.execute:
          id: art_totals
          kind: "stop-race"

  - id: art_stall_test
    mode: single
    then:
      - script.execute: art_wait_quiet
      - script.wait: art_wait_quiet
      - lambda: |-
          ESP_LOGI("audio_race", "stall start: %s", id(art_url).state.c_str());
          id(external_media_player)->make_call().set_media_url(id(art_url).state).set_announcement(true).perform();
      - wait_until:
          condition:
            lambda: return id(external_media_player)->state == media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING;
          timeout: 10s
      - lambda: id(art_t0) = millis();
      - wait_until:
          condition:
            lambda: return id(external_media_player)->state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING;
          timeout: 60s
      - lambda: id(art_t0) = millis() - id(art_t0);
      - wait_until:
          condition:
            lambda: return id(announcement_resampling_speaker)->is_stopped() && id(announcement_mixing_input)->is_stopped();
          timeout: 10s
      - lambda: |-
          ESP_LOGI("audio_race", "stall done: announcing %u ms, speakers %s", (unsigned) id(art_t0),
                   (id(announcement_resampling_speaker)->is_stopped() && id(announcement_mixing_input)->is_stopped())
                       ? "stopped" : "STILL RUNNING");
