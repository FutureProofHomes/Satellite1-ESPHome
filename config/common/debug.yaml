debug:
  update_interval: 5s

# # OPTIONAL Persist logs to a an MQTT broker so you can go back in time and inspect them.  Read more here: https://esphome.io/components/mqtt.html
# mqtt:
#   broker: homeassistant.local
#   port: 1883
#   username: <mqtt_username_here>
#   password: <mqtt_password_here>
#   # topic_prefix: <set_this_if_you_are_logging_multiple_satellite1_devices>

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
      entity_category: "diagnostic"
    reset_reason:
      name: "Reset Reason"
      entity_category: "diagnostic"
  - platform: version
    name: "Firmware Version"
    hide_timestamp: true

sensor:
  - platform: debug
    free:
      name: "Heap Free"
      entity_category: "diagnostic"
    block:
      name: "Heap Max Block"
      entity_category: "diagnostic"
    loop_time:
      name: "Loop Time"
      entity_category: "diagnostic"
    psram:
      name: "Free PSRAM"
      entity_category: "diagnostic"
  - platform: internal_temperature
    name: "Internal ESP Temperature"
    entity_category: "diagnostic"
    update_interval: 60s

# These four buttons now live in common/web_ui.yaml, which is always included, because the on-device
# web app is built around them and they were unavailable on a stock device while they lived here.
# They are declared internal: true there, so enabling this file is what puts them in front of Home
# Assistant - the same thing it did before, and the reason to enable it. Names and behaviour are
# unchanged; only the file they are declared in moved.
button:
  # Restarts Sat1 to safe mode
  - id: !extend safe_mode_button
    internal: false
  - id: !extend xmos_hardware_reset
    internal: false
  # Flashes Sat1 HAT with specific XMOS firmware
  - id: !extend flash_satellite
    internal: false
  # Wipes the Satellite1 HAT XMOS Chip
  - id: !extend erase_xmos_flash
    internal: false
