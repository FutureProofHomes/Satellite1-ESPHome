# Routes voice assistant TTS responses to remote media players.
# See docs/TTS-Routing.md for setup, the design decisions and the alternatives that were rejected.

substitutions:
  # Is a response going anywhere other than this speaker?
  #
  # This replaced the old pairing of "the master switch is on AND the target list is not empty", which
  # appeared at eight sites. The composition had to invert as well as move: the switch now means only
  # "my whole area", so a speaker picked in another room routes with it off. AND became OR, and both
  # halves became one question asked of the selection.
  #
  # Written once here and referenced everywhere, because eight copies of a condition is eight chances
  # for one of them to be updated and the others not.
  tts_routing_active: "(!id(web_ui_app)->selection().routing().empty())"

  # The resolved target list as Home Assistant reads it, from the three parts the selection holds.
  # Expects `sel_areas`, `sel_extra`, `sel_cut` and `mac`.
  #
  # Prefixed names because one caller is media_player.play_media, whose own payload has a key called
  # `extra` - two different things called the same thing in one call is how the wrong one gets read.
  #
  # Areas expand at call time rather than being enumerated when they are picked, which is what makes a
  # speaker added to a room later get included without anyone revisiting the setting. Music Assistant
  # entities are rejected during expansion for the reason tts_targets_ma_check explains: expanding an
  # area returns them, and on the test installation area_entities('media_room') gives 18 players where
  # the app offers 12 - the other 6 are duplicates that clip on Sonos. Rejecting them here is what
  # stops whole-area mode from quietly reintroducing what the app filtered out.
  #
  # sonos_cloud entities are rejected from area expansion by the same duplicate logic: that custom
  # integration creates a second media_player per Sonos speaker, so a whole-area selection would
  # announce through both and double-fire the primary. An explicitly picked cloud entity is honored -
  # picking it is how a user opts into its play_on_bonded fan-out (see the extra dict in
  # tts_route_response), typically carving the native twin out in the same edit.
  #
  # `excluded` entries carry an `area_id:` prefix for the device's benefit, not Home Assistant's, so
  # the prefix is stripped and the ids rejected globally - an entity belongs to at most one area, so
  # that gives the same answer as rejecting per area.
  # Leaves the answer in `targets_list` rather than emitting it, so the wake chime walk below can
  # iterate it instead of re-splitting a raw string - which it can no longer do, since an area entry
  # is not an entity id and device_id() returns nothing for one.
  #
  # The final pass drops players whose supported_features lacks PLAY_MEDIA (512), and it is load-
  # bearing rather than cosmetic. This walk hands play_media an *explicit* entity list, and Home
  # Assistant raises ServiceNotSupported for an explicitly listed entity missing a service's required
  # feature before calling anything (helpers/service.py) - so one incompatible player in a wholesale-
  # selected area would silence the announcement for every speaker in the call. Only area_id targets
  # get the lenient skip, and this is not one. The same pass drops players whose state is
  # `unavailable` or `unknown`: nothing plays on a speaker that is off the network, and every walk
  # downstream of `targets_list` - the wake chime, the stop buttons, the volume snapshots in
  # area_ducking.yaml - inherits the filter, so none of them calls a service against it either. The
  # selection itself is untouched, so the speaker resumes the moment it comes back. A player whose
  # supported_features cannot be read *while its state is real* is kept, since the capability test
  # cannot condemn what it cannot read. The same feature bits and the same state test drive the
  # app's greyed-out rows (web_ui_ha.yaml), so what the tree shows as untickable or offline and
  # what this walk removes agree by construction.
  tts_targets_resolve: >-
    {% set dupes = integration_entities('music_assistant') + integration_entities('sonos_cloud') %}
    {% set cut = sel_cut.split(',') | map('trim') | reject('eq', '')
                 | map('regex_replace', '^[^:]*:', '') | list %}
    {% set res = namespace(t=[]) %}
    {% for a in sel_areas.split(',') | map('trim') | reject('eq', '') %}
      {% set res.t = res.t + (area_entities(a) | select('match', 'media_player\.')
                              | reject('in', dupes) | list) %}
    {% endfor %}
    {% set res.t = res.t
                   + (sel_extra.split(',') | map('trim') | map('lower') | reject('eq', '') | list) %}
    {% set cap = namespace(t=[]) %}
    {% for t in res.t | unique | reject('in', cut) | reject('in', mine) %}
      {% set f = state_attr(t, 'supported_features') %}
      {% if states(t) not in ['unavailable', 'unknown']
            and (f is none or f | int | bitwise_and(512)) %}
        {% set cap.t = cap.t + [t] %}
      {% endif %}
    {% endfor %}
    {% set targets_list = cap.t %}

  # The same thing as a value, for the calls that just want an entity_id.
  tts_targets_jinja: >-
    ${tts_targets_resolve}
    {{ targets_list }}

  # Targets eligible for a remote wake chime, as `chime_players`. Expects `targets_list` and `mac`, so
  # ${tts_targets_resolve} has to run ahead of it.
  #
  # Each must be a Satellite1 (by manufacturer - every ESPHome device shares the esphome integration),
  # have its own Wake sound switch on, and not be this device. A switch that cannot be found counts as
  # off. It reads the resolved list rather than the selection because every test here is per player:
  # an area cannot have a wake_sound switch.
  wake_chime_targets_jinja: >-
    {% set cns = namespace(t=[]) %}
    {% for t in targets_list %}
      {% set d = device_id(t) %}
      {% set ws = (device_entities(d) | select('search', 'wake_sound') | list)
                  if d and device_attr(d, 'manufacturer') == 'FutureProofHomes' else [] %}
      {% if ws | count > 0 and states(ws | first) == 'on'
            and (mac | lower) not in device_attr(d, 'connections') | map(attribute=1) | list %}
        {% set cns.t = cns.t + [t] %}
      {% endif %}
    {% endfor %}
    {% set chime_players = cns.t %}

  # The Stop Announcement buttons of the Satellite1s among the targets, as a list, for
  # tts_remote_stop below. Expects `targets_list`, so ${tts_targets_resolve} has to run ahead of it.
  #
  # A button rather than media_player.media_stop, and the distinction is load-bearing. Home
  # Assistant's ESPHome integration sends a plain STOP with no announcement flag
  # (async_media_stop in its media_player.py), and the speaker media player answers that by
  # stopping the *media* pipeline - so media_stop aimed at a Satellite1 would kill its music and
  # leave the routed response playing. The button runs on the peer and stops the announcement
  # pipeline, which is the one the response rides. Peers on older firmware have no such button
  # and simply do not appear here, the same mixed-fleet posture as tts_volume_targets_jinja.
  tts_stop_buttons_jinja: >-
    {% set sns = namespace(b=[]) %}
    {% for t in targets_list %}
      {% set d = device_id(t) %}
      {% if d and device_attr(d, 'manufacturer') == 'FutureProofHomes' %}
        {% set sns.b = sns.b + (device_entities(d) | select('search', 'stop_announcement') | list) %}
      {% endif %}
    {% endfor %}
    {{ sns.b }}

  # The targets media_player.media_stop is right for, as a list. Expects `targets_list`.
  #
  # Everyone except the two platforms where the generic stop does damage: a Satellite1 gets its
  # button (above), and Sonos is skipped - its announcement is an audio clip played over the
  # queue, and media_stop would stop the *queue*, so saying "stop" would kill the customer's
  # music while the announcement played on. Sonos gets the preempt clip instead
  # (tts_stop_sonos_jinja below). sonos_cloud entities are skipped for the same reason, plus a
  # sharper one: they are clip-only shells, and Home Assistant raises ServiceNotSupported for an
  # explicitly listed entity missing a service's feature *before calling anything*, so one cloud
  # entity in this list would kill the stop for every player in the call. For everything else the
  # announcement is what is playing, so stop reaches it; whether the target resumes its own media
  # afterwards is the integration's announce support, exactly as if the announcement had ended by
  # itself.
  tts_stop_players_jinja: >-
    {% set sonos = integration_entities('sonos') + integration_entities('sonos_cloud') %}
    {% set pns = namespace(p=[]) %}
    {% for t in targets_list %}
      {% set d = device_id(t) %}
      {% if (not d or device_attr(d, 'manufacturer') != 'FutureProofHomes') and t not in sonos %}
        {% set pns.p = pns.p + [t] %}
      {% endif %}
    {% endfor %}
    {{ pns.p }}

  # The Sonos targets, native and sonos_cloud, as a list, for the stop preempt. Expects
  # `targets_list`.
  #
  # These are the players the walk above cannot stop, and the reason it cannot is also the lever:
  # a playing AudioClip cannot be *cancelled* through Home Assistant (cancelAudioClip is LAN-only
  # and needs the clip id, which nothing retains), but the clip priority system says a LOW clip
  # interrupts a playing LOW clip at any time, and every clip Home Assistant sends is LOW. So a
  # new, short, near-silent announcement IS the stop: it preempts the playing response and ends
  # ~0.4s later. The clip must carry real audio - a field report (HA community, "Cancel an
  # announcement") found a pure-silence MP3 did not register - which is why stop_clip.mp3 is a
  # faint fading tone rather than digital zero. It doubles as an acknowledgment that the stop
  # was heard.
  tts_stop_sonos_jinja: >-
    {% set sonos = integration_entities('sonos') + integration_entities('sonos_cloud') %}
    {% set qns = namespace(p=[]) %}
    {% for t in targets_list %}
      {% if t in sonos %}
        {% set qns.p = qns.p + [t] %}
      {% endif %}
    {% endfor %}
    {{ qns.p }}

  # Every other FutureProofHomes device's Stop Announcement button, as a list, for
  # tts_stop_broadcast below. Expects `mac`. Unlike the two walks above this is not scoped to a
  # target list, because the device pressing these is a *receiver* - it played an announcement
  # someone else routed and has no idea who else got it. Pressing every button is safe precisely
  # because the button is guarded: a device that is not announcing treats the press as a no-op,
  # so music anywhere is untouched. The known cost: two unrelated announcements in one house stop
  # together. The person who said "stop" wanted quiet, so that is the right default.
  #
  # One esphome entity per device is enough to find it, so devices already seen are skipped
  # rather than re-walked.
  tts_stop_all_jinja: >-
    {% set bns = namespace(b=[], seen=[]) %}
    {% for e in integration_entities('esphome') %}
      {% set d = device_id(e) %}
      {% if d and d not in bns.seen %}
        {% set bns.seen = bns.seen + [d] %}
        {% if device_attr(d, 'manufacturer') == 'FutureProofHomes'
              and (mac | lower) not in device_attr(d, 'connections') | map(attribute=1) | list %}
          {% set bns.b = bns.b + (device_entities(d) | select('search', 'stop_announcement') | list) %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ bns.b }}

  # An audio_file id from media_player.yaml behind the scheme the target's own media source matches
  # on, so no audio crosses the network. Named here because the call and its log line must agree.
  wake_chime_uri: "audio-file://wake_word_triggered_sound"

  # Non-Satellite1 targets, as `other_players`, for the calls that hand out a device-served sound
  # URL: everything in the resolved list that is not a FutureProofHomes device. Sonos included -
  # unlike the stop split above, nothing here is destructive, so there is no platform to spare.
  # Expects `targets_list`, so ${tts_targets_resolve} has to run ahead of it.
  non_sat1_targets_jinja: >-
    {% set ons = namespace(p=[]) %}
    {% for t in targets_list %}
      {% set d = device_id(t) %}
      {% if not d or device_attr(d, 'manufacturer') != 'FutureProofHomes' %}
        {% set ons.p = ons.p + [t] %}
      {% endif %}
    {% endfor %}
    {% set other_players = ons.p %}

  # C++ spliced into the lambdas that render a device-served sound URL. The device serves its two
  # travelling sounds itself (GET /api/sat1/sounds/<name>.mp3 in satellite1_web_ui, session-gate
  # exempt) so a remote timer ring works with the internet down - the owner's decision, September 18
  # 2026, over S3 hosting; the cost is that a home whose firewall blocks speaker-to-satellite HTTP
  # gets a silent failure, which docs/TTS-Routing.md's troubleshooting covers. The IP is read at
  # call time so a DHCP move cannot strand a stale address. A substitution because every caller and
  # the route in web_ui_handler.cpp must agree on the path, and copies are how they stop agreeing.
  sat1_sounds_url_lambda: |-
    char sat1_ip_buf[esphome::network::IP_ADDRESS_BUFFER_SIZE] = {0};
    std::string sat1_ip;
    for (auto &sat1_addr : esphome::network::get_ip_addresses()) {
      if (sat1_addr.is_set() && sat1_addr.is_ip4()) {
        sat1_addr.str_to(sat1_ip_buf);
        sat1_ip = sat1_ip_buf;
        break;
      }
    }

  # One remote ring cycle: the MP3's 2.73s plus the 500ms gap the local ring's playlist delay uses,
  # rounded up so remote clips cannot pile onto each other when a target starts late.
  timer_remote_ring_interval: 3500ms

  # This device's own ESPHome config entry, or the empty string. Expects `mac`.
  # An entry id rather than a device target: the device form is deprecated and stops working in 2027.4.
  tts_self_entry_jinja: >-
    {% set ns = namespace(entry='') %}
    {% for e in integration_entities('esphome') %}
      {% if not ns.entry %}
        {% set d = device_id(e) %}
        {% if d and (mac | lower) in device_attr(d, 'connections') | map(attribute=1) | list %}
          {% set ns.entry = config_entry_id(e) or '' %}
        {% endif %}
      {% endif %}
    {% endfor %}

  # Nothing ever creates a notification under this id, so dismissing it leaves no state behind.
  ha_probe_notification_id: "satellite1_ha_action_probe"

globals:
  - id: tts_routing_to_remote
    type: bool
    restore_value: no
    initial_value: 'false'
  # Set as the announcement is sent, cleared by its outcome handler. Tells a call Home Assistant
  # answered from one it swallowed.
  - id: tts_announce_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  # Two triggers can send this turn's response and exactly one should. Cleared at on_start, so each
  # turn of a continued conversation gets a fresh one.
  - id: tts_remote_sent
    type: bool
    restore_value: no
    initial_value: 'false'
  # Arms tts_announce_watchdog. Replies are a Home Assistant 2025.12 feature and ESPHome never times
  # a pending one out, so without this the watchdog would flash after every response on an older one.
  - id: ha_action_replies_seen
    type: bool
    restore_value: no
    initial_value: 'false'
  # What ha_action_probe concluded about the "Allow the device to perform Home Assistant actions"
  # checkbox, which is off for every newly added device and reported by nothing in the API.
  #
  #   0  unknown, nothing asked yet      2  blocked, the checkbox is off
  #   1  allowed, an answer came back    3  unverifiable, this Home Assistant answers nothing
  - id: ha_actions_allowed
    type: int
    restore_value: no
    initial_value: '0'
  - id: ha_action_probe_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  # Parsed off the version Home Assistant announces itself with, so a silence cannot accuse an
  # older installation of a checkbox it may well have ticked.
  - id: ha_supports_action_replies
    type: bool
    restore_value: no
    initial_value: 'false'
  # The codec this device advertises, and the one the live connection read off ListEntities. Both
  # start false because the compile-time default in media_player.yaml is FLAC. They can only
  # disagree between a runtime change and the reconnect that publishes it.
  - id: tts_announce_format_mp3
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: tts_announce_format_advertised_mp3
    type: bool
    restore_value: no
    initial_value: 'false'
  # The target list pre-normalized, so the log can print a pasteable call. Only read into a log line.
  - id: tts_targets_literal
    type: std::string
    restore_value: no
  # False is both "checked, all native" and "not checked yet", so the status entity only accuses the
  # target list once a call has said so.
  - id: tts_targets_have_ma
    type: bool
    restore_value: no
    initial_value: 'false'
  # Whether the ring loop actually sent anything this ring, so the stop fan-out cannot aim
  # media_stop at targets that never received a ring - a Cast playing music would lose it to a
  # stop for an announcement that never happened. The same job tts_remote_sent does for responses.
  - id: timer_remote_ring_sent
    type: bool
    restore_value: no
    initial_value: 'false'

# "Remote TTS Targets" was a text entity here. Deleted, and this is the change the whole redesign
# turns on.
#
# It could not hold the selection. ESPHome caps a text entity at 255 characters - cv.int_range(max=255)
# in the template text schema, because the restore saver writes the length in a single byte - and
# TextCall::validate_() discards an over-length value and returns success. Measured on hardware: a 292
# character write answered HTTP 200 and changed nothing. This device's own area holds twelve players, so
# unticking one and storing the remaining eleven needs about 460 characters. The single most ordinary
# interaction in the app could not be saved.
#
# The selection now lives in the satellite1_web_ui component, as whole-area ids plus individually
# chosen players plus carve-outs, which makes that same edit cost about forty characters and keeps a
# speaker added to the area later included automatically. It also has no Home Assistant face at all,
# which is the point: a tree and a comma-separated text box are not two views of one control, they are
# two controls that happen to agree until they do not.
#
# The hint string went with it. It existed because the native API has no placeholder field and Home
# Assistant renders an empty text entity as "(empty value)", so an unset list had to be spelled out as
# a real state that every reader then had to recognise. Nothing reads a string here now.

# Re-check everything as the selection is edited, in place of the on_value the deleted text entity
# carried. Each script's own api.connected guard makes this a no-op before Home Assistant connects,
# which covers the restore at boot.
#
# The component fires this from its main loop, having collapsed however many writes arrived since the
# last iteration into one - dragging through a tree in the app writes several times a second, and each
# one would otherwise re-run every check here.
satellite1_web_ui:
  on_selection_change:
    - script.execute: ha_action_probe
    - script.execute: tts_targets_ma_check
    - script.execute: tts_routing_status_publish
    - script.execute: tts_announce_format_apply
    # The local speaker lives in the selection too, and this is what carries a change to it - including
    # one made mid-response, which is why it reconciles rather than latching at the start of a turn.
    - script.execute: audio_gain_reconcile

# Nothing republishes the two derived switches here, and nothing needs to. A template switch with a
# lambda evaluates it in its own loop() and hands the result to publish_state, which dedupes through
# Switch::publish_dedup_ - so each one follows the selection on its own and only sends a state change
# when there is one. component.update would be the obvious thing to reach for and does not even
# compile: TemplateSwitch is a Component, not a PollingComponent.

# Settle the codec before anything connects.
esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: tts_routing_status_publish
        # The first ListEntities of the boot then carries the right format and no reload is needed.
        - script.execute: tts_announce_format_apply

# Every client that completes the handshake fires this, `esphome logs` included, so the version
# string is what tells them apart - otherwise a run of `esphome logs` would hand the probe a silence
# to misread. Ticking the actions checkbox reloads the config entry, which reconnects the device,
# which is what makes the check below self-healing.
api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return client_info.rfind("Home Assistant", 0) == 0;'
        then:
          # Fires on the Connect handshake, ahead of ListEntities, so this is what the connection is
          # about to be told. Recording it lets a later change know it has something to publish.
          - lambda: 'id(tts_announce_format_advertised_mp3) = id(tts_announce_format_mp3);'
          - lambda: |-
              // The version follows the last space. Before 2025.12 Home Assistant answers no action
              // call at all, which must not read as a blocked device.
              id(ha_supports_action_replies) = false;
              size_t space = client_info.rfind(' ');
              if (space != std::string::npos) {
                int year = 0, month = 0;
                if (sscanf(client_info.c_str() + space + 1, "%d.%d", &year, &month) == 2) {
                  id(ha_supports_action_replies) = year > 2025 || (year == 2025 && month >= 12);
                  ESP_LOGD("tts_routing", "%s connected; action replies %s", client_info.c_str(),
                           id(ha_supports_action_replies) ? "supported" : "unsupported");
                }
              }
          # Home Assistant registers its action-call handler partway through its own connect
          # sequence, and a call that arrives first is dropped silently - the exact shape of a
          # blocked device.
          - delay: 5s
          - script.execute: ha_action_probe
          # Re-taken every connection: an all-native target list reads differently once Music
          # Assistant has adopted those players.
          - script.execute: tts_targets_ma_check

switch:
  # "Send responses to every media player in this device's own area."
  #
  # No longer a master switch, and no longer a stored value. It is a projection of the selection the
  # web app owns: the lambda reads "my own area is selected, with nothing carved out of it", and the
  # two actions write exactly that. One store, one derived view, so the two can never disagree -
  # which is the whole reason the fine-grained list left Home Assistant.
  #
  # Consequences worth knowing. There is no restore_mode, because there is nothing here to restore;
  # the selection restores itself from NVS and this follows it. It reads off before the first data
  # layer sync on a device that has never synced, because the area id is what the question is about
  # and only Home Assistant knows it - after one sync the id is persisted and that stops happening.
  # And it reads off whenever a single player in the area is unticked in the app, which is the
  # behaviour asked for: the switch is about the whole area, and that is no longer the whole area.
  #
  # Whether a response is going anywhere at all is now ${tts_routing_active}, not this switch. A
  # target picked in another room routes with this off, which the old master switch could not express.
  - platform: template
    id: tts_routing_enabled
    name: "Route TTS To All Area Players"
    icon: "mdi:speaker-multiple"
    entity_category: config
    # DISABLED, and load bearing. With any other mode Switch::get_initial_state_with_restore_mode()
    # returns a value, TemplateSwitch::setup() acts on it, and the action below writes to the store -
    # so a reboot would push a stale "off" into the selection. It only fails to bite today because
    # this switch sets up at HARDWARE-2 (798) and the store loads at WIFI (250), so the write lands
    # while the area id is still empty and is refused. There is nothing to restore in any case: the
    # state is derived, and publish_state would otherwise persist a bool that is already stored.
    restore_mode: DISABLED
    lambda: 'return id(web_ui_app)->selection().routing_whole_own_area();'
    turn_on_action:
      - lambda: 'id(web_ui_app)->selection().set_routing_whole_own_area(true);'
    turn_off_action:
      - lambda: 'id(web_ui_app)->selection().set_routing_whole_own_area(false);'

  # Whether the Remote TTS Targets sound their own wake chime when this device hears the wake word.
  # Eligibility is decided per call by wake_chime_targets_jinja, so targets need no reflash.
  # Independent of this device's own Wake sound, which governs its own speaker alone.
  - platform: template
    id: remote_wake_chime
    name: "Remote Wake Chime"
    icon: "mdi:bullhorn-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # Whether a ringing timer is mirrored to the routing targets. Default ON, unlike Remote Wake
  # Chime, and deliberately: the selection is already the opt-in for "audio from this device plays
  # over there", and a timer someone set and could not hear is the hole this closes - so anything
  # chosen means the ring travels, and this switch is the opt-out. The loop it gates is
  # timer_remote_ring_loop below.
  - platform: template
    id: remote_timer_ring
    name: "Remote Timer Ring"
    icon: "mdi:timer-alert-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # "Remote TTS Mutes Local Voice" was here. Deleted: whether this device speaks the answer aloud is
  # now the "Local Speaker" row at the top of the app's target list, stored as `local_speaker` in the
  # selection, where it sits next to the other places the answer can go instead of being a separate
  # inverted switch someone has to reason about. Default flipped with it - the app's row is ticked out
  # of the box, which is the same behaviour as this switch shipping off.
  #
  # Still carried out by audio_gain_reconcile, which ducks the local announcement channel rather than
  # stopping the pipeline - so the wake chime still plays either way, and on_end and both watchdogs
  # still have a local drain to wait for. It now reconciles from the selection-change trigger in
  # common/web_ui.yaml, which is what lets a change made mid-response land on that response.

select:
  # How long the microphone stays closed after a routed response drains here, to cover the skew of
  # targets that fetched the same URL independently. Without it the continued-conversation listen
  # opens the moment the local audio ends, a lagging target is still speaking the answer, and this
  # device transcribes its own response as a human reply - the AEC only cancels the local speaker.
  #
  # Carried out by the guard in on_end below, which enqueues a 0.5s embedded silence clip once per
  # step: the upstream voice_assistant starts the mic the moment the media player leaves ANNOUNCING
  # and exposes no delay knob, so occupying the announcement pipeline is the one YAML-reachable
  # lever - and everything else that needs "the response is still out there" (the un-duck, the
  # drain waits, the stop windows) gates on the same is_announcing, so one mechanism extends them
  # all coherently. An exact per-target completion callback was investigated and rejected: it
  # exists for assist-satellite targets (VoiceAssistantAnnounceFinished) and Music Assistant, but a
  # Sonos AudioClip is invisible to Home Assistant end to end, so one Sonos target forces a fixed
  # floor regardless.
  - platform: template
    id: remote_sync_guard
    name: "Remote Sync Guard"
    icon: "mdi:timer-sand"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "1s"
    options:
      - "0.5s"
      - "1s"
      - "1.5s"
      - "2s"

button:
  # Stops whatever announcement this device is playing: a routed response from another Satellite1,
  # its own answer's tail, a tts.speak. The receiving end of tts_remote_stop below - a router that
  # hears "stop" presses this button on every Satellite1 target, because it is the only lever Home
  # Assistant has that reaches the announcement pipeline (see tts_stop_buttons_jinja above for why
  # media_player.media_stop cannot).
  #
  # NEVER make this internal: true, and do not disable it by default. Like wake_sound and
  # tts_volume, other Satellite1s find it by substring over device_entities() -
  # 'stop_announcement' - and internal removes an entity from the native API, while button.press
  # refuses a disabled entity. Either would silently break every router's stop fan-out. It also
  # has to keep this object id: rename the entity and every peer on older firmware stops finding
  # it. diagnostic is as far out of the way as it can go - it moves the row into the collapsed
  # Diagnostics group on the device page, which is the most the UI-surface budget can recover
  # from an entity that has to stay callable.
  #
  # Deliberately narrow about voice: it does not touch a voice assistant session. A peer can be
  # mid-conversation with the person in its own room while it plays an announcement from this
  # one, and stopping the audio it is playing for us must not hang up the conversation it is
  # having for them.
  #
  # The tts_remote_stop at the end is what makes one press stop the response *everywhere*. On a
  # device that routed the playing response it fans out to the full target list - including the
  # Cast-like targets only the router knows about - and on any other device its guard makes it
  # free. So a peer that heard "stop" only has to reach this button, and the router carries the
  # stop the rest of the way. No loop is possible: the fan-out presses buttons, and a button
  # only fans out where a routing selection is active, which a mere receiver does not have.
  - platform: template
    id: stop_announcement_button
    name: "Stop Announcement"
    icon: "mdi:stop"
    entity_category: diagnostic
    on_press:
      # A ringing timer counts as the announcement to stop, and turning the switch off is the whole
      # job: its on_turn_off stops the local ring, ends the remote ring loop and stops the ring on
      # its targets (timer.yaml, timer_remote_ring_stop). This line is also what lets "stop" heard
      # at any TARGET silence the alarm at its origin - the target's tts_stop_broadcast presses
      # every FutureProofHomes stop button, this one included, and this one is the origin's.
      # First on purpose: the announcement stop below would silence the current clip but leave the
      # switch on, and the loop would ring again next cycle.
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - switch.turn_off: timer_ringing
      - if:
          condition:
            media_player.is_announcing:
              id: external_media_player
          then:
            - media_player.stop:
                announcement: true
                id: external_media_player
      - script.execute: tts_remote_stop

number:
  # This device's own level for speech: its own responses, and every announcement it receives.
  # 0 means "no override" and speech follows the media volume.
  #
  # Local only - nothing here travels with a routed call. On a device that is somebody else's
  # routing target it also decides whether that router may set this device's volume;
  # tts_volume_targets_jinja in area_ducking.yaml is the filter that asks.
  - platform: template
    id: tts_volume
    name: "Voice Override"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    mode: slider
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0
    icon: "mdi:account-voice"
    on_value:
      - script.execute: audio_gain_reconcile

  # The level asked of the speakers a response is routed to. Nothing local reads it. 0 means "leave
  # every target's volume alone". Above 0 it also arms tts_targets_volume_apply in area_ducking.yaml,
  # since only Sonos reads the per-call level the announcement carries.
  - platform: template
    id: remote_tts_volume
    name: "Remote TTS Volume"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    mode: slider
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0
    icon: "mdi:speaker-multiple"
    entity_category: config

text_sensor:
  # Everything that has to be true before a response reaches a remote speaker, in one line, so a
  # customer wondering why one did not has a single place to look. docs/TTS-Routing.md lists the
  # states and what each one means.
  - platform: template
    id: tts_routing_status
    name: "Remote TTS Status"
    icon: "mdi:cast-audio"
    entity_category: "diagnostic"
    update_interval: never
    # Rewritten for whole-area selection. Counting commas no longer describes the configuration: an
    # area is one entry standing for however many speakers are in it today, so "Ready: 1 target" for a
    # twelve-player room would be a lie the customer could not check. It now reports what was chosen -
    # areas and individually picked players - and leaves the expansion to the call, which is the only
    # moment the true count exists.
    lambda: |-
      const auto &sel = id(web_ui_app)->selection().routing();
      if (sel.empty()) {
        return std::string(id(web_ui_app)->selection().local_speaker() ? "Off (local playback)"
                                                                      : "Nowhere to play the response");
      }
      if (id(ha_actions_allowed) == 2) {
        return std::string("Blocked: allow HA actions in device settings");
      }
      // Ahead of the version caveat, because this was established by a call HA actually ran.
      if (id(tts_targets_have_ma)) {
        return std::string("Music Assistant ids in targets");
      }
      if (id(ha_actions_allowed) == 3) {
        return std::string("Cannot verify: Home Assistant older than 2025.12");
      }
      // Counted the way Home Assistant reads the lists, so a trailing comma does not inflate either.
      const auto count = [](const std::string &csv) {
        int n = 0;
        size_t start = 0;
        while (start <= csv.size()) {
          size_t comma = csv.find(',', start);
          size_t end = comma == std::string::npos ? csv.size() : comma;
          if (csv.substr(start, end - start).find_first_not_of(" \t") != std::string::npos) {
            n++;
          }
          if (comma == std::string::npos) {
            break;
          }
          start = comma + 1;
        }
        return n;
      };
      const int areas = count(sel.areas.c_str());
      const int players = count(sel.extra.c_str());
      std::string out("Ready: ");
      if (areas > 0) {
        out += std::to_string(areas) + (areas == 1 ? " area" : " areas");
      }
      if (players > 0) {
        if (areas > 0) {
          out += ", ";
        }
        out += std::to_string(players) + (players == 1 ? " player" : " players");
      }
      return out;

script:
  # Outcome handlers for every action this package fires. Scripts rather than inline blocks, because
  # on_error's arguments are the error string plus the enclosing automation's own, and a reporting
  # call written inline would nest an `error` argument inside a scope that already has one.
  #
  # What reaches here is narrow: Home Assistant answers a failure only for ServiceNotFound,
  # ServiceValidationError and vol.Invalid. Anything else goes unanswered, hence the watchdog below.
  - id: tts_call_ok
    parameters:
      call: string
    then:
      - lambda: |-
          id(ha_action_replies_seen) = true;
          id(tts_announce_pending) = false;
          ESP_LOGD("tts_routing", "%s accepted", call.c_str());

  # Neither handler may test tts_routing_to_remote: on_end clears it when the local pipeline drains,
  # which is often before this reply arrives.
  - id: tts_call_error
    parameters:
      call: string
      reason: string
    then:
      - lambda: |-
          id(ha_action_replies_seen) = true;
          id(tts_announce_pending) = false;
          ESP_LOGE("tts_routing", "%s failed: %s", call.c_str(), reason.c_str());
      - script.execute: tts_call_flash

  # Five fast red pulses, the same warning the mute switch uses. control_leds tests `warning` ahead
  # of every voice assistant phase, and control_leds_warning clears the flag after 2s.
  - id: tts_call_flash
    then:
      - lambda: 'id(warning) = true;'
      - script.execute: control_leds

  # Tests the actions checkbox by asking one harmless question and reading the answer off whether one
  # comes back at all - with the box unticked Home Assistant returns without responding, and that
  # silence is the entire signal available. Firing the call is also what raises the repair issue in
  # Home Assistant that carries the fix.
  #
  # No longer gated on routing (it was, "so a device that never routes never trips it"). The web
  # app's onboarding splash reads this verdict off /api/sat1/ha on every device, routing or not -
  # found the hard way September 18 2026, when a blocked test device with an empty selection showed
  # the splash "still asking" forever because nothing had ever concluded the verdict. The cost of
  # ungating is one no-op call per connect; a blocked device already fires dropped action calls at
  # Home Assistant from the web UI's own sync ladder, so this adds no new noise where it matters.
  - id: ha_action_probe
    mode: restart
    then:
      - if:
          condition:
            api.connected:
          then:
            - lambda: 'id(ha_action_probe_pending) = true;'
            - homeassistant.service:
                service: persistent_notification.dismiss
                data:
                  notification_id: "${ha_probe_notification_id}"
                # Either outcome proves the channel is open: an error means the call ran.
                on_success:
                  - script.execute: ha_action_probe_answered
                on_error:
                  - script.execute: ha_action_probe_answered
            # A reply to a no-op lands in milliseconds; this is slack for a busy installation.
            - delay: 5s
            - if:
                condition:
                  # A silence is only evidence if the connection outlasted the window; the reconnect
                  # asks again anyway.
                  lambda: 'return id(ha_action_probe_pending) && id(api_id).is_connected();'
                then:
                  - lambda: |-
                      id(ha_action_probe_pending) = false;
                      id(ha_actions_allowed) = id(ha_supports_action_replies) ? 2 : 3;
                  - script.execute: tts_routing_status_publish
                  - if:
                      condition:
                        lambda: 'return id(ha_actions_allowed) == 2;'
                      then:
                        # Split across messages: the logger's tx_buffer_size defaults to 512 bytes.
                        - lambda: |-
                            ESP_LOGE("tts_routing",
                                     "Home Assistant rejected an action call, so no TTS response "
                                     "can be routed anywhere and every one will play locally.");
                            ESP_LOGE("tts_routing",
                                     "  Fix: Settings > Devices & services > ESPHome > this "
                                     "device > CONFIGURE, tick 'Allow the device to perform Home "
                                     "Assistant actions'. Routing works immediately afterwards.");
                        - script.execute: tts_call_flash
                      else:
                        # A warning and no red ring: nothing is provably wrong with this installation.
                        - lambda: |-
                            ESP_LOGW("tts_routing",
                                     "Cannot confirm this device may perform Home Assistant "
                                     "actions; Home Assistant 2025.12 is the first version that "
                                     "answers action calls. If responses play locally, check the "
                                     "option in this device's ESPHome settings.");

  # Any answer at all means the checkbox is ticked. Setting ha_action_replies_seen here arms the
  # watchdog from the moment Home Assistant connects, rather than after the first real interaction.
  - id: ha_action_probe_answered
    then:
      - lambda: |-
          id(ha_action_probe_pending) = false;
          id(ha_action_replies_seen) = true;
          if (id(ha_actions_allowed) != 1) {
            ESP_LOGI("tts_routing", "Home Assistant actions are allowed");
          }
          id(ha_actions_allowed) = 1;
      - script.execute: tts_routing_status_publish

  # Warns when Remote TTS Targets holds Music Assistant entity ids, which serialize playback across
  # the targets and make Sonos start late and clip.
  #
  # get_queue only reads, so aiming it at the target list changes nothing, and the answer is in
  # whether one comes back: a target MA owns produces a response, a list it owns none of raises
  # HomeAssistantError, and no MA at all raises ServiceNotFound. Both failures are the correct
  # configuration, which is why success is the branch that complains.
  - id: tts_targets_ma_check
    mode: restart
    then:
      - if:
          condition:
            and:
              - api.connected:
              # Without replies neither branch fires, so this would be a question asked into a void.
              - lambda: 'return ${tts_routing_active} && id(ha_supports_action_replies);'
          then:
            - homeassistant.action:
                action: music_assistant.get_queue
                capture_response: true
                data_template:
                  entity_id: >-
                    ${self_area_jinja}
                    ${tts_targets_jinja}
                variables:
                  mac: !lambda 'return esphome::get_mac_address_pretty();'
                  sel_areas: !lambda 'return id(web_ui_app)->selection().routing().areas.c_str();'
                  sel_extra: !lambda 'return id(web_ui_app)->selection().routing().extra.c_str();'
                  sel_cut: !lambda 'return id(web_ui_app)->selection().routing().excluded.c_str();'
                # Only the ids the queues came back under matter, so they are rendered on Home
                # Assistant's side to keep kilobytes off the wire. ESPHome wraps it as {"response":}.
                response_template: "{{ response.keys() | list | join(', ') }}"
                on_success:
                  - lambda: |-
                      id(tts_targets_have_ma) = true;
                      // Split across messages: logger tx_buffer_size defaults to 512 bytes.
                      ESP_LOGE("tts_routing",
                               "Remote TTS Targets contains Music Assistant entity ids: %s",
                               response["response"].as<const char *>());
                      ESP_LOGE("tts_routing",
                               "  Responses sent to these play one speaker at a time and clip on "
                               "Sonos. Fix: replace each with the native entity id for the same "
                               "speaker - the one the speaker's own integration created.");
                  - script.execute: tts_routing_status_publish
                # No Music Assistant entity in the list, or no Music Assistant at all.
                on_error:
                  - lambda: 'id(tts_targets_have_ma) = false;'
                  - script.execute: tts_routing_status_publish
          else:
            # Nothing was asked, so nothing is known: a verdict about a target list that has since
            # been edited must not outlive it.
            - lambda: 'id(tts_targets_have_ma) = false;'

  # Re-reads Remote TTS Status, whose update_interval is never.
  - id: tts_routing_status_publish
    then:
      - component.update: tts_routing_status
      # The web app reads the same verdict as `actions` on /api/sat1/ha, where it is what lets the
      # onboarding screen say "tick this checkbox" or "upgrade Home Assistant" instead of hedging
      # between them. Pushed here because this script is the one chokepoint every transition of
      # ha_actions_allowed already runs through - boot, a probe answered, the silence watchdog's
      # verdict, a selection change.
      - lambda: 'id(web_ui_app)->set_ha_actions(id(ha_actions_allowed));'

  # Renders the selection for the call log.
  #
  # It used to emit the resolved entity id list, which was pasteable straight into Developer Tools. It
  # cannot any more: whole-area entries only become entity ids on Home Assistant's side, at the moment
  # of the call, so the device genuinely does not know the resolved list. What it logs instead is what
  # was chosen - `area:media_room` alongside any individually picked ids - which is the honest answer
  # and still tells you where to look when a response goes somewhere unexpected.
  - id: tts_targets_parse
    then:
      - lambda: |-
          const auto &sel = id(web_ui_app)->selection().routing();
          std::string all;
          const auto append = [&all](const std::string &csv, const char *prefix) {
            size_t start = 0;
            while (start <= csv.size()) {
              size_t comma = csv.find(',', start);
              size_t end = comma == std::string::npos ? csv.size() : comma;
              std::string entry = csv.substr(start, end - start);
              size_t begin = entry.find_first_not_of(" \t");
              if (begin != std::string::npos) {
                entry = entry.substr(begin, entry.find_last_not_of(" \t") - begin + 1);
                if (!all.empty()) {
                  all += ", ";
                }
                all += std::string("'") + prefix + entry + "'";
              }
              if (comma == std::string::npos) {
                break;
              }
              start = comma + 1;
            }
          };
          append(sel.areas.c_str(), "area:");
          append(sel.extra.c_str(), "");
          id(tts_targets_literal) = "[" + all + "]";

  # MP3 while routing is on, FLAC when it is off. Home Assistant reads this format off ListEntities
  # and hands it to the TTS engine, so it decides the extension on the one URL every target is
  # given - and a Sonos AudioClip accepts MP3 and WAV only, silently playing nothing for FLAC.
  - id: tts_announce_format_apply
    mode: restart
    then:
      - lambda: |-
          const bool want_mp3 = ${tts_routing_active};
          if (want_mp3 != id(tts_announce_format_mp3)) {
            media_player::MediaPlayerSupportedFormat fmt;
            fmt.purpose = media_player::MediaPlayerFormatPurpose::PURPOSE_ANNOUNCEMENT;
            fmt.sample_rate = 48000;
            // Stereo for the travelling MP3, mono for the local FLAC. A mono clip lands on a Sonos
            // soundbar's center channel only and sounds thin; stereo renders across the bar (it
            // still cannot reach bonded surrounds - the AudioClip API is per-player, see
            // docs/TTS-Routing.md). The local pipeline is configured num_channels: 1, but that
            // only shapes what is advertised - the decode chain carries the file's own channel
            // count and the mixer maps it onto its 2-channel output, so the stereo response
            // plays here unchanged (verified against ESPHome 2026.8.1's resampler and mixer).
            fmt.num_channels = want_mp3 ? 2 : 1;
            fmt.format = want_mp3 ? "mp3" : "flac";
            // Zero for MP3 rather than 2, and not an oversight: speaker_source's own codegen leaves
            // the field out for that codec because Home Assistant's ffmpeg transcode fails when
            // bytes-per-sample is specified alongside it.
            fmt.sample_bytes = want_mp3 ? 0 : 2;
            id(external_media_player).set_format(speaker_source::ANNOUNCEMENT_PIPELINE, fmt);
            id(tts_announce_format_mp3) = want_mp3;
            ESP_LOGI("tts_routing", "Announcement codec set to %s", fmt.format.c_str());
          }
      - if:
          # Tested against what the live connection was told, not the previous value, so a reload
          # that reached nobody is retried by the next change. Neither half runs on the boot path.
          condition:
            and:
              - api.connected:
              - lambda: 'return id(tts_announce_format_mp3) != id(tts_announce_format_advertised_mp3);'
          then:
            # ListEntities is sent once per connection, so reloading the entry is how the device asks
            # for the reconnect that republishes it. An unresolvable entry id fails with a ValueError,
            # which Home Assistant does not answer for, so the codec then waits for the next reboot.
            - lambda: |-
                ESP_LOGI("tts_routing",
                         "Reloading this device in Home Assistant so it re-reads the codec");
            - homeassistant.service:
                service: homeassistant.reload_config_entry
                data_template:
                  entry_id: >-
                    ${tts_self_entry_jinja}
                    {{ ns.entry }}
                variables:
                  mac: !lambda 'return esphome::get_mac_address_pretty();'

  # Sends the response to the Remote TTS Targets, for whichever of the two triggers arrives first.
  # on_intent_progress normally wins, ~36ms after intent start against ~1.1s for on_tts_end, so
  # every target starts from the same moment this speaker does. on_tts_end is the fallback for a TTS
  # engine that does not stream.
  - id: tts_route_response
    mode: single
    parameters:
      url: string
    then:
      - if:
          condition:
            # This interaction's routing decision, plus the flag that makes two triggers one call.
            lambda: 'return id(tts_routing_to_remote) && !id(tts_remote_sent);'
          then:
            - lambda: 'id(tts_remote_sent) = true;'
            # Lift the targets to Remote TTS Volume now, as late as possible: any earlier trigger
            # (it used to be on_intent_start, in area_ducking.yaml) leaves a music-playing target
            # blasting at the response's level for however long generation takes before the response
            # arrives. The script no-ops at slider 0 and on the sign-in prompt path, where no
            # snapshot was taken. Defined in area_ducking.yaml, which always merges alongside this
            # package (satellite1.base.yaml lists both).
            - script.execute: tts_targets_volume_apply
            # Slack for that lift. Dispatch order is not the worry, application is: a networked
            # speaker takes a round trip to accept a volume, and a response that starts at the old
            # level and jumps is what this prevents.
            - if:
                condition:
                  lambda: 'return id(remote_tts_volume).state > 0;'
                then:
                  - delay: 250ms
            # The call written out as the action it will become, so it can be pasted into Developer
            # Tools > Actions unchanged. One line per key: the logger's tx_buffer_size is 512 bytes.
            - script.execute: tts_targets_parse
            - lambda: |-
                ESP_LOGD("tts_routing", "routing response: volume %d%%, codec %s",
                         (int) id(remote_tts_volume).state,
                         id(tts_announce_format_mp3) ? "mp3" : "flac");
            # One call, to every target. No guard on the list: an empty entity_id is a no-op rather
            # than an error, and on_start has already logged that nothing is set.
            #
            # announce_volume is sent to nobody - native Squeezebox reads it as a 0.0-1.0 float and
            # rejects the call outright above 1. Only Sonos honours a per-call level, via extra.volume.
            #
            # play_on_bonded is read by exactly one integration, the sonos_cloud custom one, where
            # it fans the clip out to every speaker bonded into the room - the only path to Sonos
            # surrounds, since the AudioClip API is per-player and the native integration only
            # reaches the bonded set's primary. Everyone else ignores unknown extra keys, the same
            # reasoning use_pre_announce already rides on, so it is sent unconditionally and costs
            # a user nothing until they install that integration and pick its entity in the tree.
            - lambda: |-
                const int vol = (int) id(remote_tts_volume).state;
                ESP_LOGD("tts_routing", "action: media_player.play_media");
                ESP_LOGD("tts_routing", "data:");
                ESP_LOGD("tts_routing", "  entity_id: %s", id(tts_targets_literal).c_str());
                ESP_LOGD("tts_routing", "  media_content_id: %s", url.c_str());
                ESP_LOGD("tts_routing", "  media_content_type: music");
                ESP_LOGD("tts_routing", "  announce: true");
                if (vol > 0) {
                  ESP_LOGD("tts_routing",
                           "  extra: {'use_pre_announce': false, 'play_on_bonded': true, 'volume': %d}",
                           vol);
                } else {
                  ESP_LOGD("tts_routing", "  extra: {'use_pre_announce': false, 'play_on_bonded': true}");
                }
            - lambda: 'id(tts_announce_pending) = true;'
            - homeassistant.service:
                service: media_player.play_media
                data:
                  media_content_type: music
                  announce: "true"
                data_template:
                  entity_id: >-
                    ${self_area_jinja}
                    ${tts_targets_jinja}
                  media_content_id: "{{ tts_url }}"
                  extra: >-
                    {{ {'use_pre_announce': false, 'play_on_bonded': true, 'volume': vol | int}
                       if vol | int > 0 else {'use_pre_announce': false, 'play_on_bonded': true} }}
                variables:
                  mac: !lambda 'return esphome::get_mac_address_pretty();'
                  sel_areas: !lambda 'return id(web_ui_app)->selection().routing().areas.c_str();'
                  sel_extra: !lambda 'return id(web_ui_app)->selection().routing().extra.c_str();'
                  sel_cut: !lambda 'return id(web_ui_app)->selection().routing().excluded.c_str();'
                  tts_url: !lambda 'return url;'
                  vol: !lambda 'return (int) id(remote_tts_volume).state;'
                on_success:
                  - script.execute:
                      id: tts_call_ok
                      call: "media_player.play_media"
                on_error:
                  - script.execute:
                      id: tts_call_error
                      call: "media_player.play_media"
                      reason: !lambda 'return error;'
            # Started once the call is out, so it has something to wait on.
            - script.execute: tts_announce_watchdog

  # Covers the failures Home Assistant never reports: an unanswered call leaves ESPHome holding the
  # pending callback forever, so the response would vanish with nothing in this log to show it.
  # The wait is self-calibrating - the local pipeline received the same URL and drains when the
  # response ends - and the delay after it covers a Music Assistant target, whose reply only returns
  # once the controller has slept out the announcement's length. Nothing is played late.
  - id: tts_announce_watchdog
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(ha_action_replies_seen);'
          then:
            - wait_until:
                condition:
                  not:
                    media_player.is_announcing: external_media_player
                timeout: 30s
            - delay: 15s
            - if:
                condition:
                  lambda: 'return id(tts_announce_pending);'
                then:
                  - lambda: |-
                      ESP_LOGE("tts_routing",
                               "Home Assistant never answered media_player.play_media; "
                               "the response may not have played");
                  - script.execute: tts_call_flash
                  # An unanswered call is also what a revoked checkbox looks like, so ask again.
                  - script.execute: ha_action_probe

  # Asks every eligible Remote TTS Target to sound its own wake chime. Fired from
  # on_wake_word_detected ahead of the local chime, and nothing waits on it: the chime is not part
  # of the interaction, and the assistant must start regardless.
  #
  # bypass_proxy is not decoration. Home Assistant substitutes an ffmpeg proxy URL for any media id
  # whose scheme and netloc parse, which audio-file:// satisfies, and ffmpeg cannot open that URI -
  # so without the flag the call succeeds, the log stays clean and no chime is ever heard.
  - id: remote_wake_chime_send
    mode: single
    then:
      - if:
          condition:
            and:
              - api.connected:
              - switch.is_on: remote_wake_chime
              - lambda: 'return ${tts_routing_active};'
          then:
            # No guard on the target list: an empty entity_id is a no-op, so every target being a
            # Sonos, or every target's chime being off, costs one ignored call.
            - homeassistant.action:
                action: media_player.play_media
                data:
                  media_content_type: music
                  announce: "true"
                  media_content_id: "${wake_chime_uri}"
                data_template:
                  entity_id: >-
                    ${self_area_jinja}
                    ${tts_targets_resolve}
                    ${wake_chime_targets_jinja}
                    {{ chime_players }}
                  extra: "{{ {'bypass_proxy': true} }}"
                variables:
                  mac: !lambda 'return esphome::get_mac_address_pretty();'
                  sel_areas: !lambda 'return id(web_ui_app)->selection().routing().areas.c_str();'
                  sel_extra: !lambda 'return id(web_ui_app)->selection().routing().extra.c_str();'
                  sel_cut: !lambda 'return id(web_ui_app)->selection().routing().excluded.c_str();'
                on_error:
                  - script.execute:
                      id: remote_wake_chime_error
                      reason: !lambda 'return error;'
            # The same wake word for the targets that are not Satellite1s, by device-served MP3
            # rather than audio-file://, because only a Satellite1 has the chime in its own flash.
            # Same switch, one decision. Latency expectation, measured against the platform rather
            # than this call: a Sonos plays a clip 0.5-1.5s after the request and offers no
            # preload, so this chime can land after listening has begun - dispatching ahead of the
            # local chime (the caller's ordering) plus a small file is the best available, and the
            # docs say so rather than letting it read as a bug. No per-target Wake sound test
            # either: only a Satellite1 has that switch, so for these targets Remote Wake Chime
            # alone decides.
            - homeassistant.action:
                action: media_player.play_media
                data:
                  media_content_type: music
                  announce: "true"
                data_template:
                  entity_id: >-
                    ${self_area_jinja}
                    ${tts_targets_resolve}
                    ${non_sat1_targets_jinja}
                    {{ other_players }}
                  media_content_id: "{{ chime_url }}"
                  # play_on_bonded: the sonos_cloud fan-out to bonded surrounds; everyone else
                  # ignores it. See tts_route_response for the full reasoning.
                  #
                  # volume rides along exactly as it does on the response and the timer ring -
                  # found missing on hardware September 20 2026, when the response honoured Remote
                  # TTS Volume and the chime in front of it played at a level of its own. Only
                  # Sonos (native and cloud) reads it, per clip, so no snapshot is needed and
                  # nothing has to be put back.
                  extra: >-
                    {{ {'use_pre_announce': false, 'play_on_bonded': true, 'volume': vol | int}
                       if vol | int > 0
                       else {'use_pre_announce': false, 'play_on_bonded': true} }}
                variables:
                  mac: !lambda 'return esphome::get_mac_address_pretty();'
                  sel_areas: !lambda 'return id(web_ui_app)->selection().routing().areas.c_str();'
                  sel_extra: !lambda 'return id(web_ui_app)->selection().routing().extra.c_str();'
                  sel_cut: !lambda 'return id(web_ui_app)->selection().routing().excluded.c_str();'
                  chime_url: !lambda |-
                    ${sat1_sounds_url_lambda}
                    return "http://" + sat1_ip + "/api/sat1/sounds/wake_word_triggered.mp3";
                  vol: !lambda 'return (int) id(remote_tts_volume).state;'
                on_error:
                  - script.execute:
                      id: remote_wake_chime_error
                      reason: !lambda 'return error;'

  # A chime that did not arrive, reported to the log and nowhere else. Deliberately not
  # tts_call_error: that clears tts_announce_pending, which belongs to the announcement, and flashes
  # red - which in this firmware means the answer went nowhere, not that a chime was missed.
  - id: remote_wake_chime_error
    parameters:
      reason: string
    then:
      - lambda: |-
          id(ha_action_replies_seen) = true;
          ESP_LOGE("tts_routing", "wake chime call failed: %s", reason.c_str());

  # Mirrors a ringing timer onto the routing targets, one device-served MP3 announcement per ring
  # cycle. Started and stopped by timer_ringing's own turn handlers in timer.yaml; gated by the
  # Remote Timer Ring switch above.
  #
  # One call to the WHOLE resolved list, Satellite1 peers included, rather than audio-file:// to
  # the peers: an HTTP announcement is what arms a target's stop word (announce_stop_word_arm in
  # voice_assistant.yaml keys on http_announcement_source), so "stop" spoken next to any target
  # works with no target-side changes - and the relay closes at the origin, whose Stop Announcement
  # button now also silences a ringing timer. bypass_proxy keeps Home Assistant from substituting
  # its ffmpeg proxy on the ESPHome targets; every other integration ignores the key.
  #
  # A re-fire loop rather than a repeat on the targets, because no repeat mode crosses the wire and
  # Sonos could not honour one anyway - an AudioClip cannot be cancelled, so short clips re-sent
  # until the ring ends ARE the stop story for Sonos: ending the loop stops it, one clip tail at
  # most. The volume rides extra.volume exactly as a routed response's does, and only Sonos reads
  # it; a Satellite1 target plays the ring at its own Voice Override like any HTTP announcement.
  - id: timer_remote_ring_loop
    mode: restart
    then:
      - while:
          condition:
            and:
              - api.connected:
              - switch.is_on: timer_ringing
              - switch.is_on: remote_timer_ring
              - lambda: 'return ${tts_routing_active};'
          then:
            - lambda: 'id(timer_remote_ring_sent) = true;'
            - homeassistant.action:
                action: media_player.play_media
                data:
                  media_content_type: music
                  announce: "true"
                data_template:
                  entity_id: >-
                    ${self_area_jinja}
                    ${tts_targets_jinja}
                  media_content_id: "{{ ring_url }}"
                  # play_on_bonded: the sonos_cloud fan-out to bonded surrounds; everyone else
                  # ignores it. See tts_route_response for the full reasoning.
                  extra: >-
                    {{ {'use_pre_announce': false, 'bypass_proxy': true, 'play_on_bonded': true,
                        'volume': vol | int}
                       if vol | int > 0
                       else {'use_pre_announce': false, 'bypass_proxy': true, 'play_on_bonded': true} }}
                variables:
                  mac: !lambda 'return esphome::get_mac_address_pretty();'
                  sel_areas: !lambda 'return id(web_ui_app)->selection().routing().areas.c_str();'
                  sel_extra: !lambda 'return id(web_ui_app)->selection().routing().extra.c_str();'
                  sel_cut: !lambda 'return id(web_ui_app)->selection().routing().excluded.c_str();'
                  ring_url: !lambda |-
                    ${sat1_sounds_url_lambda}
                    return "http://" + sat1_ip + "/api/sat1/sounds/timer_finished.mp3";
                  vol: !lambda 'return (int) id(remote_tts_volume).state;'
            # The call above deliberately carries no on_error, and the absence is load-bearing. An
            # on_error (or on_success) makes the call register a pending response callback in the
            # API server, and that vector's entries are only ever erased when Home Assistant
            # answers - it has no timeout. A silent Home Assistant (the actions checkbox off, or a
            # pre-2025.12 install that answers no call) therefore leaked one ~100-byte callback per
            # iteration of this loop, every ${timer_remote_ring_interval}, for as long as a timer
            # rang - the highest-frequency repeating action call in the firmware, aimed straight at
            # the internal heap. Fire-and-forget registers nothing. The cost is one WARN per failed
            # send, which repeated every 3.5s anyway; the response-routing calls still carry
            # on_error, so a broken installation is still reported where it is actionable.
            - delay: ${timer_remote_ring_interval}

  # Stops the mirrored ring on the targets when the local one ends, by the same platform split as
  # tts_remote_stop: Stop Announcement buttons for the Satellite1s, media_stop for the rest, and
  # the preempt clip for Sonos - a playing ring clip cannot be cancelled, but a new LOW-priority
  # clip interrupts it at any time (see tts_stop_sonos_jinja), so the tail shrinks from the rest
  # of the clip to the preempt's ~0.4s. Gated on the loop having actually sent something, for the
  # same reason tts_remote_stop gates on tts_remote_sent: a stop aimed at a target that never
  # received a ring would interrupt whatever it was playing instead.
  - id: timer_remote_ring_stop
    mode: single
    then:
      - if:
          condition:
            and:
              - api.connected:
              - lambda: 'return id(timer_remote_ring_sent);'
          then:
            - lambda: 'id(timer_remote_ring_sent) = false;'
            - lambda: 'ESP_LOGI("tts_routing", "stopping the mirrored timer ring on the remote targets");'
            - homeassistant.action:
                action: button.press
                data_template:
                  entity_id: >-
                    ${self_area_jinja}
                    ${tts_targets_resolve}
                    ${tts_stop_buttons_jinja}
                variables:
                  mac: !lambda 'return esphome::get_mac_address_pretty();'
                  sel_areas: !lambda 'return id(web_ui_app)->selection().routing().areas.c_str();'
                  sel_extra: !lambda 'return id(web_ui_app)->selection().routing().extra.c_str();'
                  sel_cut: !lambda 'return id(web_ui_app)->selection().routing().excluded.c_str();'
                on_error:
                  - script.execute:
                      id: tts_remote_stop_error
                      reason: !lambda 'return error;'
            - homeassistant.action:
                action: media_player.media_stop
                data_template:
                  entity_id: >-
                    ${self_area_jinja}
                    ${tts_targets_resolve}
                    ${tts_stop_players_jinja}
                variables:
                  mac: !lambda 'return esphome::get_mac_address_pretty();'
                  sel_areas: !lambda 'return id(web_ui_app)->selection().routing().areas.c_str();'
                  sel_extra: !lambda 'return id(web_ui_app)->selection().routing().extra.c_str();'
                  sel_cut: !lambda 'return id(web_ui_app)->selection().routing().excluded.c_str();'
                on_error:
                  - script.execute:
                      id: tts_remote_stop_error
                      reason: !lambda 'return error;'
            # The Sonos preempt, exactly as tts_remote_stop sends it: a fresh clip interrupts the
            # ring clip still playing, cutting the tail to ~0.4s.
            - homeassistant.action:
                action: media_player.play_media
                data:
                  media_content_type: music
                  announce: "true"
                data_template:
                  entity_id: >-
                    ${self_area_jinja}
                    ${tts_targets_resolve}
                    ${tts_stop_sonos_jinja}
                  media_content_id: "{{ stop_url }}"
                  extra: "{{ {'use_pre_announce': false, 'bypass_proxy': true, 'play_on_bonded': true} }}"
                variables:
                  mac: !lambda 'return esphome::get_mac_address_pretty();'
                  sel_areas: !lambda 'return id(web_ui_app)->selection().routing().areas.c_str();'
                  sel_extra: !lambda 'return id(web_ui_app)->selection().routing().extra.c_str();'
                  sel_cut: !lambda 'return id(web_ui_app)->selection().routing().excluded.c_str();'
                  stop_url: !lambda |-
                    ${sat1_sounds_url_lambda}
                    return "http://" + sat1_ip + "/api/sat1/sounds/stop_clip.mp3";
                on_error:
                  - script.execute:
                      id: tts_remote_stop_error
                      reason: !lambda 'return error;'
          else:
            # A loop that never sent has nothing to stop, but the flag must not survive into the
            # next ring.
            - lambda: 'id(timer_remote_ring_sent) = false;'

  # Cuts a routed response off on its remote targets. Fired from on_wake_word_detected in
  # voice_assistant.yaml alongside the local stop - by "stop", or by any wake word, since every
  # wake word interrupts a running answer locally and the remote half should not behave differently.
  #
  # The guard is what keeps this honest. tts_remote_sent means this turn's play_media actually went
  # out, and tts_routing_to_remote is cleared once the local pipeline drains - and the local
  # pipeline always receives the response, ducked to silence when Local Speaker is off, so its
  # lifetime tracks the remote playback closely enough to gate on. After it clears, a wake word is
  # a new conversation, not an interruption, and stopping targets then could cut off resumed music.
  #
  # Three calls because the targets split by platform - see tts_stop_buttons_jinja,
  # tts_stop_players_jinja and tts_stop_sonos_jinja for the reasoning: buttons for the
  # Satellite1s, media_stop for the generic players, and the preempt clip for Sonos, whose
  # playing announcement no stop action can reach but a new LOW-priority clip interrupts at any
  # time. Any list can be empty; an empty entity_id is a no-op, same as the routing call itself.
  - id: tts_remote_stop
    mode: single
    then:
      - if:
          condition:
            and:
              - api.connected:
              - lambda: 'return id(tts_routing_to_remote) && id(tts_remote_sent);'
          then:
            - lambda: 'ESP_LOGI("tts_routing", "stopping the routed response on the remote targets");'
            - homeassistant.action:
                action: button.press
                data_template:
                  entity_id: >-
                    ${self_area_jinja}
                    ${tts_targets_resolve}
                    ${tts_stop_buttons_jinja}
                variables:
                  mac: !lambda 'return esphome::get_mac_address_pretty();'
                  sel_areas: !lambda 'return id(web_ui_app)->selection().routing().areas.c_str();'
                  sel_extra: !lambda 'return id(web_ui_app)->selection().routing().extra.c_str();'
                  sel_cut: !lambda 'return id(web_ui_app)->selection().routing().excluded.c_str();'
                on_error:
                  - script.execute:
                      id: tts_remote_stop_error
                      reason: !lambda 'return error;'
            - homeassistant.action:
                action: media_player.media_stop
                data_template:
                  entity_id: >-
                    ${self_area_jinja}
                    ${tts_targets_resolve}
                    ${tts_stop_players_jinja}
                variables:
                  mac: !lambda 'return esphome::get_mac_address_pretty();'
                  sel_areas: !lambda 'return id(web_ui_app)->selection().routing().areas.c_str();'
                  sel_extra: !lambda 'return id(web_ui_app)->selection().routing().extra.c_str();'
                  sel_cut: !lambda 'return id(web_ui_app)->selection().routing().excluded.c_str();'
                on_error:
                  - script.execute:
                      id: tts_remote_stop_error
                      reason: !lambda 'return error;'
            # The Sonos preempt: a fresh announcement interrupts the playing one (LOW interrupts
            # LOW, see tts_stop_sonos_jinja), so the response's tail becomes stop_clip.mp3's
            # ~0.4s faint tone instead of the rest of the answer. Device-served like the ring and
            # chime, so it shares their topology requirement: the speaker must reach the satellite
            # over HTTP. bypass_proxy for the same reason the ring sends it; play_on_bonded so a
            # sonos_cloud target's stop reaches every bonded speaker its response did.
            - homeassistant.action:
                action: media_player.play_media
                data:
                  media_content_type: music
                  announce: "true"
                data_template:
                  entity_id: >-
                    ${self_area_jinja}
                    ${tts_targets_resolve}
                    ${tts_stop_sonos_jinja}
                  media_content_id: "{{ stop_url }}"
                  extra: "{{ {'use_pre_announce': false, 'bypass_proxy': true, 'play_on_bonded': true} }}"
                variables:
                  mac: !lambda 'return esphome::get_mac_address_pretty();'
                  sel_areas: !lambda 'return id(web_ui_app)->selection().routing().areas.c_str();'
                  sel_extra: !lambda 'return id(web_ui_app)->selection().routing().extra.c_str();'
                  sel_cut: !lambda 'return id(web_ui_app)->selection().routing().excluded.c_str();'
                  stop_url: !lambda |-
                    ${sat1_sounds_url_lambda}
                    return "http://" + sat1_ip + "/api/sat1/sounds/stop_clip.mp3";
                on_error:
                  - script.execute:
                      id: tts_remote_stop_error
                      reason: !lambda 'return error;'

  # The receiver's half of stopping everywhere: fired from on_wake_word_detected when "stop" - or
  # any wake word - cuts off an announcement this device did *not* send. It presses every other
  # FutureProofHomes device's Stop Announcement button, and the router among them fans the stop
  # out to its non-Satellite1 targets from its own button - see the button above for the whole
  # relay and why it cannot loop.
  #
  # The guards, each doing one job. tts_playing false means this is not our own response - the
  # router's case, where tts_remote_stop already knows the exact target list and a broadcast
  # would be a blunter copy of it. The http_announcement_source test is what separates routed
  # speech from a local chime or a ringing timer, neither of which plays anywhere else. It is
  # read before the local media_player.stop lands - the caller orders it so - because stopping
  # the pipeline is exactly what makes that state unreadable afterwards.
  - id: tts_stop_broadcast
    mode: single
    then:
      - if:
          condition:
            and:
              - api.connected:
              - lambda: 'return !id(tts_playing);'
              - lambda: |-
                  return id(http_announcement_source).get_state() ==
                         media_source::MediaSourceState::PLAYING;
          then:
            - lambda: 'ESP_LOGI("tts_routing", "heard stop during a routed announcement; stopping it everywhere");'
            - homeassistant.action:
                action: button.press
                data_template:
                  entity_id: >-
                    ${tts_stop_all_jinja}
                variables:
                  mac: !lambda 'return esphome::get_mac_address_pretty();'
                on_error:
                  - script.execute:
                      id: tts_remote_stop_error
                      reason: !lambda 'return error;'

  # A stop that did not land, reported to the log and nowhere else. Not tts_call_error: that clears
  # tts_announce_pending and flashes the ring red, both of which belong to the announcement call.
  # The local stop has already happened by the time this fires, so the failure's whole cost is the
  # remote tail playing out - worth a warning, not an alarm.
  - id: tts_remote_stop_error
    parameters:
      reason: string
    then:
      - lambda: |-
          id(ha_action_replies_seen) = true;
          ESP_LOGW("tts_routing", "remote stop call failed: %s", reason.c_str());

voice_assistant:
  on_start:
    # Whichever trigger sends this turn's response, it has not been sent yet.
    - lambda: 'id(tts_remote_sent) = false;'
    # One question now, not two: anything chosen means routing. The old pairing could be half-set -
    # switch on with an empty list - which is the warning that used to live in the else branch and can
    # no longer happen, because the switch is a projection of the selection rather than a separate
    # value that could disagree with it.
    - if:
        condition:
          lambda: 'return ${tts_routing_active};'
        then:
          # Whether this device also plays the response is the app's "Local Speaker" row, and
          # audio_gain_reconcile's to carry out.
          - script.execute: tts_targets_parse
          - lambda: |-
              id(tts_routing_to_remote) = true;
              ESP_LOGI("tts_routing", "Remote TTS routing enabled, chosen: %s",
                       id(tts_targets_literal).c_str());
        else:
          - lambda: 'id(tts_routing_to_remote) = false;'

  # The response, handed on as soon as Home Assistant has a URL for it. `x` is empty on every
  # intent-progress event but the first.
  #
  # A trigger of this package's own rather than an addition to voice_assistant.yaml: ESPHome
  # concatenates lists when merging packages and satellite1.base.yaml lists `va` first, so that
  # file's handler has already set tts_playing and reconciled the gain by the time this runs.
  on_intent_progress:
    - if:
        condition:
          lambda: 'return !x.empty() && id(tts_routing_to_remote);'
        then:
          - script.execute:
              id: tts_route_response
              url: !lambda 'return x;'

  # The sign-in prompt, armed for routing. assist_satellite.start_conversation delivers its TTS
  # through the announce path, which fires on_tts_start with the message text and on_tts_end with
  # the tts_proxy URL (VoiceAssistant::on_announce) and never passes through on_start - so the
  # per-turn arming on_start does for conversations happens here for the prompt, and the on_tts_end
  # handler below then routes the URL through the same tts_route_response as any response: same
  # targets, same codec swap, same stop fan-out, same watchdog. The microphone only opens on this
  # device, so the multi-STT hazard of routing start_conversation itself never arises.
  #
  # Scoped to the sign-in window deliberately. Routing EVERY announce - a tts.speak aimed at this
  # device, a doorbell clip - is a one-condition change, left unmade because an announcement
  # someone aimed at only this device silently following the routing selection would surprise its
  # sender. The mirrored prompt does mean a lagging target can still be reciting the code when
  # start_conversation opens the mic here - the device could approve its own sign-in off that
  # audio - and the remote sync guard in on_end below is what closes it, by holding the mic shut
  # past the skew.
  on_tts_start:
    - if:
        condition:
          lambda: 'return id(web_ui_app)->login_voice_pending() && ${tts_routing_active};'
        then:
          - lambda: |-
              id(tts_remote_sent) = false;
              id(tts_routing_to_remote) = true;
              ESP_LOGI("tts_routing", "sign-in prompt will be routed to the remote targets");

  # The fallback for an engine that does not stream, and the ONLY path for an announce - the
  # sign-in prompt above arrives here with its URL, having no intent-progress event to ride.
  # tts_route_response's own guard makes this a no-op after a streaming response, so the line below
  # is only printed when generation really was waited out, or when the URL came off the announce
  # path.
  on_tts_end:
    - if:
        condition:
          lambda: 'return id(tts_routing_to_remote) && !id(tts_remote_sent);'
        then:
          - lambda: |-
              ESP_LOGD("tts_routing",
                       "no streaming TTS URL for this response; routing it at tts-end");
          - script.execute:
              id: tts_route_response
              url: !lambda 'return x;'

  on_end:
    - if:
        condition:
          lambda: 'return id(tts_routing_to_remote);'
        then:
          # The remote sync guard: 0.5s of embedded silence enqueued once per step of the Remote
          # Sync Guard select (see the select above for the whole design), so the announcement
          # pipeline stays in ANNOUNCING past the targets' playback skew. The continued-conversation
          # listen, the sign-in mic, the un-duck and the stop windows all gate on that state, so
          # this one enqueue delays them together - the lead device can no longer hear its own
          # response, or its own sign-in code, off a lagging target.
          #
          # At on_end rather than alongside the routing call, because ordering is the point: by
          # on_end the component has queued the response URL for sure, so the silence lands BEHIND
          # it in the playlist (ENQUEUE_URI appends; PLAY_URI would have cleared it). Gated on
          # tts_remote_sent so a response that stayed local pays no extra latency. If a very short
          # response has already drained, the silence plays as its own 0.5-2s announcement of
          # nothing - harmless, and the guard still covers the remote tail.
          - if:
              condition:
                lambda: 'return id(tts_remote_sent);'
              then:
                - lambda: |-
                    // The options are ordered 0.5s/1s/1.5s/2s, so index+1 is the number of 0.5s
                    // clips - which is why reordering them in the select would change durations.
                    int n = 2;  // 1s, the default and the fallback for an unrestored select
                    const auto guard_idx = id(remote_sync_guard).active_index();
                    if (guard_idx.has_value()) {
                      n = static_cast<int>(guard_idx.value()) + 1;
                    }
                    for (int i = 0; i < n; i++) {
                      id(external_media_player)
                          ->make_call()
                          .set_command(media_player::MEDIA_PLAYER_COMMAND_ENQUEUE)
                          .set_media_url("audio-file://routing_guard_silence_sound")
                          .set_announcement(true)
                          .perform();
                    }
                    ESP_LOGD("tts_routing", "remote sync guard: %d x 0.5s silence enqueued", n);
          # The local pipeline still received the TTS URL, so wait for it to drain before clearing
          # the flag or the tail of the response leaks out at chime level.
          - wait_until:
              condition:
                not:
                  media_player.is_announcing: external_media_player
              timeout: 30s
          - lambda: 'id(tts_routing_to_remote) = false;'
          - script.execute: audio_gain_reconcile

  on_error:
    - if:
        condition:
          lambda: 'return id(tts_routing_to_remote);'
        then:
          - wait_until:
              condition:
                not:
                  media_player.is_announcing: external_media_player
              timeout: 30s
          - lambda: 'ESP_LOGI("tts_routing", "Error during remote routing, restoring local playback");'
          - lambda: 'id(tts_routing_to_remote) = false;'
          - script.execute: audio_gain_reconcile
