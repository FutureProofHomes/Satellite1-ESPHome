sensor:
  - platform: aht10
    id: "aht20_temp_hum_sensor"
    address: 0x38
    variant: AHT20
    temperature:
      name: Temperature
      id: temperature_sensor
      filters:
        - offset: ${temp_offset}
        - lambda: "return x + id(temp_offset_ui).state;"
    humidity:
      name: Humidity
      id: humidity_sensor
      filters:
        - offset: ${humidity_offset}
        - lambda: "return x + id(humidity_offset_ui).state;"
  - platform: wifi_signal
    name: "Wi-Fi Signal Strength"
    entity_category: "diagnostic"
    update_interval: 60s

  - platform: ltr_als_ps
    address: 0x29
    type: ALS
    update_interval: 60s

    ambient_light:
      name: "Ambient Light"
      id: ambient_light_sensor
      filters:
        - multiply: !lambda |-
            const float factor = id(ambient_light_calibration_factor).state;
            return std::isfinite(factor) && factor >= 0.1f && factor <= 5.0f ? factor : 1.0f;

number:
  - platform: template
    name: "Ambient Light Calibration Factor"
    id: ambient_light_calibration_factor
    min_value: 0.1
    max_value: 5
    step: 0.01
    initial_value: 1
    restore_value: true
    optimistic: true
    update_interval: never
    mode: box
    entity_category: config
    icon: "mdi:brightness-6"
    on_value:
      - lambda: |-
          if (!id(ambient_light_sensor).has_state() || !std::isfinite(x) || x < 0.1f || x > 5.0f)
            return;
          const float raw = id(ambient_light_sensor).get_raw_state();
          if (std::isfinite(raw))
            id(ambient_light_sensor).publish_state(raw);

  # Dynamically adjust the temperature and humidity offset.  Credit goes to Lewis over @ EverythingSmartHome.  I admire your work and hope to meet someday.  Beers on me.
  - platform: template
    name: "Offset Temperature"
    id: temp_offset_ui
    device_class: temperature
    min_value: -20
    max_value: 20
    step: 0.1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0
    icon: "mdi:thermometer"
    entity_category: config
    on_value:
      - lambda: 'id(aht20_temp_hum_sensor).update();'

  - platform: template
    name: "Offset Humidity"
    id: humidity_offset_ui
    unit_of_measurement: "%"
    min_value: -50
    max_value: 50
    step: 0.1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0
    icon: "mdi:water-percent"
    entity_category: config
    on_value:
      - lambda: 'id(aht20_temp_hum_sensor).update();'
