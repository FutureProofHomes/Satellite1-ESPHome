globals:
  # The last ambient light reading as the hardware gave it, before the offset filter. Not restored: it is
  # replaced by the first measurement after boot, and a value from the previous power-on describes a room
  # that may have had its lights turned off since.
  - id: lux_raw
    type: float
    restore_value: no
    initial_value: '0'

sensor:
  - platform: aht10
    id: "aht20_temp_hum_sensor"
    address: 0x38
    variant: AHT20
    temperature:
      name: Temperature
      id: temperature_sensor
      filters:
        - offset: ${temp_offset}
        - lambda: "return x + id(temp_offset_ui).state;"
    humidity:
      name: Humidity
      id: humidity_sensor
      filters:
        - offset: ${humidity_offset}
        - lambda: "return x + id(humidity_offset_ui).state;"

  - platform: ltr_als_ps
    id: ltr_als_sensor
    address: 0x29
    type: ALS
    update_interval: 60s

    # Expanded from the short `ambient_light: "Ambient Light"` form so the sensor can carry an id and
    # a filter, matching how temperature and humidity are calibrated. The short form gives neither.
    ambient_light:
      name: "Ambient Light"
      id: ambient_light_sensor
      # The reading before the offset is applied, kept so that changing the offset can republish without
      # waiting for the hardware. See lux_offset_ui's on_value for why that is necessary here and not for
      # the AHT20.
      on_raw_value:
        - lambda: 'id(lux_raw) = x;'
      filters:
        - lambda: "return x + id(lux_offset_ui).state;"

number:
  # Dynamically adjust the temperature and humidity offset.  Credit goes to Lewis over @ EverythingSmartHome.  I admire your work and hope to meet someday.  Beers on me.
  - platform: template
    name: "Offset Temperature"
    id: temp_offset_ui
    device_class: temperature
    min_value: -20
    max_value: 20
    step: 0.1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0
    icon: "mdi:thermometer"
    entity_category: config
    on_value:
      - lambda: 'id(aht20_temp_hum_sensor).update();'

  # Same shape as the two above. The range is wide because the LTR-329 reads through whatever the
  # device is sitting behind, and a tinted enclosure or a recessed shelf can halve the figure.
  - platform: template
    name: "Offset Ambient Light"
    id: lux_offset_ui
    unit_of_measurement: "lx"
    min_value: -500
    max_value: 500
    step: 1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0
    icon: "mdi:brightness-6"
    entity_category: config
    # Republishes the last hardware reading through the offset filter, rather than asking the LTR-329 to
    # take a new one.
    #
    # This used to be `id(ltr_als_sensor).update();`, copied from the two AHT20 offsets above, where it
    # works. It does not work here. ltr_als_ps::update() only starts a measurement when the component is
    # in State::IDLE, and the collection that follows is a multi-pass state machine that reconfigures gain
    # and integration time, waits, and can return to IDLE without publishing anything. Measured on
    # hardware through the web app: after nudging the offset, the temperature figure moved in 238ms and
    # the corrected ambient light figure had still not moved after 12 seconds - so with a 60s poll the
    # correction appeared to do nothing, and the calibration editor showed a raw reading of -2 lx for a
    # room reading 3 lx, because it derives the raw figure by subtracting the offset from a value that had
    # not caught up.
    #
    # publish_state re-runs the filter chain, so this costs no I2C traffic and lands within a frame. The
    # hardware reading itself has not changed - only the correction applied to it - so there is nothing to
    # re-measure. Guarded on has_state so a nudge before the first measurement cannot publish the initial 0.
    on_value:
      - if:
          condition:
            lambda: 'return id(ambient_light_sensor).has_state();'
          then:
            - lambda: 'id(ambient_light_sensor).publish_state(id(lux_raw));'

  - platform: template
    name: "Offset Humidity"
    id: humidity_offset_ui
    unit_of_measurement: "%"
    min_value: -50
    max_value: 50
    step: 0.1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0
    icon: "mdi:water-percent"
    entity_category: config
    on_value:
      - lambda: 'id(aht20_temp_hum_sensor).update();'

switch:
  # The web app's temperature unit preference, and nothing more: no logic hangs off it. The sensor
  # keeps publishing °C (so Home Assistant history and its own unit conversion are untouched) and
  # the offset above keeps storing °C; the app converts for display only. internal because it is a
  # display preference of the web UI, not a fact about the device - web_server's include_internal
  # still carries it to the app over /events and the REST endpoints.
  - platform: template
    id: temp_display_fahrenheit
    name: "Temperature in Fahrenheit"
    icon: "mdi:temperature-fahrenheit"
    internal: true
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
