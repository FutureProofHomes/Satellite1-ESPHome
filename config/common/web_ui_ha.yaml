####################################################################################################
# The on-device web app's Home Assistant data layer.
#
# The browser holds no Home Assistant token, and asking a customer for one so they can open their own
# device's settings page is not a setup step this product can have. So the device asks, over the
# native API connection it already has, caches the answer, and serves it to the browser from
# GET /api/sat1/ha.
#
# The sync carries everything Home Assistant knows and this device does not: which areas exist, which
# media players are in them, and which other FutureProofHomes devices are on the network. It is
# rendered on Home Assistant's side, exactly as tts_targets_ma_check already does, so only the result
# crosses the wire rather than the whole entity registry.
#
# It arrives a page at a time, because the native API's receive buffer grows to the largest message
# it has ever handled and is released only once, early in the connection - so one reply carrying the
# whole document would pin that much internal heap for the rest of the boot. The pages concatenate
# back into the same document, so nothing above the transport is aware of them.
#
# See docs/TTS-Routing.md for the routing this shares its area walk with.
####################################################################################################

substitutions:
  # How many bytes of the document one page carries.
  #
  # The API's receive buffer grows to the largest message it has ever handled and is released
  # exactly once, at the end of the initial entity sync (api_connection.cpp:416). Nothing releases
  # it again, so what the device pays for the rest of the boot is set by the largest single reply
  # rather than by the size of the sync.
  #
  # 1024 balances that against round trips, which are not free on the fallback rung: rung 2 takes
  # about three seconds a call.
  #
  # Not a hard bound. The slicing below never splits a piece, because half a JSON object is not
  # something the other end can be handed, so one area with many players can exceed it.
  web_ui_ha_page_bytes: "1024"

  # The bound on the page loop. The loop ends when Home Assistant says so, so this only catches a
  # template that never does - well past what the size cap can produce, and inside the two digits
  # `pg` is written into.
  web_ui_ha_max_pages: "40"

  # The whole payload, rendered by Home Assistant, one page at a time.
  #
  # Expects `mac`, which cannot be sent as a variable. Home Assistant renders a response_template
  # with only {"response": ...} in scope, while data_template gets the call's variables through
  # render_complex - so web_ui_ha_template below prepends its own `{% set mac = ... %}` and the
  # shared walk reads it exactly as ducking's callers do. `pg`, the page being asked for, arrives
  # the same way and for the same reason.
  #
  # It is also rendered with strict=True, which makes any undefined reference a hard error with no
  # partial result. That is stricter than Developer Tools: a template that renders there can still
  # fail here.
  #
  # Music Assistant entities are rejected for the reason tts_targets_ma_check explains - a speaker
  # with two entity ids would otherwise appear twice - and this device's own media player is rejected
  # through `mine` from the shared walk. Measured against a 22-area, 104-media-player installation:
  # 82 bytes per player, 90 per device, 4.3KB in total.
  #
  # One call returns {"m": 1, "d": "<fragment>"}: `m` is whether another page follows, `d` is this
  # page's slice. Concatenating every `d` in order reproduces the document below byte for byte, so
  # the component appends the slices into PSRAM and the frontend parses what it always did.
  #
  # The fragment is wrapped in an object rather than returned bare because Home Assistant puts every
  # rendered template through literal_eval. An object parses and comes back as structure; a bare
  # fragment raises and comes back as raw rendered text, carrying every newline and indent the loops
  # below emit between their tags.
  #
  # Shape of the reassembled document:
  #   {"area": "Media Room", "aid": "media_room",
  #    "areas": [{"i": "kitchen", "n": "Kitchen", "p": [["media_player.kitchen", "Kitchen Sonos"]]}],
  #    "loose": [["media_player.all_sonos", "All Sonos"]],
  #    "dev": [["Satellite1", "Ceiling Mount", "Media Room", "3c:0f:02:c5:ac:00", "dev (ESP...)"]],
  #    "asst": {"o": ["Home Assistant Cloud", "OllamaBradStudio"],
  #             "s": [["select.sat1_wake_word", "Hey Jarvis", "select.sat1_assistant", "preferred"],
  #                   ["select.sat1_wake_word_2", "no_wake_word", "select.sat1_assistant_2", "preferred"]]}}
  #
  # `i` is the area id and `aid` this device's own. Both are ids rather than names because the stored
  # selection references areas, `area_entities()` takes an id directly, and an id survives a rename -
  # a selection keyed on the display name would silently empty itself when someone renamed a room.
  #
  # `loose` is every media player Home Assistant has put in no area at all, which is most of them: 40
  # of 104 on the test installation, against 37 that are in one. That is why the app has a "No Area
  # Assigned" group rather than treating unassigned players as an edge case. Music Assistant entities
  # are rejected from it for the same reason they are rejected from the areas - many of the duplicates
  # are unassigned, and a group made mostly of speakers that clip on Sonos is a trap, not a feature.
  #
  # The name is `name_by_user or name`, which is the order Home Assistant itself displays them in.
  # Renaming a device writes name_by_user and leaves name as the integration registered it, so sending
  # `name` alone meant every screen on the device showed a name its owner had already replaced - and it
  # is the only route that name has. The firmware cannot work it out: App.get_friendly_name() is the
  # `friendly_name` substitution with the MAC suffix that name_add_mac_suffix appends, so it is
  # "Satellite1 c5ac00" however the device is labelled in the app people actually use.
  #
  # `dev` carries every FutureProofHomes device with its model, not only Satellite1s. The model is
  # what separates products - a Nexus registers through a config entry with no MAC connection, no
  # software version and one entity - so filtering on the absence of a MAC would key on an accident
  # of how an integration registers itself. The frontend renders the models it understands, which
  # makes recognising another product later a change there rather than here, and means an unknown
  # one appears in the payload the day Home Assistant learns about it.
  #
  # `asst` is which assistant answers which wake word, and it is the one part of this payload that
  # describes settings Home Assistant owns rather than facts it happens to know.
  #
  # Home Assistant's ESPHome integration creates two slots for every voice satellite, each pairing a
  # wake word with a pipeline: the four selects shown on the device page as "Wake word"/"Assistant" and
  # "Wake word 2"/"Assistant 2". When a wake word fires, the device reports its name, and
  # homeassistant/components/esphome/assist_satellite.py walks the wake word selects comparing each
  # one's state to that name; the first match decides which slot's pipeline runs, and no match falls
  # back to slot one. So the mapping lives entirely on Home Assistant's side, which is why it has to
  # come through here rather than out of /api/sat1/state - these four are not this device's entities.
  #
  # They are found by the option values `preferred` and `no_wake_word` rather than by name. Those are
  # internal constants that Home Assistant only translates for display, so the match survives a rename
  # and a non-English installation, where matching on "Assistant" would survive neither. The slots are
  # then told apart by the `_2` suffix on the entity id, and if that does not produce exactly one of
  # each the whole block is sent empty and the app hides the control - a wrong pairing would quietly
  # route a wake word to the other slot's assistant, so guessing is worse than not offering it.
  #
  # The suffix is the weakest link here and it was worth testing rather than assuming. On this
  # installation one device's slots do not even share a prefix - `satellite1_d095b4_wake_word` beside
  # `satellite1_master_bedroom_wake_word_2`, because the second slot's entities were created after the
  # device was renamed - so anything keyed on a common prefix would already be broken.
  #
  # `o` is the customer's own pipelines, which Home Assistant rebuilds from its pipeline store whenever
  # one is added or renamed, so nothing here is fixed at build time. `preferred` is dropped from the
  # list because the frontend has to give it a label of its own anyway.
  #
  # Sorted here rather than in the app, so it costs no bundle bytes, and re-sorted rather than kept in the
  # order it arrives in. Home Assistant builds its own list with Python's `sorted`, which is case
  # sensitive and so puts every capitalised name ahead of every lowercase one - a pipeline called `ollama`
  # would sit after `OllamaBradStudio` rather than beside it. Jinja's `sort` is case-insensitive by
  # default, so `case_sensitive=false` is there to say which behaviour is being relied on, not to switch
  # it on. Both were rendered against a live installation to confirm the filter is one the template
  # sandbox permits - `list.append` is not, so being accepted is not a given.
  #
  # Requires Home Assistant 2025.10, which is where the second slot arrived, and that is not a new
  # floor: this whole file already needs 2025.12 for action replies.
  #
  # Areas with no eligible player are dropped rather than sent empty: the frontend has nothing to
  # offer for them, and on the installation above that is 11 areas of the 22.
  #
  # The size cap is enforced here, on Home Assistant's side. Paging removed the reason it originally
  # existed - an incoming message larger than MAX_MESSAGE_SIZE (32768 on ESP32, api_frame_helper.h:31)
  # does not arrive truncated but drops the connection, and since this syncs on reconnect an
  # installation too large to fit would loop - and no page comes near that now.
  #
  # It is kept as a bound on the reassembled document. An installation needing more than 24000 bytes
  # of areas has an area picker that has stopped being usable as one, and a truncated list is better
  # than a list nobody can scroll. Areas are added while they fit and `t` says some were left out;
  # the frontend falls back to the manual entity id field, which it needs regardless - only 38 of
  # 104 media players on the test installation were in any area at all.
  #
  # Every value is a string or an int, never a boolean or none, and that is deliberate: Home Assistant
  # puts the rendered result through literal_eval, which parses a JSON object into a dict but raises
  # on `true` or `null` and hands back the raw string instead. Keeping booleans out makes which of
  # those two happens a property of this template rather than of a customer's speaker names. The
  # device accepts either form anyway.
  web_ui_ha_jinja: >-
    ${self_area_jinja}
    {% set ma = integration_entities('music_assistant') %}
    {% set out = namespace(areas=[], rows=[], dev=[], loose=[]) %}
    {% for a in areas() %}
      {% set out.rows = [] %}
      {% for e in area_entities(a) | select('match', 'media_player\.')
                  | reject('in', ma) | reject('in', mine) %}
        {% set out.rows = out.rows + [[e, state_attr(e, 'friendly_name') or e]] %}
      {% endfor %}
      {% if out.rows | count > 0 %}
        {% set out.areas = out.areas + [{'i': a, 'n': area_name(a), 'p': out.rows}] %}
      {% endif %}
    {% endfor %}
    {% set assigned = areas() | map('area_entities') | sum(start=[])
                      | select('match', 'media_player\.') | list %}
    {% for e in states.media_player | map(attribute='entity_id')
                | reject('in', ma) | reject('in', mine) | reject('in', assigned) %}
      {% set out.loose = out.loose + [[e, state_attr(e, 'friendly_name') or e]] %}
    {% endfor %}
    {% for a in areas() %}
      {% for d in area_devices(a) %}
        {% if device_attr(d, 'manufacturer') == 'FutureProofHomes' %}
          {% set macs = device_attr(d, 'connections')
                        | selectattr(0, 'eq', 'mac') | map(attribute=1) | list %}
          {% set out.dev = out.dev + [[device_attr(d, 'model'),
                                       device_attr(d, 'name_by_user') or device_attr(d, 'name'),
                                       area_name(a),
                                       macs | first if macs else '',
                                       device_attr(d, 'sw_version') or '']] %}
        {% endif %}
      {% endfor %}
    {% endfor %}
    {% set sl = namespace(p=[], w=[]) %}
    {% for e in mine | select('match', 'select\.') %}
      {% set o = state_attr(e, 'options') or [] %}
      {% if 'preferred' in o %}{% set sl.p = sl.p + [e] %}{% endif %}
      {% if 'no_wake_word' in o %}{% set sl.w = sl.w + [e] %}{% endif %}
    {% endfor %}
    {% set p1 = sl.p | reject('search', '_2$') | list %}
    {% set p2 = sl.p | select('search', '_2$') | list %}
    {% set w1 = sl.w | reject('search', '_2$') | list %}
    {% set w2 = sl.w | select('search', '_2$') | list %}
    {% set asst = {'o': (state_attr(p1 | first, 'options') or []) | reject('eq', 'preferred')
                        | sort(case_sensitive=false) | list,
                   's': [[w1 | first, states(w1 | first), p1 | first, states(p1 | first)],
                         [w2 | first, states(w2 | first), p2 | first, states(p2 | first)]]}
                  if p1 | count == 1 and p2 | count == 1 and w1 | count == 1 and w2 | count == 1
                  else {} %}
    {% set lim = 24000 - (out.dev | to_json | length) - (out.loose | to_json | length)
                       - (asst | to_json | length) %}
    {% set keep = namespace(a=[], n=0) %}
    {% for ar in out.areas %}
      {% set sz = (ar | to_json | length) + 1 %}
      {% if keep.n + sz < lim %}
        {% set keep.a = keep.a + [ar] %}
        {% set keep.n = keep.n + sz %}
      {% endif %}
    {% endfor %}
    {% set P = namespace(l=['{"area":' ~ ((area_name(ns.area) if ns.area else '') | to_json)
                            ~ ',"aid":' ~ ((ns.area if ns.area else '') | to_json)
                            ~ ',"t":' ~ (1 if keep.a | count < out.areas | count else 0)
                            ~ ',"asst":' ~ (asst | to_json)
                            ~ ',"dev":[']) %}
    {% for d in out.dev %}
      {% set P.l = P.l + [(d | to_json) ~ ('' if loop.last else ',')] %}
    {% endfor %}
    {% set P.l = P.l + ['],"loose":['] %}
    {% for e in out.loose %}
      {% set P.l = P.l + [(e | to_json) ~ ('' if loop.last else ',')] %}
    {% endfor %}
    {% set P.l = P.l + ['],"areas":['] %}
    {% for a in keep.a %}
      {% set P.l = P.l + [(a | to_json) ~ ('' if loop.last else ',')] %}
    {% endfor %}
    {% set P.l = P.l + [']}'] %}
    {% set S = namespace(n=0, at=0, buf='', last=0) %}
    {% for p in P.l %}
      {% if S.n > 0 and S.n + (p | length) > ${web_ui_ha_page_bytes} %}
        {% set S.at = S.at + 1 %}
        {% set S.n = 0 %}
      {% endif %}
      {% set S.n = S.n + (p | length) %}
      {% if S.at == pg %}{% set S.buf = S.buf ~ p %}{% endif %}
      {% set S.last = S.at %}
    {% endfor %}
    {{ {'m': 1 if pg < S.last else 0, 'd': S.buf} | to_json }}

  # Nothing has ever recorded statistics under this id, so asking for them reads nothing and returns
  # an empty result rather than an error. Named here because rung 1's comment explains it.
  web_ui_ha_probe_statistic: "sensor.satellite1_web_ui_probe"

  # Appends one page to the component's PSRAM staging buffer and records whether another follows.
  # Each rung runs this and then commits or asks for the next page, which is the only part that
  # differs between them.
  #
  # Never a std::string, and that is the whole point of the shape. This used to be
  # `serializeJson(captured, payload)` into one, which put several kilobytes on the internal heap - and
  # with exceptions compiled out, an allocation that cannot find a contiguous block that size does not
  # fail, it calls abort(). On a wifi build, where the WiFi driver's buffers leave the largest free block
  # around 7KB, that rebooted the device on the sync itself. Staging into PSRAM means the bytes go from
  # the API message straight to the buffer that serves them and nowhere else.
  #
  # `d` is read as a const char * rather than copied out, so the only move the bytes make is the
  # memcpy into PSRAM. ArduinoJson has already unescaped it in place inside the API message.
  #
  # The test is on `d` being a string, not on the reply being an object: the trigger is
  # Trigger<JsonObjectConst, ...> (homeassistant_service.h:158), and is<JsonObject>() is never true
  # for a const variant.
  #
  # A page that does not arrive abandons the sync rather than committing - a document missing a
  # slice out of its middle is not JSON - and the previous payload keeps being served with its real
  # age.
  #
  # This lives in YAML rather than in the component because ArduinoJson is only compiled in when
  # something in the config uses capture_response - which is exactly this file - and a lambda is part
  # of main.cpp, where it always is.
  web_ui_ha_page_lambda: >-
    auto captured = response["response"];
    auto ha_frag = captured["d"];
    const char *ha_src = ha_frag.is<const char *>() ? ha_frag.as<const char *>() : nullptr;
    if (ha_src == nullptr) {
      ESP_LOGW("web_ui", "Home Assistant page %d carried no fragment; sync abandoned",
               id(web_ui_ha_page));
      id(web_ui_ha_more) = -1;
    } else {
      size_t ha_len = strlen(ha_src);
      char *ha_dst = id(web_ui_app)->stage_ha_page(ha_len);
      if (ha_dst == nullptr) {
        id(web_ui_ha_more) = -1;
      } else {
        memcpy(ha_dst, ha_src, ha_len);
        id(web_ui_ha_more) = captured["m"] | 0;
      }
    }

  # Writes the page number the next call asks for into the template, in place.
  #
  # Two characters overwritten rather than the string rebuilt: the Jinja is about 1.7KB, and
  # assembling a fresh copy per page would put that on the internal heap once per call - the cost
  # paging exists to avoid. The offset is found once at boot.
  #
  # Padded with a space, never a zero. Jinja's integer lexer follows Python 3, where a leading zero
  # on a decimal literal is a syntax error, and the template renders with strict=True - so `01`
  # through `09` would fail the action call outright.
  web_ui_ha_seek_lambda: >-
    std::string &tpl = id(web_ui_ha_template);
    int at = id(web_ui_ha_page_offset);
    if (at > 0 && static_cast<size_t>(at) + 1 < tpl.size()) {
      int tens = (id(web_ui_ha_page) / 10) % 10;
      tpl[at] = tens == 0 ? ' ' : static_cast<char>('0' + tens);
      tpl[at + 1] = static_cast<char>('0' + id(web_ui_ha_page) % 10);
    }

globals:
  # The response template, with this device's MAC already in the text, built once.
  #
  # A global rather than a literal in each rung's lambda: the Jinja above is about 1.6KB, and pasting
  # it into every rung would put that many copies in flash to no purpose. Built at boot because the
  # MAC is the only runtime part and it never changes.
  - id: web_ui_ha_template
    type: std::string
    restore_value: no

  # Which rung of the ladder produced the payload, for the Diagnostics page and the frontend's
  # explanation of its own degraded state.
  #
  #   0  nothing asked yet                2  conversation.process
  #   1  recorder.get_statistics         -1  both refused
  #
  # A sync always restarts at rung 1 rather than resuming from this value. A refused rung costs one
  # round trip to something that does nothing and syncs are rare, so this records what worked rather
  # than deciding what to try.
  #
  # Within a sync it does steer: once a rung has answered page 0, every page after it goes to the
  # same rung rather than re-probing from the top.
  - id: web_ui_ha_rung
    type: int
    restore_value: no
    initial_value: '0'

  # Which page the next call asks for, and where in web_ui_ha_template its two digits live.
  - id: web_ui_ha_page
    type: int
    restore_value: no
    initial_value: '0'

  - id: web_ui_ha_page_offset
    type: int
    restore_value: no
    initial_value: '-1'

  # What the last page said about the one after it: 1 another follows, 0 that was the last, -1 the
  # sync failed partway and what is staged must not be committed.
  - id: web_ui_ha_more
    type: int
    restore_value: no
    initial_value: '0'

esphome:
  on_boot:
    # 600 matches the block in common/web_ui.yaml: after globals restore, before anything serves a
    # request. Nothing reads this until Home Assistant connects, so the priority only has to be
    # early enough to be certain.
    - priority: 600.0
      then:
        - lambda: |-
            // A raw string literal, so the Jinja can carry quotes, backslashes and newlines without
            // any of it being escaped for C++. The delimiter has to be something the template cannot
            // contain, which )JINJA" is.
            id(web_ui_ha_template) = std::string("{% set mac = '") +
                                     esphome::get_mac_address_pretty() +
                                     R"JINJA(' %}{% set pg =  0 %}${web_ui_ha_jinja})JINJA";

            // Where those two digits ended up, so each call can overwrite them without rebuilding
            // the string. Searched rather than computed, because the MAC ahead of them is not a
            // fixed width.
            static const char *const PG = "{% set pg = ";
            size_t at = id(web_ui_ha_template).find(PG);
            id(web_ui_ha_page_offset) = at == std::string::npos ? -1 : static_cast<int>(at + strlen(PG));

script:
  # Home Assistant registers its action-call handler partway through its own connect sequence, and a
  # call that arrives first is dropped silently - the same 5s of slack ha_action_probe takes, for the
  # same reason. restart, so a reconnect during the wait does not leave two syncs queued.
  - id: web_ui_ha_sync_on_connect
    mode: restart
    then:
      - delay: 5s
      - script.execute: web_ui_ha_sync

  # Asks Home Assistant for the area, player and device tree.
  #
  # capture_response needs an action that supports responses, or return_response=True raises before
  # anything is rendered. The action's own answer is then thrown away, because Home Assistant renders
  # response_template itself with the full template environment in scope. So the action is a key
  # rather than a query, and the only things that matter about it are that it cannot fail and that it
  # changes nothing.
  - id: web_ui_ha_sync
    mode: restart
    then:
      - if:
          condition:
            and:
              - api.connected:
              # Before 2025.12 Home Assistant answers no action call at all, so every rung would be a
              # silence and the ladder would conclude something false. common/tts_routing.yaml sets
              # this from the version on the connect handshake.
              - lambda: 'return id(ha_supports_action_replies);'
          then:
            - lambda: |-
                id(web_ui_app)->begin_ha_pages();
                id(web_ui_ha_page) = 0;
                id(web_ui_ha_more) = 0;
            - script.execute: web_ui_ha_rung_1

  # Runs after every page: asks for the next one on whichever rung answered, or finishes.
  #
  # The loop is driven by a flag the other end sets, so ${web_ui_ha_max_pages} bounds a template
  # that never says `m: 0`. Reaching it means something is wrong rather than something is large, so
  # it commits nothing - a document missing its tail is not JSON.
  #
  # Only `m: 0` commits. -1 is the page lambda reporting a page it could not stage, which leaves the
  # previous payload in place with its real age.
  - id: web_ui_ha_advance
    then:
      - if:
          condition:
            lambda: 'return id(web_ui_ha_more) == 1 && id(web_ui_ha_page) + 1 < ${web_ui_ha_max_pages};'
          then:
            - lambda: 'id(web_ui_ha_page) = id(web_ui_ha_page) + 1;'
            - if:
                condition:
                  lambda: 'return id(web_ui_ha_rung) == 1;'
                then:
                  - script.execute: web_ui_ha_rung_1
                else:
                  - script.execute: web_ui_ha_rung_2
          else:
            - lambda: |-
                if (id(web_ui_ha_more) == 1) {
                  ESP_LOGW("web_ui", "Home Assistant payload had not ended after %d pages; discarded",
                           ${web_ui_ha_max_pages});
                } else if (id(web_ui_ha_more) == 0) {
                  id(web_ui_app)->commit_ha_pages(id(web_ui_ha_rung));
                }

  # Rung 1. get_statistics is domain-level, so it needs no entity to exist, and aimed at a statistic
  # id nothing has ever written it returns {"statistics": {}} with changed_states empty - it succeeds
  # immediately having read nothing and changed nothing. Verified against a live installation, as was
  # the coercion below: ESPHome sends every value as a string, and Home Assistant's schema puts
  # statistic_ids and types through ensure_list, so neither needs to be sent as a list.
  #
  # recorder is not itself in default_config, but history and logbook both depend on it, so removing
  # it takes deliberate effort. That is why it is rung 1 and not the floor.
  - id: web_ui_ha_rung_1
    then:
      - lambda: |-
          ${web_ui_ha_seek_lambda}
      - homeassistant.action:
          action: recorder.get_statistics
          capture_response: true
          data:
            start_time: "1970-01-01 00:00:00"
            statistic_ids: "${web_ui_ha_probe_statistic}"
            period: day
            types: mean
          response_template: !lambda 'return id(web_ui_ha_template);'
          on_success:
            - lambda: |-
                ${web_ui_ha_page_lambda}
                // Recorded per page rather than once at the end, because web_ui_ha_advance reads
                // it to decide which rung to ask for the next page on.
                id(web_ui_ha_rung) = 1;
            - script.execute: web_ui_ha_advance
          on_error:
            - script.execute: web_ui_ha_rung_2

  # Rung 2, and the floor. assist_pipeline declares a hard dependency on conversation, so a Home
  # Assistant that can run a Satellite1 at all has conversation.process, and it is domain-level -
  # registered with async_register, so it needs no entity either. There is no rung 3: an entity-backed
  # action needs a matching entity to exist, which is a weaker guarantee than this one, so anything
  # behind this would be unreachable.
  #
  # Aimed at the built-in agent with text that matches no intent, so nothing runs and no cloud or LLM
  # agent is billed. Unlike rung 1 this is not free - it updates the agent entity's state and writes a
  # context, and took about three seconds on a live installation - which is the whole reason it is
  # second.
  - id: web_ui_ha_rung_2
    then:
      - lambda: |-
          ${web_ui_ha_seek_lambda}
      - homeassistant.action:
          action: conversation.process
          capture_response: true
          data:
            agent_id: conversation.home_assistant
            text: "satellite1 web ui data layer probe"
          response_template: !lambda 'return id(web_ui_ha_template);'
          on_success:
            - lambda: |-
                ${web_ui_ha_page_lambda}
                id(web_ui_ha_rung) = 2;
            - script.execute: web_ui_ha_advance
          on_error:
            - lambda: |-
                id(web_ui_ha_rung) = -1;
                id(web_ui_app)->set_ha_failed();
                // Split across messages: the logger's tx_buffer_size defaults to 512 bytes.
                ESP_LOGW("web_ui", "Home Assistant answered no action call, so the web app cannot "
                                   "show areas, media players or other Satellite1s.");
                ESP_LOGW("web_ui", "  Everything the device knows unaided still works. Check that "
                                   "'Allow the device to perform Home Assistant actions' is ticked "
                                   "in this device's ESPHome settings.");

# Merged into the block in common/web_ui.yaml, which declares the component itself. Split across the
# two files on purpose: that one is the web server and this one is the Home Assistant half, and the
# script this points at is here.
#
# The endpoint behind this only records that someone asked; the component's loop() fires the trigger,
# so the action call starts from the main loop. Several tabs opening at once collapse into one sync.
satellite1_web_ui:
  on_ha_refresh:
    - script.execute: web_ui_ha_sync

  # Moves one of the four selects behind `asst`, so the app can say which assistant answers which wake
  # word. The component queues the request and fires this from the main loop, one write per iteration.
  #
  # No capture_response, so no on_success and no on_error: select.select_option returns nothing worth
  # having, and asking for a response would make this need the 2025.12 reply support that the read path
  # needs. The consequence is that the device never learns whether Home Assistant accepted the option,
  # which is why the app resyncs afterwards and shows what came back rather than what it asked for.
  #
  # entity_id goes through data_template rather than data because only variables can carry a runtime
  # value, and `{{ ent }}` renders a variable rather than interpolating text - so a pipeline name with a
  # brace or a quote in it is a name, not a template.
  #
  # Deliberately no `delay:` and no condition on ha_actions_allowed. A delay would stall the queue, and
  # an untickable "allow actions" box already breaks the read path far more visibly than this.
  on_ha_select:
    - homeassistant.action:
        action: select.select_option
        data_template:
          entity_id: "{{ ent }}"
          option: "{{ opt }}"
        variables:
          ent: !lambda 'return entity;'
          opt: !lambda 'return option;'

# The client test is the one ha_action_probe explains: only Home Assistant can answer an action call.
#
# The wait is inside web_ui_ha_sync_on_connect rather than here, and that is not a style choice. Every
# package's on_client_connected is concatenated into one automation that runs its actions in sequence,
# so a `delay:` at this level holds up every package merged after it - tts_routing waits 5s, which
# already puts area_ducking's recover at about 10s. Handing off to a script returns immediately, so
# this one waits 5s from the connection rather than 5s from whenever the queue reaches it, and it stops
# adding to the pile for whatever is merged next.
api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return client_info.rfind("Home Assistant", 0) == 0;'
        then:
          - script.execute: web_ui_ha_sync_on_connect
