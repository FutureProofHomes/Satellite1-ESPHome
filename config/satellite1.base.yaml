substitutions:
  # Change to any preferred name
  friendly_name: "Satellite1"

  # Change to calibrate your temperature/humidity sensor readings
  temp_offset: "-3"
  humidity_offset: "5"

  # Recommend leaving the following unchanged
  node_name: satellite1
  company_name: FutureProofHomes
  project_name: Satellite1
  component_name: Core

  esp32_fw_version: dev
  xmos_fw_version: "v1.1.0-alpha.0"
  # Production configurations enable this; dashboard builds only wait for a responding XMOS.
  xmos_auto_flash_on_boot: "false"

globals:
  # Global initialisation variable. Initialized to true and set to false once everything is connected. Only used to have a smooth "plugging" experience
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  # Global variable storing if user action causes warning
  - id: warning
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking the XMOS flasher status.
  - id: xmos_flashing_state
    type: int
    restore_value: no
    initial_value: '0'
  # Audio outputs remain muted until the XMOS is responding after any required flash attempt.
  - id: xmos_audio_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: xmos_audio_shutdown_complete
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: audio_output_speaker_requested
    type: bool
    restore_value: no
    initial_value: 'false'

esphome:
  name: ${node_name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  min_version: 2026.7.0

  project:
    name: ${company_name}.${project_name}
    version: ${esp32_fw_version}

  on_boot:
    - priority: -100
      then:
        - logger.log: "${company_name} ${project_name} ${component_name} running ESP firmware: ${esp32_fw_version} and XMOS firmware: ${xmos_fw_version}"
        # Run the script to refresh the LED status
        - script.execute: control_leds
        - delay: 1s

        - lambda: id(audio_output_speaker_requested) = id(dac_proxy).active_dac == 0;
        - script.execute: refresh_audio_output

        # If after 10 minutes, the device is still initializing (It did not yet connect to Home Assistant), turn off the init_in_progress variable and run the script to refresh the LED status
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: control_leds

ota:
  - platform: esphome
    id: ota_esphome

dashboard_import:
  package_import_url: github://futureproofhomes/satellite1-esphome/config/satellite1.dashboard.yaml@staging
  import_full_config: true

packages:
  core_board: !include common/core_board.yaml
  wifi: !include common/wifi_improv.yaml
  sensors: !include common/hat_sensors.yaml
  buttons: !include common/buttons.yaml
  ha: !include common/home_assistant.yaml
  spk: !include common/speaker.yaml
  mp: !include common/media_player.yaml
  va: !include common/voice_assistant.yaml
  timer: !include common/timer.yaml
  led_ring: !include common/led_ring.yaml
  mmwave: !include common/mmwave.yaml
  sendspin: !include common/sendspin.yaml

  ## OPTIONAL COMPONENTS
  # debug: !include common/debug.yaml
  # developer: !include common/developer.yaml

fusb302b:
  id: pd_fusb302b
  irq_pin: GPIO1
  request_voltage: 20
  on_power_ready:
    then:
      - logger.log:
          format: "PD contract got accepted: %s"
          args: ['id(pd_fusb302b).contract.c_str()']
      - text_sensor.template.publish:
          id: pd_state_text
          state: !lambda 'return id(pd_fusb302b).contract;'
      - script.execute: refresh_audio_output

  on_disconnect:
    then:
      - script.execute: refresh_audio_output

http_request:

safe_mode:

status_led:
  pin:
    number: GPIO45
    ignore_strapping_warning: true

script:
  - id: prepare_xmos_direct_flash
    mode: single
    then:
      - lambda: id(xmos_audio_ready) = false;
      - lambda: id(xmos_audio_shutdown_complete) = false;
      # Cancel pending starts before stopping the components that own I2S channels.
      - script.stop: start_micro_wake_word
      - script.stop: activate_audio_output
      - script.stop: refresh_audio_output
      - script.stop: tas2780_ensure_active
      - script.stop: activate_stop_word_once
      - script.stop: activate_stop_word_if_tts_step_is_long
      - micro_wake_word.stop:
      - voice_assistant.stop:
      - media_player.stop:
          id: external_media_player
          announcement: true
      - media_player.stop:
          id: external_media_player
          announcement: false
      # Mute line-out without changing the user's persisted mute preference.
      - lambda: id(line_out_dac).set_mute_on();
      - tas2780.deactivate:
      - lambda: id(tas2780_active) = false;
      - speaker.stop: i2s_audio_speaker
      - wait_until:
          condition:
            lambda: |-
              return !id(mww).is_running() && !id(va).is_running() &&
                     id(sat1_mics).is_stopped() &&
                     id(i2s_audio_speaker).is_stopped() &&
                     !id(speaker_dac).is_active() && !id(speaker_dac).is_activation_pending() &&
                     id(line_out_dac).is_muted() &&
                     id(external_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING &&
                     id(external_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
          timeout: 5s
      - if:
          condition:
            lambda: |-
              return !id(mww).is_running() && !id(va).is_running() &&
                     id(sat1_mics).is_stopped() &&
                     id(i2s_audio_speaker).is_stopped() &&
                     !id(speaker_dac).is_active() && !id(speaker_dac).is_activation_pending() &&
                     id(line_out_dac).is_muted() &&
                     id(external_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING &&
                     id(external_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
          then:
            - lambda: id(xmos_audio_shutdown_complete) = true;
            - logger.log: "Audio shutdown complete; XMOS is ready for direct flashing"
          else:
            - logger.log: "XMOS direct-flash preparation timed out; audio remains disabled"

satellite1:
  id: satellite1_id
  spi_id: spi_0
  cs_pin: GPIO10
  data_rate: 8000000
  spi_mode: MODE3
  xmos_rst_pin: GPIO4

  on_xmos_no_response:
    then:
      - lambda: id(xmos_audio_ready) = false;
      - text_sensor.template.publish:
          id: xmos_firmware_version_text
          state: !lambda 'return id(satellite1_id).status_string();'
      - if:
          condition:
            - lambda: return ${xmos_auto_flash_on_boot};
            - lambda: return id(init_in_progress);
            - lambda: return id(xflash).has_image_embedded();
            - lambda: return !id(xflash).flash_attempted_this_boot();
            - lambda: return !id(xflash).boot_flash_pending();
          then:
            - memory_flasher.write_embedded_image:

  on_xmos_connected:
    then:
      - lambda: id(xmos_audio_ready) = false;
      - text_sensor.template.publish:
          id: xmos_firmware_version_text
          state: !lambda 'return id(satellite1_id).status_string();'
      - delay: 1s
      - script.execute: control_leds
      - if:
          condition:
            - lambda: return ${xmos_auto_flash_on_boot};
            - lambda: return id(init_in_progress);
            - lambda: return id(xflash).has_image_embedded();
            - lambda: return !id(xflash).match_embedded(id(satellite1_id).xmos_fw_version);
            - lambda: return !id(xflash).flash_attempted_this_boot();
            - lambda: return !id(xflash).boot_flash_pending();
          then:
            - memory_flasher.write_embedded_image:
          else:
            - if:
                condition:
                  lambda: |-
                    return id(satellite1_id).is_xmos_connected() && !id(xflash).in_progress() &&
                           !id(xflash).boot_flash_pending();
                then:
                  - lambda: id(xmos_audio_ready) = true;
                  - script.execute: refresh_audio_output
                  - script.execute: start_micro_wake_word

memory_flasher:
  - platform: satellite1
    id: xflash
    embed_flash_image:
      image_version: ${xmos_fw_version}
      image_file: https://github.com/FutureProofHomes/Satellite1-XMOS/releases/download/${xmos_fw_version}/satellite1_xmos.factory.bin
      md5_file: https://github.com/FutureProofHomes/Satellite1-XMOS/releases/download/${xmos_fw_version}/satellite1_xmos.factory.md5

    on_flashing_start:
      then:
        - lambda: id(xmos_audio_ready) = false;
        - text_sensor.template.publish:
            id: xmos_firmware_version_text
            state: "Flashing... (0%)"
        - lambda: id(xmos_flashing_state) = 1;
        - script.execute: control_leds

    on_progress_update:
      then:
        - text_sensor.template.publish:
            id: xmos_firmware_version_text
            state: !lambda |-
              return std::string("Flashing... (") + std::to_string(id(xflash).flashing_progress) + "%)";
        - lambda: id(global_led_animation_index) = id(xflash).flashing_progress * 24 / 100;
        - script.execute: control_leds

    on_flashing_success:
      then:
        - logger.log: "success called"
        - text_sensor.template.publish:
            id: xmos_firmware_version_text
            state: "Flashing... (100%)"
        - lambda: id(xmos_flashing_state) = 2;
        - script.execute: control_leds
        - lambda: id(xmos_flashing_state) = 0;

    on_flashing_failed:
      then:
        - logger.log: "failed called"
        - text_sensor.template.publish:
            id: xmos_firmware_version_text
            state: "Flashing failed"
        - lambda: id(xmos_flashing_state) = 3;
        - script.execute: control_leds
        - lambda: id(xmos_flashing_state) = 0;
        - if:
            condition:
              lambda: return id(factory_reset_requested);
            then:
              - button.press: factory_reset_button

    on_erasing_done:
      then:
        - if:
            condition:
              lambda: return id(factory_reset_requested);
            then:
              - button.press: factory_reset_button
