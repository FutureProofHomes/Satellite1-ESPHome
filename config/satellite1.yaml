substitutions:
  company_name: FutureProofHomes
  project_name: Satellite1

  # set this version by GHA at build time
  esp32_fw_version: dev
  xmos_auto_flash_on_boot: "true"
  wifi_config: !include
    file: common/wifi_improv.yaml
  ethernet_config: !include
    file: common/ethernet.yaml

  # select network [wifi|ethernet]
  network: wifi

globals:
  - id: network_setup_completed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: improv_ble_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'

packages:
  # This is an inline package to prefix the on_client_connected with the wait_until action
  # It must appear before the actual package so it becomes the original config and the
  # on_client_connected list from the package config is appended onto this one.
  va_connected_wait_for_ble_and_flasher:
    voice_assistant:
      on_client_connected:
        - wait_until:
            lambda: |-
              return id(network_setup_completed);
        - wait_until:
            not: memory_flasher.in_progress
        - delay: 2s

  base: !include satellite1.base.yaml
  wifi: ${ wifi_config if network == "wifi" or network == "unified" else {} }
  ethernet: ${ ethernet_config if network == "ethernet" or network == "unified" else {} }

esphome:
  project:
    name: ${company_name}.${project_name}
    version: ${esp32_fw_version}
http_request:

ota:
  - platform: http_request
    id: ota_http_request

update:
  - platform: http_request
    name: None
    id: update_http_request
    source: https://raw.githubusercontent.com/FutureProofHomes/Documentation/refs/heads/main/manifest.json

# The two entities the web app can only be told about from here. HTTP-request OTA and its beta
# channel switch are local-build-only - the ESPHome Device Builder path includes satellite1.base.yaml
# and dashboard_build.yaml, neither of which declares them - so common/web_ui.yaml cannot name them
# without failing every dashboard build. Package merging unions these keys into the block there.
satellite1_web_ui:
  entities:
    switches:
      beta_firmware: beta_firmware
    updates:
      firmware: update_http_request

switch:
  - platform: template
    id: beta_firmware
    name: Beta firmware
    icon: "mdi:test-tube"
    entity_category: diagnostic
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - logger.log: "OTA updates set to use Beta firmware"
      - lambda: id(update_http_request).set_source_url("https://raw.githubusercontent.com/FutureProofHomes/Documentation/refs/heads/main/manifest-beta.json");
      - component.update: update_http_request
    on_turn_off:
      - logger.log: "OTA updates set to use Production firmware"
      - lambda: id(update_http_request).set_source_url("https://raw.githubusercontent.com/FutureProofHomes/Documentation/refs/heads/main/manifest.json");
      - component.update: update_http_request

external_components:
  - source:
      type: local
      path: ../esphome/components
    components:
      - crash_report
      - extram_bss
      - fusb302b
      - i2s_audio
      - memory_flasher
      - micro_decoder_override
      # Vendored from the pinned ESPHome release for one ~10-line addition (the high-water
      # register the wake word margin telemetry rides). See its FPH_VENDOR.md for the re-sync
      # procedure and the upstream exit plan.
      - micro_wake_word
      - mww_runtime_loader
      - satellite1
      - satellite1_radar
      - satellite1_web_ui
      - ethernet
      - tas2780

# Swaps the registry micro-decoder for our patched fork (the submodule at
# esphome/idf_components/micro-decoder), closing the lwIP semaphore use-after-free that
# panicked devices when a streaming TTS response was stopped mid-download. The component's
# docstring carries the full mechanism; the compile-time "IDF component version conflict"
# warning it triggers is expected. Remove together with the submodule once the upstream fix
# ships in a stock ESPHome release.
micro_decoder_override:

logger:
  deassert_rts_dtr: true
  hardware_uart: USB_SERIAL_JTAG
  level: debug
  logs:
    ltr_als_ps: WARN
