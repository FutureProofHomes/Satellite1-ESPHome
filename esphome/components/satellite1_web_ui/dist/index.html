ume set for the answer and put back afterwards.",remote_wake_chime:"Plays the wake chime on the target speakers too, so you can hear that the device heard you from the room the sound is going to.",area_ducking:"Turns other speakers down while the assistant listens and answers, then puts them back where they were. Tick a room to cover every player in it.",duck_volume:"The level they drop to. Players already quieter than this are left alone, so a whole-house group does not get turned up.",temp:"Reads high by design - the sensor sits inside a warm enclosure, next to the board. Calibrate against a thermometer in the same room.",humidity:"Measured at the board, so it drifts with the enclosure temperature. Calibrate against a hygrometer in the same room.",lux:"Ambient light at the front face. Useful for dimming the LED ring automatically from Home Assistant, or for a light-level trigger.",presence:"Sensed by radar, not the microphones. It works through the case and notices people even when they sit completely still.",radar_range:"How far the radar looks. Anything farther away is ignored - use it to stop the radar seeing into the hallway or the next room. All the way left is the full 6m reach.",radar_stability:"How sure the radar must be before it changes its answer. Higher is steadier but slower to notice changes. Lower is quicker but can flicker.",radar_timeout:"How long the room still counts as occupied after the radar loses sight of everyone. Set it high enough that the lights stay on while you sit still.",radar_multi:"Track up to three people at once instead of only the clearest one.",radar_bt:"The radar's own Bluetooth, used only by the manufacturer's phone app. Leave it off unless you use that app.",radar_zones:"Draw shapes on the map above. Each zone reports on its own whether someone is inside it. The ignore area is the opposite: anything in it never counts - useful for fans and curtains.",radar_resolution:"How finely distance is split into the nine rows above: 0.75m steps reach the whole room, 0.2m steps reach less far but with more detail up close. Changing it changes what each row means, so re-check your levels after.",gate_move:"How much movement the radar sees at each distance, live. Drag a notch to set the trigger level for that distance - anything above it counts as a person moving.",gate_still:"How much tiny motion - like breathing - the radar sees at each distance, live. Drag a notch to set the trigger level - anything above it counts as a person holding still.",gate_max_move:"The farthest distance that counts for movement. Rows past it dim in the chart above and are ignored.",gate_max_still:"The farthest distance that counts for stillness. Rows past it dim in the chart above and are ignored.",zone_excl:"Makes this shape an ignore area instead of a zone: anything inside it never counts as presence. Useful for fans, curtains and pets. There is one ignore area - saving a new one replaces it.",calibrate:"Adjust until the reading matches a trusted instrument in the same room. The correction is stored on the device and survives restarts.",mute:"Cuts the microphones in hardware, not software - wake word detection stops with them. The mute button on the device does the same thing.",wake_sound:"Plays a short chime on the speaker the moment the wake word is detected.",wake_words:"Which wake words this device answers, and which assistant answers each one. Off stops it responding to that word and frees processing for the ones you use. The assistants are your Home Assistant voice pipelines - Preferred follows whichever is marked preferred there. Home Assistant stores the pairing, so it must be reachable to change one.",stop_word:'While an answer is playing - this device\u2019s own, or one another Satellite1 routed here - saying "stop" cuts it off everywhere it is playing. A ringing timer can always be silenced this way, whichever way this is set.',wake_sensitivity:"How readily the wake word fires. Raise it if the device misses you from across the room; lower it if the television sets it off.",voice_override:"How loud this device speaks when the assistant replies, separate from media volume. Zero follows the media volume instead. Speakers you route answers to have their own level - Remote TTS volume, on the Audio page.",speaker_channel:"Which side of a stereo source reaches the single speaker. Mono sums both, which is usually what you want.",led_ring:"The ring the assistant animates. Colour and brightness set here are the resting state - the device still overrides both while it is listening, thinking or reporting an error.",timers:'Timers set by voice, held on the device - they keep counting and still ring if Home Assistant goes away. Voice is also how they are managed: name one when you set it ("set a pizza timer for ten minutes"), pause or cancel it the same way.',media:"What this device is playing, from either source: a group stream, or media sent to it by Home Assistant. Track skipping works only on group streams. This slider is the media volume; the assistant's voice has its own level, in the Assistant card below.",heap:"Internal RAM still available. Audio buffers and the network stack allocate from it, and it runs out long before PSRAM does.",psram:"External RAM, used for the large buffers. Free and total cover the region the firmware can allocate from, which is smaller than the chip installed.",loop:"The longest single pass through the main loop since the last reading. Tens of milliseconds is normal; sustained hundreds means something is blocking, and audio will stutter first.",esp_temp:"The ESP32 chip's own temperature, not the room's. It reads well above ambient inside the sealed case, so warm is normal; sustained readings above 80 \xB0C are worth investigating. The room's temperature is on the home page.",reset:"Why the device last restarted. 'USB peripheral' means it was flashed. 'Power glitch' or 'Brownout' points at the power supply rather than at the firmware.",xmos:"The audio chip. It owns the microphones, the speaker, the mute button and the LED ring, and runs its own firmware separate from the ESP32's.",xmos_flash:"Rewrites the audio chip's firmware from the image embedded in this build. The device is deaf and mute until it finishes, which takes about a minute. Do not cut power.",maintenance:"Ways to restart or reset this device. None of them are part of everyday use. Restart is always safe - your settings survive it. Factory reset is the only row here that erases anything.",safe_mode:"Restarts with everything but Wi-Fi and the updater switched off. Use it when the device is crash-looping too fast to accept an update.",factory_reset:"Erases every setting stored on the ESP32, including the Wi-Fi credentials, and restarts. You will have to set the device up again from scratch. The audio chip's firmware is not touched.",beta:"Offers pre-release firmware to the updater. Useful for testing a fix; not what you want on a device you rely on.",log:"The device's own log, live. This is the first place to look when something misbehaves, and the most useful thing to attach to a support request."},k={ha_connected:"Connected to Home Assistant",ha_disconnected:"Not connected to Home Assistant",ha_disconnected_detail:"Everything on this page still works - it talks to the device directly. Media and anything that needs your smart home will be unavailable until the connection returns.",stream_lost:"Lost the connection to the device. Retrying.",no_devices:"Only this device. Other Satellite1s appear here once Home Assistant lists them.",peer_up:"Available, according to Home Assistant",peer_down:"Unavailable, according to Home Assistant",write_failed:"A change didn't reach the device, so it hasn't been applied.",write_failed_go:"Tap for the device log.",nothing_said:"Nothing said yet. What you say and what it replies will appear here.",media_idle:"Nothing playing. Group streams and media sent from Home Assistant show up here.",zi_first:"Tap the map to place the first corner.",zi_more:"Keep tapping. A zone needs at least 3 corners.",zi_adjust:"Drag a corner to reshape. Drag the middle to move the shape. Tap a corner to select it.",zi_selected:"Corner selected. Tap Remove corner below to delete it.",zones_set:"Tap a zone button, or a shape on the map, to edit it.",zones_none:"No zones yet. The whole field of view counts as presence.",gate_thresholds_help:"Each row is a band of distance. The bar shows what the radar sees there right now; drag the notch to set where it triggers. Dimmed rows are out of range and ignored. Changes save automatically.",no_sensor_lead:"A presence sensor was not detected in your Sat1. Please ",no_sensor_docs:"read our docs to learn more",no_sensor_docs_url:"https://docs.futureproofhomes.net/satellite1-presence-sensors/#connecting-mmwave-sensors",no_sensor_mid:", you can purchase a presence sensor ",no_sensor_buy:"here",no_sensor_buy_url:"https://futureproofhomes.net/products/ld2450-mmwave-human-presence-sensor",media_src_group:"group stream",media_src_local:"this speaker",no_wake_words:"No wake words are on, so the device will not respond to being spoken to. The mute button and Home Assistant still work.",pipeline_off:"Off",pipeline_preferred:"Preferred",assistant_needs_ha:"Home Assistant keeps which assistant answers each wake word, so that cannot be set from here until it is reachable. Turning a wake word on and off is the device's own setting and still works.",assistant_slots_full:"Home Assistant can pair only two wake words with an assistant of their own. The rest are answered by the first one's assistant, which is what their dropdowns show.",confirm:"Confirm",confirm_title:"Are you sure?",cancel:"Cancel",ha_pending:"Asking Home Assistant which speakers you have.",ha_never:"Not connected to Home Assistant, so the device does not know which areas or speakers exist. The controls below still hold their current settings and will apply as soon as the connection returns.",ha_refused:"Home Assistant did not answer. Either it is older than 2025.12, or this device is not allowed to perform actions: Settings \u203A Devices & services \u203A ESPHome \u203A this device \u203A CONFIGURE, then tick \u201CAllow the device to perform Home Assistant actions\u201D.",ha_no_area:"This device is not in a Home Assistant area, so \u201CRoute TTS To All Area Players\u201D and \u201CDuck All Area Players\u201D have no room to refer to. You can still pick any room below. Assign it to an area in Home Assistant and refresh.",ha_no_players:"Home Assistant has no media players at all, so there is nothing to choose between.",cap_no_media:"Can't play media",cap_no_volume:"No volume control",ha_truncated:"Too many areas to send in one go, so the list is cut short. Players already chosen are still used, whether or not they appear below.",sel_failed:"That change was not saved. The device rejected it, or the connection dropped.",theme_to_dark:"Switch to dark theme",theme_to_light:"Switch to light theme"},X={update:{t:"Install this update?",b:"The device downloads the new firmware and restarts itself when it finishes. The assistant and any audio stop until it is back - a few minutes. Keep it powered the whole time."},xmos_restart:{t:"Restart the audio chip?",b:"The microphones and speaker drop out for a few seconds while it comes back. Nothing is erased and no settings change."},xmos_flash:{t:"Reflash the audio chip?",b:"Rewrites the audio chip's firmware from a known-good copy. It takes about a minute, the microphones and speaker are silent throughout, and the device must stay powered."},restart:{t:"Restart this device?",b:"It reboots right away and is back in under a minute. All of your settings survive a restart."},safe_mode:{t:"Restart into safe mode?",b:"The device comes back with only its network connection and update tools running - no assistant, no audio - so a bad update can be recovered. Restarting again returns it to normal."},factory_reset:{t:"Erase everything?",b:"Every set
