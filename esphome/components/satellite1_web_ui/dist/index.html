 the one visible "Satellite1 Fleet" entry, the rest sit hidden behind it, and the device switcher reaches them all from inside the panel. Anyone who can open the panel reaches the devices' sign-in pages through it; the YAML limits the panel to admin users - remove the require_admin line to show it to everyone.`,remote_routing:"Plays this device's audio on other speakers as well as this one: the assistant's spoken answers, sign-in prompts, ringing timers, and the wake chime if you turn that on below. Tick a room to include every player in it, or open the room and pick players. Local Speaker is this device's own speaker - untick it and answers play only where you have chosen.",remote_tts_volume:"How loud answers are on the remote speakers. This device's own level is the one on the Local Speaker row. Sonos reads the level from the announcement itself; another Satellite1 has its voice volume set for the answer, and anything else its media volume, both put back afterwards.",remote_wake_chime:"Plays the wake chime on the target speakers too, so you can hear that the device heard you from the room the sound is going to. On Sonos and similar speakers the chime can land up to a second late - their clip playback has a fixed startup cost the device cannot remove.",remote_timer_ring:'Rings a finished timer on the target speakers too, until the alarm is stopped. Saying "stop" at any speaker silences it everywhere.',remote_sync_guard:"How long this device keeps its microphone closed after a routed answer, so it cannot hear its own answer from a speaker running slightly behind and mistake it for you. It only engages when the assistant is about to listen again - a continued conversation or voice sign-in; one-shot answers skip it entirely.",area_ducking:"Turns other speakers down while the assistant listens and answers, then puts them back where they were. Tick a room to cover every player in it.",duck_volume:"The level they drop to. Players already quieter than this are left alone, so a whole-house group does not get turned up.",temp:"Reads high by design - the sensor sits inside a warm enclosure, next to the board. Calibrate against a thermometer in the same room.",temp_unit:"Shows temperatures in Fahrenheit throughout this app. The device stores and reports Celsius either way, so Home Assistant and the saved calibration are unaffected.",humidity:"Measured at the board, so it drifts with the enclosure temperature. Calibrate against a hygrometer in the same room.",lux:"Ambient light at the front face. Useful for dimming the LED ring automatically from Home Assistant, or for a light-level trigger.",presence:"Sensed by radar, not the microphones. It works through the case and notices people even when they sit completely still.",distance_unit:"Shows every distance on this page in feet. The radar keeps measuring and storing centimetres either way, so Home Assistant and the saved settings are unaffected.",radar_range:"How far the radar looks. Anything farther away is ignored - use it to stop the radar seeing into the hallway or the next room. All the way left is the full 6m reach.",radar_stability:"How sure the radar must be before it changes its answer. Higher is steadier but slower to notice changes. Lower is quicker but can flicker.",radar_timeout:"How long the room still counts as occupied after the radar loses sight of everyone. Set it high enough that the lights stay on while you sit still.",radar_multi:"Track up to three people at once instead of only the clearest one.",radar_bt:"The radar's own Bluetooth, used only by the manufacturer's phone app. Leave it off unless you use that app.",radar_zones:"Draw shapes on the map above. Each zone reports on its own whether someone is inside it. The ignore area is the opposite: anything in it never counts - useful for fans and curtains.",radar_resolution:"How finely distance is split into the nine rows above: 0.75m steps reach the whole room, 0.2m steps reach less far but with more detail up close. Changing it changes what each row means, so re-check your levels after.",gate_move:"How much movement the radar sees at each distance, live. Drag a notch to set the trigger level for that distance - anything above it counts as a person moving.",gate_still:"How much tiny motion - like breathing - the radar sees at each distance, live. Drag a notch to set the trigger level - anything above it counts as a person holding still.",gate_max_move:"The farthest distance that counts for movement. Rows past it dim in the chart above and are ignored.",gate_max_still:"The farthest distance that counts for stillness. Rows past it dim in the chart above and are ignored.",zone_excl:"Makes this shape an ignore area instead of a zone: anything inside it never counts as presence. Useful for fans, curtains and pets. There is one ignore area - saving a new one replaces it.",calibrate:"Adjust until the reading matches a trusted instrument in the same room. The correction is stored on the device and survives restarts.",mute:"Cuts the microphones in hardware, not software - wake word detection stops with them. The mute button on the device does the same thing.",wake_sound:"Plays a short chime on the speaker the moment the wake word is detected.",wake_words:'This device listens for up to two wake words at once - one row each below - plus the "Stop" word that interrupts answers and alarms. Words beyond the built-in ones download from their source when you choose them, and fetch again at every restart. A tuned word wears its graph: everything left of the handle is ignored, every dot right of it is a real firing from the last 24 hours, fading as it ages. Tap the handle to retune, tap a dot for its story, tap the chevron on a word to change or remove it.',voice_pipeline:"Voice pipelines decide who answers this wake word: which speech-to-text, which conversation agent, and which voice replies. They are built in Home Assistant under Settings, then Voice assistants - this list is whatever yours offers, and Preferred follows the one marked preferred there.",living_graph:"A confidence scale from 0 to 100%. Everything left of the handle sits under the frost - the device ignores it. Everything right of it is live: solid dots are real firings at the confidence they scored, fading over 24 hours; hollow marks almost fired. Drag the handle to move the line; if dots you don't recognize sit just past it, drag past them.",wake_sources:"The wake word list is fetched live from these places - nothing is copied to our servers. Anyone can publish a wake word model, and quality varies: the included words are hand-tuned, community ones may fire too eagerly or miss you. Adding a source here only grows the list; a word starts being used when you pick it above.",stop_word:'While an answer is playing - this device\u2019s own, or one another Satellite1 routed here - saying "stop" cuts it off everywhere it is playing. A ringing timer can always be silenced this way, whichever way this is set.',voice_override:"How loud this device speaks when the assistant replies, separate from media volume. Zero follows the media volume instead. Speakers you route answers to have their own level - Remote Speaker Volume, below.",finished_speaking:"How long the assistant waits after you stop talking before it answers. Aggressive answers fastest; Relaxed tolerates longer mid-sentence pauses. Each wake word has its own setting. Home Assistant keeps only one, so just before the assistant listens, the device copies the wake word's choice onto it - which is why Finished speaking detection on Home Assistant's device page changes as different wake words are used. A change made there only lasts until a wake word sets it again. The action button uses the Primary wake word's setting.",speaker_channel:"Which side of a stereo source reaches the single speaker. Mono sums both, which is usually what you want.",speaker_amp:"The chip that drives the built-in speaker. What you hear is three levels multiplied together: the power gain mode the amplifier picks from your USB-C supply, the digital volume the firmware computes from your sliders, and the analog gain set below.",amp_mode:"Picked automatically from the measured power supply - it is a reading, not a setting. High gain: a 9 V or higher USB-PD supply is connected and the speaker can reach full loudness. Low gain: the device is on a plain 5 V supply, so maximum loudness is reduced. Off: the amplifier is shut down, normally because line out is selected. A supply that negotiates 9 V or more (the USB-C Power Supply row in the Device card above) is what unlocks High gain.",amp_dvc:"How far open the amplifier's digital volume control is right now - the level the firmware computes from the volume buttons, Voice Volume Override and ducking. Shown so you can see what the amplifier is actually being fed; it is managed automatically and has no handle here. To change it, use the volume controls.",amp_gain:"The amplifier's output-level ceiling, applied on top of the digital volume. The notch on the track is the factory default, 15 dBV - the right everyday setting, and the slider snaps to it. Higher values make everything louder but can add distortion, and on a 5 V supply the chip's built-in limiter will duck the sound to protect the power rail. Lower it if the speaker distorts at high volume.",led_ring:"The ring the assistant animates. Colour and brightness set here are the resting state - the device still overrides both while it is listening, thinking or reporting an error.",timers:'Timers set by voice, held on the device - they keep counting and still ring if Home Assistant goes away. Voice is also how they are managed: name one when you set it ("set a pizza timer for ten minutes"), pause or cancel it the same way.',ma_connect:"Connecting this page straight to your Music Assistant server makes the controls instant and unlocks search. Find your server below, then create a long-lived token in Music Assistant under Settings, then your profile, and paste it here. Both are remembered by this browser and, behind your sign-in, on this device - so your other browsers and phones connect without re-entering them.",heap:"Internal RAM still available. Audio buffers and the network stack allocate from it, and it runs out long before PSRAM does.",psram:"External RAM, used for the large buffers. Free and total cover the region the firmware can allocate from, which is smaller than the chip installed.",loop:"The longest single pass through the main loop since the last reading. Tens of milliseconds is normal; sustained hundreds means something is blocking, and audio will stutter first.",esp_temp:"The ESP32 chip's own temperature, not the room's. It reads well above ambient inside the sealed case, so warm is normal; sustained readings above 80 \xB0C / 176 \xB0F are worth investigating. The room's temperature is on the home page.",reset:"Why the device last restarted. 'USB peripheral' means it was flashed. 'Power glitch' or 'Brownout' points at the power supply rather than at the firmware.",usb_power:"What the USB-C power supply agreed to deliver. Chargers that speak USB Power Delivery negotiate a voltage and the most current they will supply at it - the ~ marks that ceiling: the device draws only what it needs, usually far less. 5 V is a plain supply that negotiated nothing. 9 V or more is what lets the speaker amplifier run at High gain - the Speaker amplifier card just below.",xmos:"The audio chip. It owns the microphones, the speaker, the mute button and the LED ring, and runs its own firmware separate from the ESP32's.",xmos_flash:"Restarts the device, then rewrites the audio chip's firmware from the image embedded in this build. The device is deaf and mute until the flash finishes, which takes about a minute after the restart. Do not cut power.",xmos_install:"Developer builds only. Lists the audio chip firmware published on the Satellite1-XMOS GitHub releases, beside the built-in copy this firmware carries. Picking one installs it - the device itself doesn't restart - and it stays installed across restarts until you pick Built-in again.",xmos_refresh:"Checks the Satellite1-XMOS GitHub releases for new firmware now, pre-releases included, instead of waiting for the device's own hourly check. New versions appear in the list above.",radar_module:"The mmWave presence sensor fitted to this Satellite1, found automatically at startup. It runs its own firmware from the module's maker. Its live view and settings are on the Presence page.",radar_recovery:"The radar module's own recovery actions. Restart just power-cycles the module. Factory reset erases the settings stored on the module itself - detection range, gate thresholds, zones, everything tuned on the Presence page - and does not touch this device's settings.",maintenance:"Ways to restart or reset this device. None of them are part of everyday use. Restart is always safe - your settings survive it. Factory reset is the only row here that erases anything.",safe_mode:"Restarts with everything but Wi-Fi and the updater switched off. Use it when the device is crash-looping too fast to accept an update.",factory_reset:"Erases every setting stored on the ESP32, including the Wi-Fi credentials, and restarts. You will have to set the device up again from scratch. The audio chip's firmware is not touched.",beta:"Offers pre-release firmware to the updater. Useful for testing a fix; not what you want on a device you rely on.",log:"The device's own log: what it said recently, then live as it happens. This is the first place to look when something misbehaves, and the most useful thing to attach to a support request.",notif:"Toasts from the past 24 hours. The badge counts the ones that faded away before you could tap them; tapping a notification takes you to the same place the toast would have, and swiping it right (or tapping its \u2715) files it under Archive. Everything clears itself after a day.",crash:"What the device remembers about its own crashes: when each one happened, which task died and where, the last log lines before it went down, and a downloadable crash dump for the deepest look. Attach the dump and the log to a support request, or erase them once the cause is found. A crash that cuts power entirely leaves less detail than one the device rebooted itself from.",crash_log:"The last log lines the device wrote before it went down, recovered across the reboot. The most recent crash only - a newer crash replaces it.",crash_dump:"A complete snapshot of what every task was doing at the moment of the most recent crash, analyzed offline against this exact firmware build. It may contain fragments of anything the device held in memory, so share it like a log, not like a screenshot.",crash_erase:"Deletes the recorded crashes, the pre-crash log and the crash dump. The device keeps working either way; erase once a cause is found, so the next crash is unmistakably new."},u={login_tap:"Sign in with VoiceTap",login_mode_button:"Press the action button on top of your Satellite1 - the ring is breathing while it waits.",login_mode_button_hw:"Press the action button on top of your Satellite1 - the ring is breathing while it waits. (Voice sign-in is off while the hardware mute switch is on - slide it off and try again to sign in by voice.)",login_mode_code:"Press the action button, or say the code.",login_mode_seq:"Say the six wake words below, in order - or press the action button on top of your Satellite1.",login_mode_seq_hab:"Press the action button or say the wake words on your screen.",login_mode_button_hab:"Home Assistant isn't allowed to speak for this device yet, so sign in by pressing the action button on top of your Satellite1 - the ring is breathing while it waits.",login_seq_words:["Hey Jarvis","Okay Nabu","Stop"],login_seq_peers_hint:"If other Satellite1 devices are within earshot, mute them first so they don't answer the challenge.",login_cancel:"Cancel",login_busy:"Another sign-in is al
