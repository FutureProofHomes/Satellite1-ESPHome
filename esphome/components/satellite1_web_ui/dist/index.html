 with the enclosure temperature. Calibrate against a hygrometer in the same room.",lux:"Ambient light at the front face. Useful for dimming the LED ring automatically from Home Assistant, or for a light-level trigger.",presence:"From the mmWave radar, not the microphones. It sees through the enclosure and does not need line of sight, so it reports an empty room faster than a motion sensor would.",calibrate:"Enter what a trusted instrument in the same room reads. The difference is saved as an offset and survives a restart. It does not change the raw reading, only what the device reports.",mute:"Cuts the microphones in hardware, on the XMOS chip, not in software. Wake word detection stops with them. The mute button on the device does the same thing.",wake_sound:"Plays a short chime on the speaker the moment the wake word is detected.",wake_sensitivity:"How readily the wake word fires. Raise it if the device misses you from across the room; lower it if the television sets it off.",voice_override:"Speaker volume used for assistant replies only, independent of media volume. Set to zero to follow the media volume instead.",speaker_channel:"Which side of a stereo source reaches the single speaker. Mono sums both, which is usually what you want.",led_ring:"The ring the assistant animates. Colour and brightness set here are the resting state - the device still overrides both while it is listening, thinking or reporting an error.",timers:"Timers set by voice, held on the device. They keep counting and still ring if Home Assistant goes away.",heap:"Internal RAM still available. This is the number that matters: it is what audio buffers and the network stack allocate from, and it is far scarcer than PSRAM.",psram:"External RAM, used for the large buffers. Installed is the size of the chip; the free and total figures cover the region handed to the allocator, which is smaller because the cache and early allocations sit outside it.",loop:"Longest single pass through the main loop s
