ume set for the answer and put back afterwards.",remote_wake_chime:"Plays the wake chime on the target speakers too, so you can hear that the device heard you from the room the sound is going to.",area_ducking:"Turns other speakers down while the assistant listens and answers, then puts them back where they were. Tick a room to cover every player in it.",duck_volume:"The level they drop to. Players already quieter than this are left alone, so a whole-house group does not get turned up.",temp:"Reads high by design - the sensor sits inside a warm enclosure, next to the board. Calibrate against a thermometer in the same room.",humidity:"Measured at the board, so it drifts with the enclosure temperature. Calibrate against a hygrometer in the same room.",lux:"Ambient light at the front face. Useful for dimming the LED ring automatically from Home Assistant, or for a light-level trigger.",presence:"Sensed by radar, not the microphones. It works through the case and notices people even when they sit completely still.",radar_range:"How far the radar looks. Anything farther away is ignored - use it to stop the radar seeing into the hallway or the next room. All the way left is the full 6m reach.",radar_stability:"How sure the radar must be before it changes its answer. Higher is steadier but slower to notice changes. Lower is quicker but can flicker.",radar_timeout:"How long the room still counts as occupied after the radar loses sight of everyone. Set it high enough that the lights stay on while you sit still.",radar_multi:"Track up to three people at once instead of only the clearest one.",radar_bt:"The radar's own Bluetooth, used only by the manufacturer's phone app. Leave it off unless you use that app.",radar_zones:"Draw shapes on the map above. Each zone reports on its own whether someone is inside it. The ignore area is the opposite: anything in it never counts - useful for fans and curtains.",radar_resolution:"How finely distance is split into the nine rows above: 0.75m steps reach the whole room, 0.2m steps reach less far but with more detail up close. Changing it changes what each row means, so re-check your levels after.",gate_move:"How much movement the radar sees at each distance, live. Drag a notch to set the trigger level for that distance - anything above it counts as a person moving.",gate_still:"How much tiny motion - like breathing - the radar sees at each distance, live. Drag a notch to set the trigger level - anything above it counts as a person holding still.",gate_max_move:"The farthest distance that counts for movement. Rows past it dim in the chart above and are ignored.",gate_max_still:"The farthest distance that counts for stillness. Rows past it dim in the chart above and are ignored.",zone_excl:"Makes this shape an ignore area instead of a zone: anything inside it never counts as presence. Useful for fans, curtains and pets. There is one ignore area - saving a new one replaces it.",calibrate:"Adjust until the reading matches a trusted instrument in the same room. The correction is stored on the device and survives restarts.",mute:"Cuts the microphones in hardware, not software - wake word detection stops with them. The mute button on the device does the same thing.",wake_sound:"Plays a short chime on the speaker the moment the wake word is detected.",wake_words:"Which wake words this device answers, and which assistant answers each one. Off stops it responding to that word and frees processing for the ones you use. The assistants are your Home Assistant voice pipelines - Preferred follows whichever is marked preferred there. Home Assistant stores the pairing, so it must be reachable to change one.",stop_word:'While an answer is playing - this device\u2019s own, or one another Satellite1 routed here - saying "stop" cuts it off everywhere it is playing. A ringing timer can always be silenced this way, whichever way this is set.',wake_sensitivity:"How readily the wake word fires. Raise it if the device misses n the firmware can allocate from, which is smaller than the chip installed.",loop:"The longest single pass through the main loop since the last reading. Tens of milliseconds is normal; sustained hundreds means something is blocking, and audio will stutter first.",esp_temp:"The ESP32 chip's own temperature, not the room's. It reads well above ambient inside the sealed case, so warm is normal; sustained readings above 80 \xB0C are worth investigating. The room's temperature is on the home page.",reset:"Why the device last restarted. 'USB peripheral' means it was flashed. 'Power glitch' or 'Brownout' points at the power supply rather than at the firmware.",xmos:"The audio chip. It owns the microphones, the speaker, the mute button and the LED ring, and runs its own firmware separate from the ESP32's.",xmos_flash:"Rewrites the audio chip's firmware from the image embedded in this build. The device is deaf and mute until it finishes, which takes about a minute. Do not cut power.",maintenance:"Ways to restart or reset this device. None of them are part of everyday use. Restart is always safe - your settings survive it. Factory reset is the only row here that erases anything.",safe_mode:"Restarts with everything but Wi-Fi and the updater switched off. Use it when the device is crash-looping too fast to accept an update.",factory_reset:"Erases every setting stored on the ESP32, including the Wi-Fi credentials, and restarts. You will have to set the device up again from scratch. The audio chip's firmware is not touched.",beta:"Offers pre-release firmware to the updater. Useful for testing a fix; not what you want on a device you rely on.",log:"The device's own log, live. This is the first place to look when something misbehaves, and the most useful thing to attach to a support request."},b={ha_connected:"Connected to Home Assistant",ha_disconnected:"Not connected to Home Assistant",ha_disconnected_detail:"Everything on this page still works - it talks to the device directly.
