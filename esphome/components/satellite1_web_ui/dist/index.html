ouncement; another Satellite1 has its Voice Override set and put back; anything else has its media volume set and restored.",remote_wake_chime:"Plays the wake chime on the target speakers too, so you can hear that the device heard you from the room the sound is going to.",area_ducking:"Turns other speakers down while the assistant is busy, then puts them back where they were. It runs from the wake word to the end of the answer, so the room is quiet while it listens to you as well as while it answers. Tick a room to cover every player in it.",duck_volume:"The level they drop to. Players already quieter than this are left alone, so a whole-house group does not get turned up.",temp:"Reads high by design - the sensor sits inside a warm enclosure, next to the board. Calibrate against a thermometer in the same room.",humidity:"Measured at the board, so it drifts with the enclosure temperature. Calibrate against a hygrometer in the same room.",lux:"Ambient light at the front face. Useful for dimming the LED ring automatically from Home Assistant, or for a light-level trigger.",presence:"From the mmWave radar, not the microphones. It sees through the enclosure and does not need line of sight, so it reports an empty room faster than a motion sensor would.",radar_range:"How far out the radar looks, in centimetres. Anything beyond this is ignored even if the radar can see it, which is how you stop it detecting the hallway or the room next door. At zero it uses the module's own default.",radar_stability:"How much agreement it needs before it changes its mind. Higher is steadier and slower: fewer false triggers from a curtain moving, but a longer wait before it admits the room is empty. Lower reacts faster and twitches more.",radar_timeout:"How long presence is held after the radar stops seeing anyone, in seconds. This is what stops the lights going out while you sit still. At zero it clears the moment you are lost, which is usually too eager.",radar_multi:"Tracks several people at once instead of only the strongest return. Needed for the target plot to show more than one person, and for the zone counts to be right in a busy room.",radar_bt:"The radar module's own Bluetooth radio, used by the manufacturer's configuration app. Nothing here needs it, and leaving it on means an unauthenticated radio in the room, so it is off unless you are pairing that app.",calibrate:"Enter what a trusted instrument in the same room reads. The difference is saved as an offset and survives a restart. It does not change the raw reading, only what the device reports.",mute:"Cuts the microphones in hardware, on the XMOS chip, not in software. Wake word detection stops with them. The mute button on the device does the same thing.",wake_sound:"Plays a short chime on the speaker the moment the wake word is detected.",wake_sensitivity:"How readily the wake word fires. Raise it if the device misses you from across the room; lower it if the television sets it off.",voice_override:"Speaker volume used for assistant replies only, independent of media volume. Set to zero to follow the media volume instead.",speaker_channel:"Which side of a stereo source reaches the single speaker. Mono sums both, which is usually what you want.",led_ring:"The ring the assistant animates. Colour and brightness set here are the resting state - the device still overrides both while it is listening, thinking or reporting an error.",timers:"Timers set by voice, held on the device. They keep counting and still ring if Home Assistant goes away.",heap:"Internal RAM still available. This is the number that matters: it is what audio buffers and the network stack allocate from, and it is far scarcer than PSRAM.",psram:"External RAM, used for the large buffers. Installed is the size of the chip; the free and total figures cover the region handed to the allocator, which is smaller because the cache and early allocations sit outside it.",loop:"Longest single pass through the main loop since this panel last read the value. Tens of milliseconds is normal. Sustained hundreds means something is blocking, and audio will stutter before anything else does.",esp_temp:"Temperature of the ESP32 itself, not the room. It reads well above ambient because it sits inside a sealed case next to an amplifier, so a warm number here is normal; sustained readings above 80 \xB0C are worth investigating. The temperature on the Controls page is the one that measures the room.",reset:"Why the device last restarted. 'USB peripheral' means it was flashed. 'Power glitch' or 'Brownout' points at the power supply rather than at the firmware.",xmos:"The audio chip. It owns the microphones, the speaker, the mute button and the LED ring, and runs its own firmware separate from the ESP32's.",xmos_flash:"Rewrites the audio chip's firmware from the image embedded in this build. The device is deaf and mute until it finishes, which takes about a minute. Do not cut power.",safe_mode:"Restarts with everything but wifi and the updater switched off. Use it when the device is crash-looping and will not stay up long enough to accept an update.",factory_reset:"Erases every setting stored on the ESP32, including the wifi credentials, and restarts. You will have to set the device up again from scratch. The audio chip's firmware is not touched.",beta:"Offers pre-release firmware to the updater. Useful for testing a fix; not what you want on a device you rely on.",log:"The device's own log, live. This is the first place to look when something misbehaves, and the most useful thing to attach to a support request."},$={ha_connected:"Connected to Home Assistant",ha_disconnected:"Not connected to Home Assistant",ha_disconnected_detail:"Everything on this page still works - it talks to the device directly. Media and anything that needs your smart home will be unavailable until the connection returns.",stream_lost:"Lost the connection to the device. Retrying.",no_devices:"Only this device. Other Satellite1s on your network will appear here once they are running firmware with this web app.",confirm:"Confirm",cancel:"Cancel",copied:"Copied",ha_pending:"Asking Home Assistant which speakers you have.",ha_never:"Not connected to Home Assistant, so the device does not know which areas or speakers exist. The controls below still hold their current settings and will apply as soon as the connection returns.",ha_refused:"Home Assistant did not answer. Either it is older than 2025.12, or this device is not allowed to perform actions: Settings \u203A Devices & services \u203A ESPHome \u203A this device \u203A CONFIGURE, then tick \u201CAllow the device to perform Home Assistant actions\u201D.",ha_no_area:"This device is not in a Home Assistant area, so \u201CRoute TTS To All Area Players\u201D and \u201CDuck All Area Players\u201D have no room to refer to. You can still pick any room below. Assign it to an area in Home Assistant and refresh.",ha_no_players:"Home Assistant has no media players at all, so there is nothing to choose between.",ha_truncated:"Too many areas to send in one go, so the list is cut short. Players already chosen are still used, whether or not they appear below.",sel_failed:"That change was not saved. The device rejected it, or the connection dropped.",theme_to_dark:"Switch to dark theme",theme_to_light:"Switch to light theme"},dt={Approaching:"Closer","Moving Away":"Away"};var Ae=Promise.resolve();function L(t){let e=()=>fetch(t,{method:"POST"});return Ae=Ae.then(e,e),Ae}function Xt(t,e,n){let s=t.split("/"),r=[s[0],...s.slice(1).map(encodeURIComponent)].join("/"),a=n?`?${new URLSearchParams(n)}`:"";return`/${r}${e?`/${e}`:""}${a}`}function _t(t){let[e,n]=y(null),[s,r]=y(null);return P(()=>{let a=!0,i=null,l=async()=>{try{let d=await fetch("/api/sat1/state");if(!d.ok)throw new Error(`HTTP ${d.status}`);let c=await d.json();if(!a)return;n(c),r(null)}catch(d){a&&r(String(d.message||d))}a&&t&&(i=setTimeout(l,t))};return l(),()=>{a=!1,i&&clearTimeout(i)}},[t]),{device:e,
