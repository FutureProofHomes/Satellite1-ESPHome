onos reads the level off the announcement; another Satellite1 has its Voice Override set and put back; anything else has its media volume set and restored.",remote_wake_chime:"Plays the wake chime on the target speakers too, so you can hear that the device heard you from the room the sound is going to.",area_ducking:"Turns other speakers down while the assistant is busy, then puts them back where they were. It runs from the wake word to the end of the answer, so the room is quiet while it listens to you as well as while it answers. Tick a room to cover every player in it.",duck_volume:"The level they drop to. Players already quieter than this are left alone, so a whole-house group does not get turned up.",temp:"Reads high by design - the sensor sits inside a warm enclosure, next to the board. Calibrate against a thermometer in the same room.",humidity:"Measured at the board, so it drifts with the enclosure temperature. Calibrate against a hygrometer in the same room.",lux:"Ambient light at the front face. Useful for dimming the LED ring automatically from Home Assistant, or for a light-level trigger.",presence:"Sensed by radar, not the microphones. It works through the case and notices people even when they sit completely still.",radar_range:"How far the radar looks. Anything farther away is ignored - use it to stop the radar seeing into the hallway or the next room. All the way left is the full 6m reach.",radar_stability:"How sure the radar must be before it changes its answer. Higher is steadier but slower to notice changes. Lower is quicker but can flicker.",radar_timeout:"How long the room still counts as occupied after the radar loses sight of everyone. Set it high enough that the lights stay on while you sit still.",radar_multi:"Track up to three people at once instead of only the clearest one.",radar_bt:"The radar's own Bluetooth, used only by the manufacturer's phone app. Leave it off unless you use that app.",radar_zones:"Draw shapes on the map above. Each ce, which is why it needs to be reachable to change one, and why there is room for two wake words at a time - these are the Assistant and Assistant 2 settings on this device's Home Assistant page.",stop_word:'While an answer is playing - this device\u2019s own, or one another Satellite1 routed here - the device listens for the single word "stop" and cuts it off everywhere it is playing. A ringing timer can always be silenced by saying stop, whichever way this is set.',wake_sensitivity:"How readily the wake word fires. Raise it if the device misses you from across the room; lower it if the television sets it off.",voice_override:"How loud this device's own speaker is when the assistant replies, independent of media volume. Set to zero to follow the media volume instead. For the speakers you route answers to, see Remote TTS volume in Remote routing below.",speaker_channel:"Which side of a stereo source reaches the single speaker. Mono sums both, which is usually what you want.",led_ring:"The ring the assistant animates. Colour and brightness set here are the resting state - the device still overrides both while it is listening, thinking or reporting an error.",timers:"Timers set by voice, held on the device. They keep counting and still ring if Home Assistant goes away.",media:"Whatever this device is playing right now, from either source: a group stream, or media sent to it by Home Assistant. Track skipping belongs to group streams - media from Home Assistant is a single stream with no queue to skip within. The volume here is the media volume; what the assistant says has its own level, on Config.",heap:"Internal RAM still available. This is the number that matters: it is what audio buffers and the network stack allocate from, and it is far scarcer than PSRAM.",psram:"External RAM, used for the large buffers. Installed is the size of the chip; the free and total figures cover the region handed to the allocator, which is smaller because the cache and early allocations sit outside it.",loop:"Longest single pass through the main loop since this panel last read the value. Tens of milliseconds is normal. Sustained hundreds means something is blocking, and audio will stutter before anything else does.",esp_temp:"Temperature of the ESP32 itself, not the room. It reads well above ambient because it sits inside a sealed case next to an amplifier, so a warm number here is normal; sustained readings above 80 \xB0C are worth investigating. The temperature on the Controls page is the one that measures the room.",reset:"Why the device last restarted. 'USB peripheral' means it was flashed. 'Power glitch' or 'Brownout' points at the power supply rather than at the firmware.",xmos:"The audio chip. It owns the microphones, the speaker, the mute button and the LED ring, and runs its own firmware separate from the ESP32's.",xmos_flash:"Rewrites the audio chip's firmware from the image embedded in this build. The device is deaf and mute until it finishes, which takes about a minute. Do not cut power.",safe_mode:"Restarts with everything but wifi and the updater switched off. Use it when the device is crash-looping and will not stay up long enough to accept an update.",factory_reset:"Erases every setting stored on the ESP32, including the wifi credentials, and restarts. You will have to set the device up again from scratch. The audio chip's firmware is not touched.",beta:"Offers pre-release firmware to the updater. Useful for testing a fix; not what you want on a device you rely on.",log:"The device's own log, live. This is the first place to look when something misbehaves, and the most useful thing to attach to a support request."},x={ha_connected:"Connected to Home Assistant",ha_disconnected:"Not connected to Home Assistant",ha_disconnected_detail:"Everything on this page still works - it talks to the device directly. Media and anything that needs your smart home will be unavailable until the connection returns.",stream_lost:"Lost the connection to
