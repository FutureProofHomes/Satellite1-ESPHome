 device does the same thing.",wake_sound:"Plays a short chime on the speaker the moment the wake word is detected.",wake_sensitivity:"How readily the wake word fires. Raise it if the device misses you from across the room; lower it if the television sets it off.",voice_override:"Speaker volume used for assistant replies only, independent of media volume. Set to zero to follow the media volume instead.",speaker_channel:"Which side of a stereo source reaches the single speaker. Mono sums both, which is usually what you want.",led_ring:"The ring the assistant animates. Colour and brightness set here are the resting state - the device still overrides both while it is listening, thinking or reporting an error.",timers:"Timers set by voice, held on the device. They keep counting and still ring if Home Assistant goes away.",heap:"Internal RAM still available. This is the number that matters: it is what audio buffers and the network stack allocate from, and it is far scarcer than PSRAM.",psram:"External RAM, used for the large buffers. Installed is the size of the chip; the free and total figures cover the region handed to the allocator, which is smaller because the cache and early allocations sit outside it.",loop:"Longest single pass through the main loop since this panel last read the value. Tens of milliseconds is normal. Sustained hundreds means something is blocking, and audio will stutter before anything else does.",reset:"Why the device last restarted. 'USB peripheral' means it was flashed. 'Power glitch' or 'Brownout' points at the power supply rather than at the firmware.",xmos:"The audio chip. It owns the microphones, the speaker, the mute button and the LED ring, and runs its own firmware separate from the ESP32's.",xmos_flash:"Rewrites the audio chip's firmware from the image embedded in this build. The device is deaf and mute until it finishes, which takes about a minute. Do not cut power.",xmos_erase:"Erases the audio chip's firmware. It will not process audi
