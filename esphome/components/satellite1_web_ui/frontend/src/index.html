<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Satellite1</title>
<!-- The home-screen surface. The manifest covers Chrome's add-to-home-screen (over plain HTTP it
     makes a shortcut, not an installed PWA - install wants a secure context - but the shortcut
     carries the same icon and name); the apple-* tags are iOS's own vocabulary for the same thing,
     and the touch icon is fetched from the path in the link with no cookies at all, which is why
     the session gate exempts it. status-bar black-translucent lets the app paint under the notch,
     which viewport-fit=cover above already opted into. -->
<!-- Relative hrefs, not root-absolute: served at "/" they resolve to the same paths they always
     did, and served under a Home Assistant ingress prefix (/api/ingress/<name>/) they resolve
     under it - the one place in this document that must work at both mounts. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- The tab favicon reuses the touch icon: the logo already embedded for the home screen, one more
     link and zero more bytes. Browsers scale the 180px PNG down without complaint. -->
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Satellite1">
<meta name="theme-color" content="#111418">
<!-- Applies the remembered theme before the stylesheet paints. In <head> and not in main.jsx on
     purpose: the app script is at the end of <body>, and setting the attribute there is late enough
     that a phone remembering dark can show a white background first. Inline and tiny for the same
     reason - a separate request would be a second round trip on a seven-socket server.
     Light is the default when nothing is stored. localStorage throws rather than no-ops with site
     data blocked, so the whole thing is guarded; the cost of failure is the default theme. -->
<!-- data-embed marks a page served under a proxy prefix (Home Assistant ingress) - any pathname
     longer than the bare "/" - and app.css zeroes the safe-area insets off it: the embedding
     chrome already clears the notch, and honouring the inset again painted a blank band above the
     top bar. Set here, pre-paint, for the same reason as the theme attribute below it. -->
<script>if(location.pathname.length>1)document.documentElement.dataset.embed="1";
try{var t=localStorage.getItem("sat1.theme");document.documentElement.dataset.theme=t==="dark"?"dark":"light"}catch(e){}
/* iOS Safari auto-zooms onto any focused text control under 16px and leaves the page zoomed after -
   the login field made every first visit end up magnified. maximum-scale=1 turns that off, and iOS
   has ignored it for real pinch gestures since iOS 10, so a person who wants to zoom still can.
   Applied to iOS only (the platform test catches iPadOS masquerading as a Mac): Android Chrome
   would honour it by blocking pinch zoom, which is an accessibility cost for a bug it never had. */
if(/iPhone|iPod|iPad/.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform)))document.querySelector("meta[name=viewport]").content+=",maximum-scale=1";</script>
<style>/*%CSS%*/</style>
</head>
<body>
<!-- The boot splash: painted with the document, before the app script at the end of <body> has even
     been parsed, and removed by App (shell.jsx) the moment the boot phase resolves into a real
     screen. A sibling of #app rather than a child so Preact's first render never reconciles against
     it. Themed by the data-theme script above.
     It wears the login screen's own classes (app.css already sits inlined in <head>), so the first
     paint is the sign-in hero to the pixel; #splash itself only adds the fixed overlay positioning
     and the spinner that stands in for the card. The SVG is a hand-inlined copy of Logo (ui.jsx)
     and the tagline mirrors TEXT.login_sub (copy.js) - neither module has been parsed yet, so both
     are duplicated here on purpose; change them together. -->
<div id="splash" class="login" aria-hidden="true">
<div class="login-glow"></div>
<div class="login-hero">
<svg class="login-logo" viewBox="0 0 79.375 79.375" fill="none" stroke="currentColor" stroke-linecap="square">
<g transform="matrix(1.6754,0,0,1.6754,84.9754,-16.4554)" stroke-width="1.31">
<path d="m -45.44,31.52 11,-10.96 11,10.96 v 16.25 l -5.82,.01"/>
<path d="m -27.49,20.19 10.94,9.29 v 18.3 l 8.35,.03 V 29.29 l -10.94,-9.66 -1.92,1.73"/>
<path stroke-width="1.36" d="m -32.25,47.75 c 0,-7.27 -5.89,-13.42 -13.16,-13.42 h 0 c -.05,0 -.1,0 -.15,.01"/>
<path stroke-width="1.36" d="m -36.31,47.73 c .01,-.12 .01,-.12 .01,-.24 0,-5.03 -4.08,-9.11 -9.11,-9.11 l 0,0 c -.05,0 -.1,0 -.15,.01"/>
<path stroke-width="1.36" d="m -40.36,47.8 c .01,-.12 .01,-.18 .01,-.31 0,-2.8 -2.27,-5.06 -5.06,-5.06 l 0,0 c -.05,0 -.1,0 -.15,.01"/>
<path stroke-width="1.36" d="m -45.41,46.48 a 1.01,1.01 0 0 0 -.15,.01 v 1.38 h 1.09 a 1.01,1.01 0 0 0 .07,-.37 1.01,1.01 0 0 0 -1.01,-1.01 z"/>
</g>
</svg>
<div class="login-name">Satellite1</div>
<div class="login-sub">Your home. Your voice. Your AI.</div>
</div>
<div class="spl-spin"></div>
</div>
<div id="app"></div>
<script>/*%JS%*/</script>
</body>
</html>
