name: Lint

on:
  pull_request:
    branches: [develop]

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run clang-format
        uses: jidicula/clang-format-action@v4.14.0
        with:
          clang-format-version: '18'
          check-path: 'esphome'

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint config/

  openai-realtime-tests:
    name: OpenAI Realtime host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # URL derivation, JSON scanning, base64, the 16 -> 24 kHz resampler, wire-format detection.
      - name: Build and run the helper test
        run: |
          g++ -std=c++17 -O2 -Wall -I esphome/components/openai_realtime -o test_rt_util \
            tests/openai_realtime/test_rt_util.cpp esphome/components/openai_realtime/rt_util.cpp
          ./test_rt_util

      # Every JSON message the component sends, against the ArduinoJson release ESPHome 2026.9
      # pins; then an independent parser (Python's json) validates every one of them.
      - name: Fetch ArduinoJson 7.4.3
        run: git clone --depth 1 --branch v7.4.3 https://github.com/bblanchon/ArduinoJson.git /tmp/ArduinoJson
      - name: Build and run the message test
        run: |
          g++ -std=c++17 -O2 -Wall -I esphome/components/openai_realtime -I /tmp/ArduinoJson/src -o test_rt_messages \
            tests/openai_realtime/test_rt_messages.cpp esphome/components/openai_realtime/rt_messages.cpp \
            esphome/components/openai_realtime/rt_util.cpp
          ./test_rt_messages
          ./test_rt_messages --dump | python3 -c 'import json, sys; [json.loads(line) for line in sys.stdin]'
