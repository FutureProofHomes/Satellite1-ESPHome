name: Lint

on:
  pull_request:
    branches: [develop]

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run clang-format
        uses: jidicula/clang-format-action@v4.14.0
        with:
          clang-format-version: '18'
          check-path: 'esphome'

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint config/

  vendored-micro-wake-word:
    name: vendored micro_wake_word
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Just the pinned esphome, not the whole build environment: the check only needs the
      # upstream component sources to diff against.
      - name: Install the pinned ESPHome
        run: pip install "$(grep -i '^esphome==' requirements.txt)"

      # The vendor's contract, made executable: upstream byte-identical plus FPH-marked lines
      # only, and the two detection log lines mww_runtime_loader parses still present verbatim.
      # See esphome/components/micro_wake_word/FPH_VENDOR.md.
      - name: Verify the vendored copy
        run: |
          site=$(python -c "import esphome, os; print(os.path.join(os.path.dirname(esphome.__file__), 'components', 'micro_wake_word'))")
          scripts/check_vendored_mww.sh "$site"

  web-ui-bundle:
    name: web UI bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esphome/components/satellite1_web_ui/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: esphome/components/satellite1_web_ui/frontend/package-lock.json

      # npm ci, not npm install: the drift check below asserts the committed bundle is
      # byte-identical to a fresh build, and esbuild's minifier output moves between releases.
      # package.json pins exact versions for the same reason.
      - name: Install pinned toolchain
        run: npm ci

      # The hand-rolled SHA-256/HMAC (crypto.subtle is unavailable on plain-HTTP origins) against
      # node:crypto, and the QR encoder round-tripped through jsQR. Both fail silently in the
      # field - a wrong HMAC is just a 401 - so they are verified here instead.
      - name: Run frontend tests
        run: npm test

      - name: Build the bundle
        run: npm run build | tee -a "$GITHUB_STEP_SUMMARY"

      # The bundle ships inside the external component, so a stale dist/ would be flashed to
      # customers without anyone noticing the source had moved on.
      - name: Fail if the committed bundle drifted from source
        working-directory: .
        run: git diff --exit-code -- esphome/components/satellite1_web_ui/dist
