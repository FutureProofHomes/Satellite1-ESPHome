name: Wake verification checks
on:
  push:
    branches: [develop]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python tests/prepare_test_dependencies.py
      - run: python -m unittest discover -s tests -v
      - run: esphome config config/satellite1.yaml > /dev/null
